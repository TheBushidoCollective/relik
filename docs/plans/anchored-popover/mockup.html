<title>Relik · comments attached to their target on every class · mock</title>
<!--
  A local, clickable interaction mock for docs/plans/anchored-popover/plan.md, slice A0.
  It is not the viewer. The panels are placed by this page's own copy of the plan's
  placePopover, placeLeft, revealScrollTop and chooseTargetBox rules (plan 5.2) and the
  layer tracking rules (plan 5.3), measured against stand-in stages that use the viewer's
  class names and tokens (packages/relic-viewer/src/styles.css).

  Fixtures, all from this repository:
  - OTIO: packages/relic-format/test/fixtures/otio/standard-sample.otiod (timeline, track
    ids, clip ranges, markers). The preview is the primary_a.mp4 frame at 1.5 s, inlined.
    Comment bodies come from packages/relic-mcp/test/otio-path.ts.
  - Markdown: README.md. Code: lines 4052 to 4110 of packages/relic-viewer/src/styles.css,
    renumbered from 1, so line 42 is the 350 character .otio-item rule.
  - HTML frame: the relik.link home page body (packages/relic-server/src/app.ts).
    SVG frame: packages/relic-viewer/public/icon.svg.
  - PDF: plan.md section 1, laid out as one page.
  - Video and audio: the 12 s ffmpeg testsrc2 and sine sources the A6b harness generates;
    the poster is the testsrc2 frame at 0:04. Image: ffmpeg smptehdbars at 1600 by 1000.
  - Other comment bodies are fixture strings from the repository's tests.

  Art direction: none new. The accession band, the patina primary, square ruled panels,
  Charter comment text and monospace coordinates are the viewer's own. Rejected: a
  connector or caret (plan 4.10), any decoration on the stages that the viewer lacks.

  Where the plan's state text and the code disagree, the code wins:
  - The OTIO target line reads "v2 · ..." on the version 2 page, because otio-view.ts
    seals relic_version from the viewed revision.
  - Banner copy is plan 5.7 verbatim.

  Everything stays in this page and its localStorage. No network, no media decoding.
-->

.time-marker { position: absolute; top: 50%; width: 3px; height: 12px; padding: 0; border: none; border-radius: 0; background: var(--ink); transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; z-index: 2; box-shadow: 0 0 0 1px var(--surface); }

.time-marker-cluster:hover, .time-marker-cluster.is-active, .time-marker-cluster:focus-visible { outline: 1px solid var(--patina); outline-offset: 1px; z-index: 5; }
/* Fullscreen, simulated inside the frame: the stage takes the device, as :fullscreen takes the screen. */
.media-stage.is-fullscreen { position: absolute; inset: 0; z-index: 30; display: block; background: #000; color-scheme: dark; --surface: #171b1c; --ground: #0e1112; --ink: #e6e9e7; --ink-soft: #969e9d; --rule: #3b4345; --rule-strong: #4d5759; --patina: #4fb3a6; --patina-ink: #a7ded6; --oxide: #c98058; --diff-added: #15332f; }

.media-stage.is-fullscreen .media-chrome { position: absolute; right: 0; bottom: 0; left: 0; width: auto; padding: 0 1rem .5rem; border: 0; border-top: 1px solid var(--rule); background: rgb(8 10 11 / .82); }

.stage-sandboxed-html { display: flex; flex-direction: column; height: 100%; padding: 0; }
.stage-sandboxed-html .doc { flex: 1 1 auto; min-height: 0; margin: 0; max-width: none; }
.usercontent-frame { display: block; width: 100%; height: 100%; border: 0; background: #fff; overflow: auto; overscroll-behavior: contain; }
/* The author's document inside the frame. Its own styles, as the frame would load them. */
.frame-doc { position: relative; min-height: 100%; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; }

.frame-doc h2 { font-family: var(--mono); font-size: .72rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--patina); margin: 2.5rem 0 .75rem; padding-bottom: .4rem; border-bottom: 1px solid var(--rule); }
.frame-doc p { margin: 0 0 1rem; }

.frame-overlay { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 99; }
/* Marks the frame paints in its own document (sandbox.ts). */
.frame-doc .relic-text-mark { background: rgba(180, 140, 60, .28); border-bottom: 2px solid rgba(180, 140, 60, .85); outline: 0; color: inherit; cursor: pointer; }
.frame-doc .relic-text-mark:hover { background: rgba(180, 140, 60, .4); }
.frame-doc .relic-text-mark.is-active { background: rgba(180, 140, 60, .5); outline: 2px solid rgba(180, 140, 60, .9); }
.frame-doc .relic-text-mark.is-pending { background: rgba(180, 140, 60, .16); border-bottom: 2px dashed rgba(180, 140, 60, .85); outline: 0; cursor: default; }
.relic-pin-mark { position: absolute; width: 20px; height: 20px; padding: 0; border: 2px solid #fff; border-radius: 999px; background: rgba(180, 140, 60, .95); box-shadow: 0 0 0 1px rgba(60, 45, 20, .5), 0 1px 3px rgba(0, 0, 0, .3); transform: translate(-50%, -50%); cursor: pointer; pointer-events: auto; }
.relic-pin-mark.is-active { outline: 2px solid rgba(180, 140, 60, .9); outline-offset: 2px; }
.relic-pin-mark.is-pending { background: rgba(180, 140, 60, .18); border: 2px dashed rgba(180, 140, 60, .95); box-shadow: none; pointer-events: none; cursor: default; }

.stage-pdf { display: flex; flex-direction: column; align-items: center; height: 100%; overflow: auto; padding: 1.5rem 1rem; }

.pdf-toolbar .action { padding: .25rem .6rem; font-size: .85rem; border: 1px solid var(--rule); }

.pdf-page-indicator { font-family: var(--mono); font-size: .8rem; color: var(--ink-soft); }
.pdf-page-container { position: relative; display: block; flex: none; width: min(816px, 100%); box-shadow: 0 4px 16px rgba(0, 0, 0, .12); background: #fff; border-radius: 2px; overflow: hidden; }
.pdf-page { container-type: inline-size; aspect-ratio: 8.5 / 11; color: #1b1b1b; background: #fff; font-family: Charter, Georgia, serif; }
.pdf-page-inner { padding: 7.5cqw 9cqw; font-size: 1.72cqw; line-height: 1.5; }

.pdf-page ul { margin: 0 0 .9em; padding-left: 1.4em; }
.pdf-page li { margin: 0 0 .45em; }
.pdf-page .pdf-folio { position: absolute; bottom: 4cqw; left: 0; right: 0; text-align: center; font: 1.4cqw var(--sans); color: #666; }

.mark-page { position: absolute; box-sizing: border-box; border: 2px solid var(--patina); background: rgba(31, 107, 100, .15); border-radius: 2px; pointer-events: auto; cursor: pointer; }

.mark-page.is-pending { border-style: dashed; background: rgba(31, 107, 100, .1); pointer-events: none; }

.card { max-width: 34rem; margin: 3rem auto; padding: 1.75rem; background: var(--surface); border: 1px solid var(--rule); border-top: 3px solid var(--rule-strong); }
.card-title { font-size: 1.15rem; font-weight: 600; margin: 0 0 .35rem; word-break: break-word; }

.stage-diff { display: flex; flex-direction: column; padding: 1.25rem 1.25rem 0; }

.diff-history-note { max-width: 52rem; margin: .45rem 0 0; color: var(--ink-soft); font-size: .88rem; }
.compare-picker { display: flex; align-items: center; gap: .6rem; flex: none; }

.diff-result { display: flex; flex-direction: column; padding-top: .75rem; }
.diff-single { display: flex; flex-direction: column; gap: 1rem; }
.diff-single > .notice { margin: 0; max-width: none; }
.diff-single-label { margin: 0; color: var(--ink-soft); font-family: var(--mono); font-size: .82rem; }
.diff-single > .stage { margin: 0; padding-left: 0; padding-right: 0; }
.diff-single .stage-pdf { height: auto; overflow: visible; }

.thread { display: none; flex: 0 0 auto; width: var(--thread-width, 22rem); max-width: 100%; margin: 0; padding: 0 1.25rem 1.5rem; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--rule-strong); }
.thread.is-open { display: block; }
.thread-tab { position: relative; flex: 0 0 auto; align-self: center; z-index: 5; padding: .85rem .4rem; color: var(--ink); font-family: var(--sans); font-size: .76rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; writing-mode: vertical-rl; background: var(--surface); border: 1px solid var(--rule-strong); border-right: 0; border-radius: 0; cursor: pointer; }

.thread-toggle::after { width: .55rem; height: .55rem; content: ""; border-top: 1px solid currentColor; border-right: 1px solid currentColor; transform: rotate(45deg); }
.thread-toggle:focus-visible { outline: 2px solid var(--patina); outline-offset: -4px; }
.thread-tools { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: 0 0 1rem; }
.mark-mode { padding: .35rem .7rem; color: var(--ink); font-family: var(--sans); font-size: .78rem; font-weight: 600; background: var(--surface); border: 1px solid var(--rule-strong); border-radius: .35rem; cursor: pointer; }
.mark-mode:hover { border-color: var(--patina); color: var(--patina-ink); }
.mark-mode[aria-pressed="true"] { background: var(--patina); color: var(--surface); border-color: var(--patina); }
.mark-mode:focus-visible { outline: 2px solid var(--patina); outline-offset: 2px; }
.thread-hint { font-size: .76rem; color: var(--ink-soft); font-style: italic; line-height: 1.4; }
.thread-note { margin: 0 0 .75rem; color: var(--ink-soft); font-size: .86rem; line-height: 1.55; }
.thread-policy { display: inline-block; color: var(--patina-ink); font-size: .8rem; text-decoration: underline; text-underline-offset: 2px; }
.thread-list { margin: 0 0 2rem; padding: 0; list-style: none; }
.comment { padding: 1rem 0; border-top: 1px solid var(--rule); }
.thread-list .comment { cursor: pointer; }
.comment.is-active { background: color-mix(in srgb, var(--patina) 10%, transparent); }
.comment.is-resolved { opacity: .62; }

.comment-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem; margin-bottom: .4rem; }
.comment-author { font-family: var(--mono); font-size: .74rem; color: var(--ink-soft); overflow-wrap: anywhere; }
.comment-badge { padding: .05rem .4rem; border: 1px solid var(--patina); color: var(--patina-ink); font-family: var(--mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; }
.comment-time { margin-left: auto; color: var(--ink-soft); font-family: var(--mono); font-size: .68rem; white-space: nowrap; }
.comment-body { margin: 0; font-family: var(--serif); font-size: .94rem; line-height: 1.55; overflow-wrap: anywhere; }
.comment-body p { margin: 0; }
.comment-replies { margin: .75rem 0 0 .75rem; padding: 0 0 0 .75rem; border-left: 2px solid var(--rule); list-style: none; }
.comment.comment-reply { padding: .75rem 0 0; border-top: 1px solid var(--rule); }
.comment.comment-reply:first-child { border-top: 0; padding-top: 0; }
.compose { display: grid; gap: .75rem; padding: 1.25rem; background: var(--surface); border: 1px solid var(--rule-strong); border-top: 2px solid var(--patina); }
.compose-title { margin: 0; font-size: .95rem; font-weight: 600; }

.compose-identity strong { font-family: var(--mono); font-size: .8rem; overflow-wrap: anywhere; }
.compose-target { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem; margin: 0; padding: .45rem .65rem; background: var(--ground); border-left: 3px solid var(--patina); font-size: .82rem; }
.compose-target-label { flex: 1 1 auto; min-width: 0; color: var(--ink); overflow-wrap: anywhere; }
.compose-target-clear { flex: 0 0 auto; padding: .1rem .4rem; color: var(--patina-ink); font-family: var(--sans); font-size: .72rem; font-weight: 600; background: transparent; border: 1px solid var(--rule-strong); border-radius: .25rem; cursor: pointer; }
.compose-note { margin: 0; padding: .6rem .75rem; background: var(--ground); border-left: 2px solid var(--oxide); font-size: .84rem; line-height: 1.5; }

.compose-field { display: grid; gap: .3rem; }
.compose-field > span { font-size: .76rem; font-weight: 600; letter-spacing: .02em; }
.compose-input, .compose-textarea { width: 100%; padding: .5rem .6rem; background: var(--ground); border: 1px solid var(--rule-strong); border-radius: 0; color: var(--ink); font: inherit; font-size: .9rem; }
.compose-textarea { font-family: var(--serif); line-height: 1.55; resize: vertical; }
.compose-input:focus-visible, .compose-textarea:focus-visible { outline: 2px solid var(--patina); outline-offset: 1px; }
.compose-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; }
.compose-count { color: var(--ink-soft); font-family: var(--mono); font-size: .7rem; }
.compose .action.primary { justify-self: start; align-self: center; }

/* ---------- the popover layer (styles.css 241-444, with the composer column of 4128-4162 on every class) ---------- */
.popover { position: absolute; z-index: 8; background: var(--surface); color: var(--ink); border: 1px solid var(--rule-strong); box-shadow: 0 6px 18px rgb(0 0 0 / 14%); font-family: var(--sans); font-size: 16px; line-height: 1.55; text-align: left; }
.popover-offer { display: flex; align-items: stretch; }
.popover-card { width: min(22rem, calc(100cqw - 2rem)); max-width: calc(100% - 1rem); padding: .55rem .7rem .5rem; }
.popover-action { padding: .4rem .7rem; background: none; border: 0; border-radius: 0; color: var(--ink); font: inherit; font-size: .82rem; white-space: nowrap; cursor: pointer; }
.popover-offer .popover-action + .popover-action { border-left: 1px solid var(--rule); }
.popover-action:hover { background: color-mix(in srgb, var(--patina) 12%, transparent); }
.popover-action:focus-visible { outline: 2px solid var(--patina); outline-offset: -2px; }
.popover-action:disabled { color: var(--ink-soft); cursor: default; }
.popover-tools { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; padding-top: .45rem; border-top: 1px solid var(--rule); }
.popover-card .popover-action { padding: .2rem .55rem; border: 1px solid var(--rule-strong); font-size: .8rem; }
.popover-card .popover-action.is-primary { background: var(--patina); border-color: var(--patina); color: var(--surface); }
.popover-card .popover-action.is-primary:disabled { background: color-mix(in srgb, var(--patina) 55%, var(--surface)); border-color: transparent; }
.popover-card .popover-action.is-quiet { border-color: transparent; color: var(--ink-soft); }
.popover-thread { margin: 0; padding: 0; list-style: none; }
.popover-thread .comment { padding: .25rem .6rem .5rem; border-top: 0; }
.popover-target { margin: 0 0 .4rem; color: var(--ink-soft); font-size: .78rem; overflow-wrap: anywhere; }
.popover-composer { margin-top: .5rem; }
.popover-field { display: block; width: 100%; min-height: 4.5rem; padding: .4rem; background: var(--ground); border: 1px solid var(--rule-strong); border-radius: 0; color: var(--ink); font: inherit; font-family: var(--serif); font-size: .9rem; resize: vertical; }
.popover-field:focus-visible { outline: 2px solid var(--patina); outline-offset: 1px; }
.popover-field:disabled { color: var(--ink-soft); }
.popover-note { margin: .4rem 0 0; color: var(--oxide); font-size: .76rem; }
.popover-disclosure { margin: .4rem 0 0; color: var(--ink-soft); font-size: .72rem; line-height: 1.5; }
.popover-members { margin: 0; padding: 0; list-style: none; }
.popover-members li + li { border-top: 1px solid var(--rule); }
.popover-member { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: .6rem; row-gap: .15rem; width: 100%; padding: .45rem .3rem; background: none; border: 0; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.popover-member:hover { background: color-mix(in srgb, var(--patina) 12%, transparent); }
.popover-member:focus-visible { outline: 2px solid var(--patina); outline-offset: -2px; }
.popover-member-time { font-family: var(--mono); font-size: .72rem; color: var(--patina); }
.popover-member-author { overflow: hidden; font-family: var(--mono); font-size: .72rem; color: var(--ink-soft); white-space: nowrap; text-overflow: ellipsis; }
.popover-member-body { grid-column: 1 / -1; display: -webkit-box; overflow: hidden; font-family: var(--serif); font-size: .86rem; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
/* The stage composer, on every class: its context scrolls when capped, the field and the actions stay. */
.popover-card.popover-composer { display: flex; flex-direction: column; overflow: hidden; min-width: 0; margin-top: 0; }
.popover-card.popover-composer .popover-bounded-body { flex: 1 1 auto; min-height: 1.35rem; overflow-y: auto; overscroll-behavior: contain; }
.popover-card.popover-composer .popover-target { margin: 0; }
.popover-card.popover-composer .popover-disclosure { margin: .35rem 0 0; }
.popover-card.popover-composer .popover-field { flex: 0 1 4.5rem; height: 4.5rem; min-height: calc(1.4em + .8rem + 2px); margin-top: .5rem; resize: none; }
.popover-card.popover-composer .popover-tools { flex: none; background: var(--surface); }
.popover-card[aria-busy="true"] .popover-field { cursor: progress; }
.popover:focus { outline: none; }
.popover:focus-visible { outline: 2px solid var(--patina); outline-offset: 2px; }

/* ---------- OTIO, from styles.css 3987-4127 ---------- */
.stage-otio { padding: 0 0 2rem; min-width: 0; }
.otio-view { --otio-label-width: 174px; min-width: 0; width: 100%; }

.otio-preview-scope { position: absolute; top: .7rem; left: .7rem; z-index: 1; display: flex; align-items: center; flex-wrap: wrap; gap: .3rem .5rem; max-width: calc(100% - 1.4rem); padding: .2rem .35rem; color: #e6e9e7; background: #080a0bd9; font: .6rem/1.5 var(--mono); }

.otio-context dt { color: var(--ink-soft); }
.otio-context dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }
.otio-schema { margin: 0; color: var(--ink-soft); font: .62rem var(--mono); }
.otio-transport { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; min-height: 46px; padding: .55rem .75rem; border-bottom: 1px solid var(--rule-strong); background: var(--surface); }

.otio-time { font: .7rem var(--mono); font-variant-numeric: tabular-nums; }

<p data-block="p1">Zero-knowledge publishing for agent output. Your coding agent encrypts a file on your machine, uploads only ciphertext, and hands you a link. The service never receives the key.</p>
<pre data-block="pre1"><code>https://relik.link/{id}#{secret}</code></pre>
<p data-block="p2">The fragment is never sent to a server, so the operator holds ciphertext and nothing that opens it. A recipient's browser fetches the ciphertext, decrypts it locally, and renders it by type.</p>
<h2 data-block="h2">What is honest about the claim</h2>
<p data-block="p3">The JavaScript that performs the decryption is served by the same party the zero-knowledge claim is made against, and that party could serve different JavaScript tomorrow. This is a statement about operator intent, not a property a recipient can verify. Anyone claiming otherwise for a service of this shape is overclaiming.</p>
<p data-block="p4">The publish tool returns the full URL including the fragment, because handing you a usable link is the product. <strong>The key therefore enters your model's context and your session transcript on every publish.</strong> Zero-knowledge holds against the Relic operator. It does not hold against your model provider or whoever stores your transcripts, and that is structural rather than a defect on a schedule.</p>
<p data-block="p5">Rendered content is not inert. A relic that renders as HTML or JSX runs its author's code in a sandboxed frame whose policy permits no remote source, so the code cannot make outbound HTTP, WebSocket, or worker requests, and a page that expects external images, fonts, or scripts renders without them. Because browsers do not enforce Content-Security-Policy over WebRTC ICE candidate gathering, the frame bootstrap installs a tested deny-list inside the frame's JavaScript realm: it neutralizes WebRTC constructors across the global prototype chain and blocks nested browsing context creation (iframe, frame, object, embed, portal) to prevent UDP STUN candidate gathering. This is defense in depth alongside the opaque sandbox, not an architectural impossibility. Future browser APIs or parser entry points could reopen egress channels before we patch them, and the containment costs relic capabilities: nested frames and workers in HTML and JSX relics are denied. The sandbox keeps rendered content away from the decryption key, which never leaves the link and your browser. The isolation is about network reach, not safety: the code runs in your browser, can use your CPU, and can render whatever it wants. The viewer says so on the page before the content renders, and so does <code>/policy</code>.</p>
<p data-block="p6">The viewer renders Markdown, code, HTML, JSX, still images, PDF, and provides in-browser players for audio and video media and OpenTimelineIO timelines (<code>.otiod</code> directories packaged as <code>.otioz</code>, or <code>.otioz</code> archives). Arbitrary directories remain refused, while general archives and binaries remain download-only.</p>`;

<h1 data-block="f-h1">Publish a file as an encrypted link</h1>

<p data-block="f-how1">Install the MCP server below, then tell your agent: <em>publish ./report.md as a relic</em>. It hands back a link. Send the link. Whoever opens it sees the file rendered in their browser, decrypted there.</p>

<div class="note"><p data-block="f-cred">Everything after the <code>#</code> is the decryption key. Anyone holding the whole link can read the file, and there are no per-recipient permissions to revoke. Treat it like a password, and know that a chat client or ticket system that truncates the fragment hands over a link that cannot decrypt anything.</p></div>
<h2>Claude Code</h2>
<p>One command. <code>npx</code> fetches the server on first use and caches it.</p>
<pre><code>claude mcp add relic -- npx -y relic-mcp@latest</code></pre>
<h2>Claude Code, as a plugin</h2>

<h2>What leaves your machine</h2>
<div class="note"><p data-block="f-leave1">The server generates the key on your machine and encrypts in-process. Only ciphertext is uploaded. The key lives in the link fragment, and browsers never send a fragment to a server.</p>
<p data-block="f-leave2">Being straight about the limit: the page that decrypts is served by us, so that half rests on our intent rather than on something you can verify. The half that is structural is that we never receive the key.</p></div>
<h2>What the recipient needs</h2>
<p data-block="f-need">A browser, and the whole link including the part after the <code>#</code>. No account, no install, nothing to sign up for. They can copy the link, download the file, compare it against earlier versions if the publisher republished, and leave a comment whose text is encrypted the same way the file is.</p>
<h2>Links stay until deleted</h2>
<p data-block="f-stay">A relic is kept until it is deleted. The publisher can ask for a lifetime when creating it; without one, the link does not age out.</p>
<footer><span>What we store and what we can see</span> &middot; <span>Report a relic</span></footer>

/* ================================================================ measuring, plan 5.1 */
function scrollerBetween(node, host) {
  for (let el = node.parentElement; el && el !== host; el = el.parentElement) {
    const cs = getComputedStyle(el);
    if (cs.overflowX !== 'visible' || cs.overflowY !== 'visible') return el;
  }
  return null;
}
function measureMarks(v, id) {
  const host = v.host;
  const nodes = [...host.querySelectorAll('[data-comment-id]')].filter((n) => n.dataset.commentId === id && !n.closest('.popover'));
  if (!nodes.length) return undefined;
  let full, first;
  const texts = nodes.filter((n) => n.tagName === 'MARK');
  if (texts.length) {
    const rects = [];
    for (const n of texts) for (const r of n.getClientRects()) if (nonEmpty(r)) rects.push(rectOf(r));
    if (!rects.length) return undefined;
    full = union(rects);
    const fr = [...texts[0].getClientRects()].find(nonEmpty);
    first = fr ? rectOf(fr) : undefined;
  } else {
    const n = nodes.find((x) => nonEmpty(x.getBoundingClientRect()));
    if (!n) return undefined;
    full = rectOf(n.getBoundingClientRect());
  }
  const clip = scrollerBetween(nodes[0], host);
  if (clip) {
    const box = clientBox(clip);
    full = intersect(full, box);
    if (!full) return undefined;
    if (first) first = intersect(first, box);
  }
  return chooseTargetBox(toContent(full, host), first ? toContent(first, host) : undefined, host.clientHeight);
}

/* ---------- markdown and code ---------- */
function textAdapter(v, o, isCode) {
  const stage = h('main', { class: `stage stage-${isCode ? 'code' : 'markdown'}` });

  let surface;
  if (isCode) {
    const gutter = h('pre', { class: 'gutter', 'aria-hidden': 'true' }, CODE_LINES.map((_, i) => String(i + 1)).join('\n'));

    CODE_LINES.forEach((line, i) => { const span = h('span', { class: 'code-line', 'data-block': `L${i + 1}`, html: highlightCss(line) }); code.append(span); if (i < CODE_LINES.length - 1) code.append('\n'); });
    surface = h('pre', { class: 'code-body', 'data-block': 'root' }, code);
    doc.append(h('div', { class: 'code' }, gutter, surface));
  } else {
    surface = h('article', { class: 'prose', 'data-block': 'root', html: MD_HTML });
    doc.append(h('div', { class: 'toggle-row' }, h('button', { type: 'button', class: 'action' }, icon('source'), h('span', null, 'View source'))), surface);
  }
  const pins = h('div', { class: 'comment-pins' });
  doc.append(pins);
  stage.append(doc);

  const resolveText = (anchor) => {
    const block = surface.querySelector(`[data-block="${anchor.block}"]`) || (anchor.block === 'root' ? surface : null);
    if (!block) return null;
    if (anchor.start === undefined) {
      const at = offsetsOf(block, anchor.find);
      if (!at) return null;
      Object.assign(anchor, at, { quote: anchor.find });
    }
    return block;
  };
  const pinPoint = (anchor) => {
    if (anchor.at) {
      const el = surface.querySelector(`[data-block="${anchor.at.block}"]`);
      const d = doc.getBoundingClientRect(), r = el.getBoundingClientRect();
      return { x: (r.left - d.left + r.width * anchor.at.fx) / d.width, y: (r.top - d.top + r.height * anchor.at.fy) / d.height };
    }
    return { x: anchor.x, y: anchor.y };
  };
  const paint = () => {
    unwrap(surface, 'mark.relic-text-mark');
    pins.replaceChildren();
    let n = 0;
    for (const c of v.comments) {
      if (c.anchor.kind === 'text') {
        const block = resolveText(c.anchor);
        if (block) wrapOffsets(block, c.anchor.start, c.anchor.end, () => h('mark', { class: textMarkClass(v, c), 'data-comment-id': c.id }));
      } else if (c.anchor.kind === 'pin') {
        n += 1;
        const p = pinPoint(c.anchor);
        pins.append(h('button', { type: 'button', class: `comment-pin${c.id === v.activeId ? ' is-active' : ''}${c.resolved ? ' is-resolved' : ''}`, 'data-comment-id': c.id, 'aria-label': `Comment ${n}: ${c.body}`, style: `left:${p.x * 100}%;top:${p.y * 100}%` }, String(n)));
      }
    }
    const pending = v.pendingAnchor();
    if (pending && pending.kind === 'text') {
      const block = resolveText(pending);
      if (block) wrapOffsets(block, pending.start, pending.end, () => h('mark', { class: 'relic-text-mark is-pending', 'data-comment-id': PENDING }));
    } else if (pending && pending.kind === 'pin') {
      const p = pinPoint(pending);
      pins.append(h('span', { class: 'comment-pin is-pending', 'data-comment-id': PENDING, style: `left:${p.x * 100}%;top:${p.y * 100}%` }));
    }
  };
  const selectBlock = (blockName, find) => {
    const block = surface.querySelector(`[data-block="${blockName}"]`);
    const at = offsetsOf(block, find);
    return { block, at };
  };
  const offerFor = (block, at, quote) => {
    const range = rangeAt(block, at.start, at.end);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    const rects = [...range.getClientRects()].filter(nonEmpty);
    v.showOffer({ kind: 'text', block: block.dataset.block, start: at.start, end: at.end, quote }, rects[0] ? union(rects.slice(0, 1)) : rectOf(range.getBoundingClientRect()), quote);
  };
  surface.addEventListener('mouseup', () => setTimeout(() => {
    if (v.armed) return;
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    if (!surface.contains(range.commonAncestorContainer)) return;
    const quote = range.toString();
    if (!quote.trim()) return;
    const anc = range.commonAncestorContainer.nodeType === 1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentElement;
    const block = anc.closest('[data-block]') || surface;
    const at = selectionOffsets(block, range);
    const rects = [...range.getClientRects()].filter(nonEmpty);
    v.showOffer({ kind: 'text', block: block.dataset.block, start: at.start, end: at.end, quote }, rects.length ? rects[0] : rectOf(range.getBoundingClientRect()), quote);
  }, 0));
  doc.addEventListener('click', (e) => {
    if (!v.armed || e.target.closest('[data-comment-id], .popover')) return;
    const d = doc.getBoundingClientRect();
    v.aimOnStage({ kind: 'pin', x: (e.clientX - d.left) / d.width, y: (e.clientY - d.top) / d.height }, toContent({ left: e.clientX - 10, top: e.clientY - 10, width: 20, height: 20 }, v.host));
  });
  const scroller = isCode ? doc.querySelector('.code') : null;
  return {
    stage, doc, surface, pins, scroller, paint,
    measure: (id) => measureMarks(v, id),
    tools(el) {
      el.append(pinToolButton(v, 'Point at something', MARK_PIN_HINT, () => v.host), h('span', { class: 'thread-hint' }, 'Select text in document to quote'));
    },
    reveal(id) { const m = v.host.querySelector(`[data-comment-id="${id}"]`); if (m && scroller) revealInScroller(m, scroller); },
    gestureTarget: (t) => v.armed && doc.contains(t),
    selectText(blockName, find) { const { block, at } = selectBlock(blockName, find); offerFor(block, at, find); },
    selectWhole(blockName) { const block = surface.querySelector(`[data-block="${blockName}"]`); offerFor(block, { start: 0, end: block.textContent.length }, block.textContent); },
    placePin(fx, fy) { const d = doc.getBoundingClientRect(); v.aimOnStage({ kind: 'pin', x: fx, y: fy }, toContent({ left: d.left + d.width * fx - 10, top: d.top + d.height * fy - 10, width: 20, height: 20 }, v.host)); },
    pinOnBlock(blockName, fx, fy) { const el = surface.querySelector(`[data-block="${blockName}"]`); const d = doc.getBoundingClientRect(), r = el.getBoundingClientRect(); this.placePin((r.left - d.left + r.width * fx) / d.width, (r.top - d.top + r.height * fy) / d.height); },
  };
}
function rangeAt(block, start, end) {
  let pos = 0;
  const range = document.createRange();
  let started = false;
  for (const node of textNodesIn(block)) {
    const len = node.data.length;
    if (!started && start <= pos + len) { range.setStart(node, start - pos); started = true; }
    if (started && end <= pos + len) { range.setEnd(node, end - pos); break; }
    pos += len;
  }

}
function revealInScroller(el, scroller) {
  const r = el.getBoundingClientRect(), b = clientBox(scroller);
  if (r.left < b.left + 16) scroller.scrollLeft -= b.left + 16 - r.left;
  else if (r.right > b.left + b.width - 16) scroller.scrollLeft += r.right - (b.left + b.width - 16);
  if (r.top < b.top + 16) scroller.scrollTop -= b.top + 16 - r.top;
  else if (r.bottom > b.top + b.height - 16) scroller.scrollTop += r.bottom - (b.top + b.height - 16);
}
function highlightCss(line) {
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc(line)
    .replace(/(\/\*.*?\*\/)/g, '<span class="tok-com">$1</span>')
    .replace(/("[^"]*")/g, '<span class="tok-str">$1</span>')
    .replace(/(^|[\s:(,])(-?\d*\.?\d+)(px|rem|em|%|ms|s|deg)?(?=[\s;,)])/g, '$1<span class="tok-num">$2$3</span>');
}

/* ---------- image ---------- */
function imageAdapter(v) {
  const stage = h('main', { class: 'stage stage-image' });
  const img = h('img', { class: 'relic-image', src: BARS, alt: 'smpte-bars.png', width: '1600', height: '1000', draggable: 'false' });
  const overlay = h('div', { class: 'comment-pins' });
  const wrap = h('div', { class: 'mk-image-wrap', tabindex: '-1' }, img, overlay);
  stage.append(h('div', { class: 'doc doc-image' }, wrap));
  let keyBox = null, drawing = null;
  const pct = (r) => `left:${r.x * 100}%;top:${r.y * 100}%;width:${r.w * 100}%;height:${r.h * 100}%`;
  const paint = () => {
    overlay.replaceChildren();
    let n = 0;
    for (const c of v.comments) {
      n += 1;
      if (c.anchor.kind === 'region') overlay.append(h('div', { class: `comment-region${c.id === v.activeId ? ' is-active' : ''}${c.resolved ? ' is-resolved' : ''}`, 'data-comment-id': c.id, role: 'button', 'aria-label': `Comment ${n}: ${c.body}`, style: pct(c.anchor.rect) }, h('span', { class: 'comment-region-badge' }, String(n))));
      else if (c.anchor.kind === 'pin') overlay.append(h('button', { type: 'button', class: `comment-pin${c.id === v.activeId ? ' is-active' : ''}`, 'data-comment-id': c.id, 'aria-label': `Comment ${n}: ${c.body}`, style: `left:${c.anchor.x * 100}%;top:${c.anchor.y * 100}%` }, String(n)));
    }
    const p = v.pendingAnchor();
    if (p && p.kind === 'region') overlay.append(h('div', { class: 'comment-region is-pending', 'data-comment-id': PENDING, style: pct(p.rect) }));
    if (p && p.kind === 'pin') overlay.append(h('span', { class: 'comment-pin is-pending', 'data-comment-id': PENDING, style: `left:${p.x * 100}%;top:${p.y * 100}%` }));
    if (keyBox) overlay.append(h('div', { class: 'comment-region is-keyboard', style: pct(keyBox) }));
    if (drawing) overlay.append(h('div', { class: 'comment-region is-drawing', style: pct(drawing) }));
  };
  const frac = (e) => { const r = wrap.getBoundingClientRect(); return { x: clamp((e.clientX - r.left) / r.width, 0, 1), y: clamp((e.clientY - r.top) / r.height, 0, 1) }; };
  const boxFor = (rect) => { const r = wrap.getBoundingClientRect(); return toContent({ left: r.left + rect.x * r.width, top: r.top + rect.y * r.height, width: rect.w * r.width, height: rect.h * r.height }, v.host); };
  let start = null;
  wrap.addEventListener('pointerdown', (e) => {
    if (!v.armed || e.button !== 0 || e.target.closest('[data-comment-id]')) return;
    e.preventDefault();
    start = frac(e);
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', (e) => {
    if (!start) return;
    const p = frac(e);
    drawing = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) };
    paint();
  });
  wrap.addEventListener('pointerup', (e) => {
    if (!start) return;
    const p = frac(e);
    const rect = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) };
    start = null; drawing = null;
    const r = wrap.getBoundingClientRect();
    if (rect.w * r.width < 6 && rect.h * r.height < 6) v.aimOnStage({ kind: 'pin', x: p.x, y: p.y }, toContent({ left: e.clientX - 10, top: e.clientY - 10, width: 20, height: 20 }, v.host));
    else v.aimOnStage({ kind: 'region', rect }, boxFor(rect));
  });
  wrap.addEventListener('keydown', (e) => {
    if (!v.armed) return;
    const step = 0.02;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
      e.preventDefault();
      keyBox = keyBox || { x: 0.4, y: 0.4, w: 0.2, h: 0.2 };
      const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
      const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
      if (e.shiftKey) { keyBox.w = clamp(keyBox.w + dx, 0.04, 1 - keyBox.x); keyBox.h = clamp(keyBox.h + dy, 0.04, 1 - keyBox.y); }
      else { keyBox.x = clamp(keyBox.x + dx, 0, 1 - keyBox.w); keyBox.y = clamp(keyBox.y + dy, 0, 1 - keyBox.h); }
      paint();
    } else if (e.key === 'Enter' && keyBox) {
      e.preventDefault();
      const rect = { ...keyBox };
      keyBox = null;
      v.aimOnStage({ kind: 'region', rect }, boxFor(rect), { focus: true });
    }
  });
  return {
    stage, wrap, paint,
    measure: (id) => measureMarks(v, id),
    tools(el) { el.append(pinToolButton(v, 'Mark a region or point', MARK_REGION_HINT, () => wrap)); },
    gestureTarget: (t) => v.armed && wrap.contains(t),
    region(rect) { v.aimOnStage({ kind: 'region', rect }, boxFor(rect)); },
    pin(x, y) { const r = wrap.getBoundingClientRect(); v.aimOnStage({ kind: 'pin', x, y }, toContent({ left: r.left + x * r.width - 10, top: r.top + y * r.height - 10, width: 20, height: 20 }, v.host)); },
    keyboard(steps) {
      v.arm(v.tools?.querySelector('.mark-mode'), MARK_REGION_HINT, wrap);
      wrap.focus({ preventScroll: true });
      for (const key of steps) wrap.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
    },
    keyboardEnter() { wrap.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); },
  };
}

    if (p && p.kind === 'frame-pin') overlay.append(h('span', { class: 'relic-pin-mark is-pending', 'data-comment-id': PENDING, style: `left:${p.x}px;top:${p.y}px` }));

    v.showOffer({ kind: 'frame-text', block: block.dataset.block, start: at.start, end: at.end, quote }, rects.length ? rectOf(rects[0]) : rectOf(range.getBoundingClientRect()), quote);

  };

    if (!v.armed || e.target.closest('[data-comment-id]')) return;

    stage, frame, fdoc, paint,
    measure: (id) => measureMarks(v, id),
    tools(el) { el.append(pinToolButton(v, 'Point at something', null, () => fdoc), h('span', { class: 'thread-hint' }, 'Select text inside document to quote')); },
    reveal(id) { const m = fdoc.querySelector(`[data-comment-id="${id}"]`); if (m) revealInScroller(m, frame); },
    gestureTarget: (t) => v.armed && fdoc.contains(t),

async function shortenUntilCapped(v) {

  S('Image', 'image-2', 'I2', 'image', 'Posted: the card sits on the region badge; the sidebar state and its chip are unchanged', async (v) => { if (wide()) v.setSidebar(true); await settle(1); v.adapter.region({ x: 0.29, y: 0.76, w: 0.2, h: 0.22 }); v.type('First pass looks right.'); v.post({ instant: true }); }),
  S('Image', 'image-3', 'I3', 'image', 'A press on a region opens its card', async (v) => { v.openCard('c1', true, { focus: 'first' }); }),
  S('Image', 'image-4', 'I4', 'image', 'The keyboard box: arrows move it, Enter opens the composer', async (v) => { v.adapter.keyboard(['ArrowDown', 'ArrowDown', 'ArrowDown', 'ArrowDown', 'ArrowDown', 'ArrowDown', 'ArrowDown', 'ArrowDown', 'ArrowDown', 'ArrowDown']); await settle(1); v.adapter.keyboardEnter(); }),
  S('Image', 'image-5', 'I5', 'image', 'A point placed at 30% and 40%: the composer opens above the dashed provisional pin', async (v) => { v.adapter.pin(0.3, 0.4); }),

  /* ---------- PDF ---------- */
  S('PDF', 'pdf-1', 'P1', 'pdf', 'Mark on page, then a box dragged on page 1: the composer opens above; the sidebar chip is untouched', async (v) => { if (wide()) v.setSidebar(true); v.adapter.box({ x: 0.08, y: 0.64, w: 0.84, h: 0.12 }); }),
  S('PDF', 'pdf-2', 'P2', 'pdf', 'Posted: the card sits on the new page mark', async (v) => { v.adapter.box({ x: 0.08, y: 0.64, w: 0.84, h: 0.12 }); v.type('Need citation on line 12.'); v.post({ instant: true }); }),
  S('PDF', 'pdf-3', 'P3', 'pdf', 'A press on a page mark opens its card', async (v) => { v.openCard('c1', true, { focus: 'first' }); }),

  /* ---------- HTML frame ---------- */
  S('HTML', 'html-1', 'F1', 'html', 'A sentence selected inside the frame: the offer sits above it, in stage coordinates', async (v) => { await frameTarget(v); }),
  S('HTML', 'html-1b', 'F1b', 'html', 'Comment: the composer opens above the selection in the frame', async (v) => { await frameTarget(v); v.commentFromOffer(); }),
  S('HTML', 'html-1c', 'F1c', 'html', 'Posted: the card sits on the new mark inside the frame', async (v) => { await frameTarget(v); v.commentFromOffer(); v.type('Feedback on text.'); v.post({ instant: true }); }),
  S('HTML', 'html-2a', 'F2a', 'html', 'The frame scrolled with the target in view: the panel follows', async (v) => { await frameTarget(v); v.commentFromOffer(); await settle(2); const p = v.layer.current().getBoundingClientRect(); const hostTop = v.host.getBoundingClientRect().top; v.adapter.frame.scrollTop += Math.max(40, Math.min(200, Math.round(p.top - hostTop - 16))); }),
  S('HTML', 'html-2b', 'F2b', 'html', 'The frame scrolled until the target is out of view: the panel holds still', async (v) => { await frameTarget(v); v.commentFromOffer(); await settle(2); v.heldRect = rectOf(v.layer.current().getBoundingClientRect()); const m = v.host.querySelector(`[data-comment-id="${PENDING}"]`); v.adapter.frame.scrollTop += m.getBoundingClientRect().bottom - clientBox(v.adapter.frame).top + 40; }),
  S('HTML', 'html-3', 'F3', 'html', 'Hover a mark inside the frame: the card opens unpinned and the sidebar stays closed', async (v) => { v.adapter.reveal('c1'); await settle(1); v.openCard('c1', false); }),
  S('HTML', 'html-4', 'F4', 'html', 'Click a mark inside the frame: the card is pinned and the sidebar stays closed', async (v) => { v.adapter.reveal('c1'); await settle(1); v.openCard('c1', true, { focus: 'first' }); }),
  S('HTML', 'html-5', 'F5', 'html', 'Point at something, then a press inside the frame: the composer opens at the provisional pin', async (v) => { v.adapter.point(Math.min(220, Math.round(v.adapter.frame.clientWidth * 0.55)), Math.round(v.adapter.frame.clientHeight * 0.62)); }),

  /* ---------- SVG frame ---------- */
  S('SVG', 'svg-1', 'S1', 'svg', 'Point at something, then a press at 200, 150 in the frame: the composer opens at the provisional pin', async (v) => { v.adapter.point(200, 150); }),
  S('SVG', 'svg-2', 'S2', 'svg', 'Posted: the card sits on the new pin inside the frame', async (v) => { v.adapter.point(200, 150); v.type('And this bit of the diagram.'); v.post({ instant: true }); }),

  /* ---------- version banner ---------- */
  S('Banner', 'banner-video-2', 'B2', 'video', 'Video at version 2 of 2: "Earlier versions", no notice on the page', async () => {}),
  S('Banner', 'banner-pdf-2', 'B3', 'pdf', 'PDF at version 2 of 2: "Earlier versions", no notice on the page', async () => {}),
  S('Banner', 'banner-video-1', 'B5', 'video', 'Video, version 1 opened on its own: the reason in the recording\'s words', async () => {}, { opts: { earlier: true, returnTo: 'banner-video-2' } }),
  S('Banner', 'banner-pdf-1', 'B6', 'pdf', 'PDF, version 1 opened on its own: the reason in the PDF\'s words', async () => {}, { opts: { earlier: true, returnTo: 'banner-pdf-2' } }),
  S('Banner', 'banner-download', 'B7', 'download', 'Download-only relic: it keeps its notice on the current page', async () => {}),
  S('Banner', 'banner-markdown-1', 'B8', 'markdown', 'Markdown at version 1 of 2: comparable, so "Compare versions" and no notice', async () => {}, { opts: { version: { shown: 1, current: 2 } } }),
];
const STATE_BY_ID = Object.fromEntries(STATES.map((s) => [s.id, s]));
/* The banner group also lists the OTIO states that carry its two OTIO cases. */
const BANNER_ALIASES = [{ id: 'otio-1', label: 'B1', title: 'OTIO at version 2 of 2: "Earlier versions", no notice on the page' }, { id: 'otio-10', label: 'B4', title: 'OTIO, version 1 opened on its own: the reason in the timeline\'s words' }];

async function frameTarget(v) {
  const block = v.adapter.fdoc.querySelector('[data-block="f-how1"]');
  const frame = v.adapter.frame;
  frame.scrollTop = Math.max(0, block.offsetTop - Math.round(frame.clientHeight * 0.55));
  await settle(1);
  v.adapter.selectText('f-how1', 'Whoever opens it sees the file rendered in their browser, decrypted there.');
}

/* ================================================================ mock chrome */
const device = document.getElementById('device');
const store = { state: 'otio-1', frame: 'fit', theme: 'system' };
try { Object.assign(store, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch { /* storage refused: defaults */ }
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(store)); } catch { /* storage refused */ } };
if (!STATE_BY_ID[store.state]) store.state = 'otio-1';
let running = 0;

async function go(id) {
  const state = STATE_BY_ID[id];
  if (!state) return;
  const ticket = running += 1;
  store.state = id;
  save();
  document.documentElement.dataset.mockReady = '0';
  device.style.height = '';
  device.style.width = '';
  viewer?.destroy();
  viewer = new Viewer(device, state.cls, state.opts || {});
  viewer.instant = true;
  paintChrome();
  await settle(2);
  if (ticket !== running) return;
  try { await state.run(viewer); } catch (error) { document.documentElement.dataset.mockError = String(error && error.stack || error); throw error; }
  await settle(3);
  if (ticket !== running) return;
  viewer.instant = false;
  document.documentElement.dataset.mockState = id;
  document.documentElement.dataset.mockReady = '1';
}

function paintChrome() {
  const state = STATE_BY_ID[store.state];
  const title = document.getElementById('mk-title');
  title.replaceChildren(h('b', null, `${state.group} ${state.label}`), state.title);
  title.title = `${state.group} ${state.label}: ${state.title}`;
  for (const b of document.querySelectorAll('[data-state]')) b.setAttribute('aria-current', String(b.dataset.state === store.state));
  for (const b of document.querySelectorAll('[data-frame-value]')) b.setAttribute('aria-pressed', String(b.dataset.frameValue === store.frame));
  for (const b of document.querySelectorAll('[data-theme-value]')) b.setAttribute('aria-pressed', String(b.dataset.themeValue === store.theme));
  const chip = document.querySelector(`#mk-chips [data-state="${store.state}"]`);
  if (chip) { const nav = chip.parentElement; const l = chip.offsetLeft - nav.clientWidth / 2 + chip.offsetWidth / 2; nav.scrollLeft = Math.max(0, l); }
}
function applyFrame() {
  device.dataset.frame = store.frame;
  requestAnimationFrame(() => {
    const floor = document.getElementById('mk-floor');
    device.classList.toggle('is-inset', device.offsetWidth < floor.clientWidth - 1 || device.offsetHeight < floor.clientHeight - 1);
    viewer?.layer.reposition();
    viewer?.fullscreenLayer?.reposition();
  });
}
function applyTheme() { document.documentElement.dataset.theme = store.theme; }

function buildChrome() {
  const frames = [['fit', 'Fit'], ['1440', '1440'], ['390', '390'], ['320', '320']];
  const themes = [['system', 'System'], ['light', 'Light'], ['dark', 'Dark']];
  for (const group of document.querySelectorAll('[data-control="frame"]')) group.replaceChildren(...frames.map(([value, label]) => h('button', { type: 'button', class: 'mk-btn', 'data-frame-value': value, 'aria-pressed': 'false', onclick: () => { store.frame = value; save(); applyFrame(); paintChrome(); } }, label)));
  for (const group of document.querySelectorAll('[data-control="theme"]')) group.replaceChildren(...themes.map(([value, label]) => h('button', { type: 'button', class: 'mk-btn', 'data-theme-value': value, 'aria-pressed': 'false', onclick: () => { store.theme = value; save(); applyTheme(); paintChrome(); } }, label)));
  const chips = document.getElementById('mk-chips');
  const sections = document.getElementById('mk-sections');
  const groups = [];
  for (const s of STATES) { let g = groups.find((x) => x.name === s.group); if (!g) groups.push(g = { name: s.group, items: [] }); g.items.push(s); }
  const banner = groups.find((g) => g.name === 'Banner');
  banner.items.unshift(...BANNER_ALIASES.map((a) => ({ ...STATE_BY_ID[a.id], label: a.label, title: a.title, alias: true })));
  const groupTitles = { OTIO: 'OpenTimelineIO', Video: 'Video', Audio: 'Audio', Markdown: 'Markdown', Code: 'Code', Image: 'Image', PDF: 'PDF', HTML: 'HTML in the sandboxed frame', SVG: 'SVG in the sandboxed frame', Banner: 'Version banner' };
  for (const g of groups) {
    chips.append(h('span', { class: 'mk-chip-group' }, g.name));
    for (const s of g.items) if (!s.alias) chips.append(h('button', { type: 'button', class: 'mk-btn', 'data-state': s.id, title: `${s.group} ${s.label}: ${s.title}`, onclick: () => go(s.id) }, s.label));
    sections.append(h('section', { class: 'mk-section' }, h('h3', null, groupTitles[g.name]), h('ol', null, g.items.map((s) => h('li', null, h('button', { type: 'button', class: 'mk-state', 'data-state': s.id, onclick: () => { closeDrawer(); go(s.id); } }, h('b', null, s.label), h('span', null, s.title)))))));
  }
  document.getElementById('mk-prev').append(icon('chevron'));
  document.getElementById('mk-next').append(icon('chevron'));
  const step = (d) => { const i = STATES.findIndex((s) => s.id === store.state); go(STATES[(i + d + STATES.length) % STATES.length].id); };
  document.getElementById('mk-prev').addEventListener('click', () => step(-1));
  document.getElementById('mk-next').addEventListener('click', () => step(1));
  const drawer = document.getElementById('mk-drawer');
  const opener = document.getElementById('mk-open');
  const openDrawer = () => { drawer.style.setProperty('--mk-drawer-top', `${document.getElementById('mk-bar').getBoundingClientRect().bottom}px`); drawer.hidden = false; opener.setAttribute('aria-expanded', 'true'); };
  function closeDrawer() { drawer.hidden = true; opener.setAttribute('aria-expanded', 'false'); }
  opener.addEventListener('click', () => (drawer.hidden ? openDrawer() : closeDrawer()));
  document.getElementById('mk-close').addEventListener('click', closeDrawer);
  document.getElementById('mk-reset').addEventListener('click', () => { try { localStorage.removeItem(STORE); } catch { /* storage refused */ } Object.assign(store, { state: 'otio-1', frame: 'fit', theme: 'system' }); applyTheme(); applyFrame(); closeDrawer(); go('otio-1'); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !drawer.hidden) closeDrawer(); });
  window.addEventListener('resize', () => applyFrame());
}

/* ================================================================ the proof probe, plan 5.8 */
window.mockProbe = () => {
  const v = viewer;
  const out = { state: store.state, ready: document.documentElement.dataset.mockReady === '1', viewport: { width: innerWidth, height: innerHeight }, overflowX: document.documentElement.scrollWidth - document.documentElement.clientWidth, bodyOverflowX: document.body.scrollWidth - document.body.clientWidth };
  if (!v) return out;
  out.sidebarOpen = v.isOpen();
  out.chip = v.chipLabel ? v.chipLabel.textContent : null;
  out.count = v.countBadge ? v.countBadge.textContent : null;
  const layer = v.fullscreenLayer?.current() ? v.fullscreenLayer : v.layer;
  const panel = layer.current();
  out.offer = v.offer ? rectOf(v.offer.panel.getBoundingClientRect()) : null;
  if (v.offer) { const sel = window.getSelection(); out.offerAnchor = sel && sel.rangeCount ? rectOf([...sel.getRangeAt(0).getClientRects()].find(nonEmpty) || sel.getRangeAt(0).getBoundingClientRect()) : null; }
  if (!panel) return out;
  const host = layer.host;
  const box = layer.opts.follow ? layer.opts.follow() : layer.stored;
  out.held = !box;
  out.heldRect = v.heldRect || null;
  out.panel = rectOf(panel.getBoundingClientRect());
  out.anchor = box ? toClient(box, host) : null;
  out.host = clientBox(host);
  out.side = panel.dataset.side;
  out.capped = panel.dataset.capped === 'true';
  out.prefer = layer.opts.prefer;
  out.kind = panel.dataset.anchorKind;
  out.isComposer = panel.classList.contains('popover-composer');
  out.commentId = panel.dataset.commentId || null;
  out.busy = panel.getAttribute('aria-busy') === 'true';
  out.focusInside = panel.contains(document.activeElement);
  const hit = (el) => {
    if (!el) return null;
    const r = el.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const at = document.elementFromPoint(x, y);
    return { rect: rectOf(r), owns: !!at && (at === el || el.contains(at)) };
  };
  if (out.isComposer) {
    out.field = hit(panel.querySelector('textarea.popover-field'));
    out.post = hit(panel.querySelector('.popover-action.is-primary'));
    out.cancel = hit([...panel.querySelectorAll('button')].find((b) => b.textContent === 'Cancel'));
    const body = panel.querySelector('.popover-bounded-body');
    out.body = { scrollHeight: body.scrollHeight, clientHeight: body.clientHeight };
    out.draft = panel.querySelector('textarea').value;
  }
  if (out.anchor) {
    const cx = out.anchor.left + out.anchor.width / 2, cy = out.anchor.top + out.anchor.height / 2;
    const at = document.elementFromPoint(cx, Math.max(cy, out.anchor.top + 1));
    out.anchorExposed = !(at && at.closest && at.closest('.popover'));
  }
  return out;
};
window.mockStates = () => STATES.map((s) => s.id);

buildChrome();
applyTheme();
applyFrame();
go(store.state);
})();
</script>
