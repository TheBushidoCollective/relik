  max-height: calc(100dvh - var(--share-top, var(--bar-height)));
  margin: 0;
  padding: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  color: var(--ink);
  font-family: var(--sans);
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-top: 2px solid var(--patina);
  border-right: 0;
  box-shadow: 0 6px 18px rgb(0 0 0 / 18%);
}

.share-panel::backdrop {
  background: rgb(16 19 20 / 28%);
}

.share-head {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  min-height: 2.75rem;
  padding: 0 0.4rem 0 1.25rem;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.share-title {
  margin: 0;
  font-size: 1rem;
  font-weight: 600;
}

.share-title:focus {
  outline: none;
}

.share-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.25rem;
  height: 2.25rem;
  padding: 0;
  color: var(--ink-soft);
  background: transparent;
  border: 0;
  cursor: pointer;
}

.share-close:hover {
  color: var(--patina-ink);
  background: var(--ground);
}

.share-close:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: -2px;
}

.share-body {
  display: grid;
  gap: 0.75rem;
  padding: 1.1rem 1.25rem 1.4rem;
}

.share-body > * {
  min-width: 0;
}

.share-form {
  display: grid;
  gap: 0.75rem;
  margin: 0;
}

.share-form > .action.primary,
.share-body > .action {
  justify-self: start;
}

.share-body .thread-note,
.share-body .thread-policy {
  margin: 0;
}

.share-body .compose-warning {
  margin: 0;
}

/* The two facts a sharer is owed before typing anybody's address, set as the
   composer sets its disclosure: at reading size, on the oxide rule. */
.share-facts {
  display: grid;
  gap: 0.4rem;
}

.share-facts p {
  margin: 0;
}

.share-addresses {
  min-height: 4.6rem;
  font-family: var(--mono);
  font-size: 0.8rem;
  line-height: 1.6;
  resize: vertical;
}

.share-addresses[aria-invalid="true"] {
  border-color: var(--oxide);
}

/* Inside the sheet every action is a bordered button: the band's divider
   rules mean nothing away from the band. */
.share-panel .action {
  justify-content: center;
  padding: 0.5rem 0.85rem;
  border: 1px solid var(--rule-strong);
}

.share-panel .action.primary {
  border: 1px solid var(--patina);
}

.share-panel .action:disabled {
  color: var(--ink-soft);
  background: var(--ground);
  border-color: var(--rule);
  cursor: default;
}

.share-panel .action span {
  display: inline;
}

.share-panel .compose-foot .action.primary {
  margin-left: auto;
}

.share-done {
  margin: 0;
  padding: 0.6rem 0.75rem;
  font-size: 0.84rem;
  line-height: 1.5;
  background: var(--diff-added);
  border-left: 2px solid var(--patina);
}

/* The email as the recipient will get it, so what is about to leave the
   sharer's own mailbox is read before it leaves. The body is set in the
   reading face because it is a letter, not chrome. */
.share-email {
  margin: 0;
  background: var(--ground);
  border: 1px solid var(--rule);
}

.share-email-head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 0.3rem 0.75rem;
  margin: 0;
  padding: 0.65rem 0.8rem;
  font-size: 0.82rem;
  border-bottom: 1px solid var(--rule);
}

.share-email-head dt {
  padding-top: 0.15rem;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.share-email-head dd {
  margin: 0;
  overflow-wrap: anywhere;
}

.share-email-body {
  margin: 0;
  padding: 0.75rem 0.8rem 0.85rem;
  font-family: var(--serif);
  font-size: 0.9rem;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.share-send {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.share-again {
  justify-self: start;
  padding: 0;
  color: var(--patina-ink);
  font: inherit;
  font-size: 0.8rem;
  text-decoration: underline;
  text-underline-offset: 2px;
  background: none;
  border: 0;
  cursor: pointer;
}

.share-again:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: 2px;
}

.share-body .thread-refusal {
  margin: 0;
}

/* A phone gets the whole width under the band, and the buttons stack so the
   one that opens the mail app is never a sliver. */
@media (max-width: 34rem) {
  .share-panel {
    width: 100vw;
    border-left: 0;
  }

  .share-head {
    padding-left: 1rem;
  }

  .share-body {
    padding: 1rem 1rem 1.25rem;
  }

  .share-send .action {
    flex: 1 1 100%;
  }
}

/* ---------- toast ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: 1.5rem;
  transform: translateX(-50%);
  max-width: calc(100vw - 2rem);
  padding: 0.7rem 1rem;
  background: var(--ink);
  color: var(--ground);
  font-size: 0.84rem;
  border-left: 3px solid var(--patina);
}

@media (prefers-reduced-motion: no-preference) {
  .toast {
    animation: rise 180ms ease-out;
  }
  @keyframes rise {
    from {
      opacity: 0;
      transform: translate(-50%, 0.5rem);
    }
  }
}

/* ---------- comment region mark ---------- */

/* The region mark outline uses a dual-stroke technique to guarantee high
   contrast against arbitrary imagery. A 2px solid patina border is paired
   with an outer dark shadow and an inner light shadow. On pure white photos,
   the dark outer shadow and patina border provide crisp contrast. On pure
   black photos, the bright inner shadow and patina border provide crisp
   contrast. On any background luminance, at least one boundary edge remains
   visible. */
.comment-region {
  position: absolute;
  box-sizing: border-box;
  border: 2px solid var(--patina);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.9);
  background: color-mix(in srgb, var(--patina) 14%, transparent);
  pointer-events: auto;
  cursor: pointer;
  z-index: 2;
}

.comment-region:hover,
.comment-region.is-active {
  background: color-mix(in srgb, var(--patina) 28%, transparent);
  outline: 2px solid var(--patina);
  outline-offset: 2px;
}

.comment-region.is-pending,
.comment-region.is-drawing {
  border-style: dashed;
  pointer-events: none;
  cursor: default;
}

.comment-region-badge {
  position: absolute;
  top: 4px;
  left: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.35rem;
  height: 1.35rem;
  padding: 0 0.25rem;
  border: 2px solid #fff;
  border-radius: 999px;
  background: var(--patina);
  color: var(--surface);
  font-family: var(--sans);
  font-size: 0.7rem;
  font-weight: 600;
  line-height: 1;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.85), 0 2px 4px rgba(0, 0, 0, 0.4);
  pointer-events: none;
  user-select: none;
}

/* --------------------------------------------------------------------------
   Time anchor markers and timeline track
   -------------------------------------------------------------------------- */

.time-track {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* Markers are drawn in ink inside a ring of the surface. The played bar is
   patina and the unplayed rail a light tint of the ink, so a patina marker
   vanished over everything already played. Ink stands off the tinted rail,
   the surface ring stands off the patina, and the pair holds in the dark
   fullscreen stage, where both tokens are redefined. */
.time-marker {
  position: absolute;
  top: 50%;
  width: 3px;
  height: 12px;
  padding: 0;
  border: none;
  border-radius: 0;
  background: var(--ink);
  transform: translate(-50%, -50%);
  pointer-events: auto;
  cursor: pointer;
  z-index: 2;
  box-shadow: 0 0 0 1px var(--surface);
}

.time-marker:hover,
.time-marker.is-active,
.time-marker:focus-visible {
  width: 5px;
  background: var(--ink);
  outline: 1px solid var(--patina);
  outline-offset: 1px;
  z-index: 4;
}

.time-marker.is-pending {
  background: var(--accent, #d97706);
  border-style: dashed;
}

/* A span stands above and below the 4px rail, so its ring shows against the
   controls band as well as against the rail, played or not. */
.time-marker-span {
  height: 8px;
  top: 50%;
  border-radius: 0;
  border-left: 2px solid var(--ink);
  border-right: 2px solid var(--ink);
  border-top: none;
  border-bottom: none;
  background: var(--ink);
  transform: translateY(-50%);
  min-width: 4px;
  z-index: 2;
}

.time-marker-span:hover,
.time-marker-span.is-active,
.time-marker-span:focus-visible {
  transform: translateY(-50%);
  background: var(--ink);
  outline: 1px solid var(--patina);
  outline-offset: 1px;
  z-index: 4;
}

.time-marker-span.is-pending {
  background: color-mix(in srgb, var(--accent, #d97706) 60%, transparent);
}

.time-marker-cluster {
  position: absolute;
  top: 50%;
  height: 14px;
  min-width: 14px;
  padding: 0 3px;
  border: 1px solid var(--surface);
  border-radius: 0;
  background: var(--ink);
  color: var(--surface);
  font-family: var(--mono);
  transform: translateY(-50%);
  pointer-events: auto;
  cursor: pointer;
  z-index: 3;
}

.time-marker-cluster.is-moment-cluster {
  transform: translate(-50%, -50%);
  pointer-events: auto;
  cursor: pointer;
  z-index: 3;
}

.time-marker-cluster:hover,
.time-marker-cluster.is-active,
.time-marker-cluster:has(.is-active),
.time-marker-cluster:focus-visible {
  background: var(--ink);
  outline: 1px solid var(--patina);
  outline-offset: 1px;
  z-index: 5;
}

.time-frame-box {
  position: absolute;
  border: 2px solid var(--patina);
  background: color-mix(in srgb, var(--patina) 15%, transparent);
  pointer-events: none;
  border-radius: 2px;
  box-sizing: border-box;
}

.time-frame-box.is-hidden {
  display: none !important;
}

.time-frame-box.is-active {
  border-color: var(--accent, var(--patina));
  background: color-mix(in srgb, var(--patina) 30%, transparent);
  box-shadow: 0 0 0 1px var(--surface);
}

.time-frame-box.is-pending {
  border-style: dashed;
}

/* Anchored to the bottom of the media stage, so `top` from `.mark-hint` has to
   be released. Carrying both classes with both edges set stretched the tooltip
   from the top of the stage to just above its base: a one-line sentence became
   a white panel covering the video it was describing. */
.mark-time-hint {
  position: absolute;
  top: auto;
  bottom: 1rem;
  left: 50%;
  width: max-content;
  max-width: calc(100% - 2rem);
  transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--rule);
  padding: 0.35rem 0.75rem;
  font-family: var(--sans);
  font-size: 0.8rem;
  color: var(--ink);
  border-radius: 4px;
  pointer-events: none;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
}

/* ---------- Key entry on dead cards ---------- */

.key-entry {
  margin-top: 1.25rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
}

.key-entry-prompt {
  margin: 0 0 0.75rem;
  font-size: 0.86rem;
  color: var(--ink-soft);
}

.key-entry-label {
  display: block;
  font-family: var(--sans);
  font-size: 0.76rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  margin-bottom: 0.35rem;
}

.key-entry-row {
  display: flex;
  gap: 0.5rem;
}

.key-entry-input {
  flex: 1 1 auto;
}

.key-entry-submit {
  flex-shrink: 0;
}

.key-entry-feedback {
  margin-top: 0.5rem;
  font-size: 0.86rem;
  color: var(--oxide);
  min-height: 1.2rem;
}

/* ---------- Dashboard ---------- */
.stage-dashboard {
  display: flex;
  justify-content: center;
  padding: 2.5rem 1.5rem 5rem;
  width: 100%;
  overflow-y: auto;
}

.dashboard-container {
  max-width: 48rem;
  width: 100%;
}

.dashboard-title {
  font-family: var(--sans);
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0 0 1.5rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--rule-strong);
  color: var(--ink);
}

.dashboard-section {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-top: 3px solid var(--patina);
  padding: 1.5rem;
  margin-bottom: 2rem;
}

.dashboard-section-title {
  font-family: var(--sans);
  font-size: 1.15rem;
  font-weight: 600;
  margin: 0 0 0.35rem;
  color: var(--ink);
}

.dashboard-section-note {
  margin: 0 0 1.25rem;
  font-size: 0.86rem;
  color: var(--ink-soft);
  line-height: 1.5;
}

.dashboard-session-info {
  margin: 0 0 1.25rem;
  font-size: 0.86rem;
  color: var(--patina);
  font-weight: 500;
}

.dashboard-relic-list {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--rule);
}

.dashboard-relic-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.85rem 0.5rem;
  border-bottom: 1px solid var(--rule);
  gap: 1.25rem;
  transition: background 120ms ease;
}

.dashboard-relic-item:hover {
  background: color-mix(in srgb, var(--ground) 60%, var(--surface));
}

.dashboard-relic-item:last-child {
  border-bottom: 1px solid var(--rule);
}

/* A thumbnail here is an accession cover, not cached relic content. It uses
   metadata this browser or the server already holds, so painting the dashboard
   never spends an open and never creates a second plaintext copy of the file. */
.relic-thumbnail {
  --thumb-tone: var(--ink-soft);
  position: relative;
  display: grid;
  grid-template-rows: 1fr auto;
  flex: 0 0 4.75rem;
  width: 4.75rem;
  height: 3.35rem;
  padding: 0.42rem;
  overflow: hidden;
  border: 1px solid var(--rule-strong);
  border-top: 4px solid var(--thumb-tone);
  background:
    linear-gradient(
      90deg,
      transparent 0 18%,
      color-mix(in srgb, var(--thumb-tone) 12%, transparent) 18% 19%,
      transparent 19% 100%
    ),
    var(--ground);
  color: var(--ink);
}

.relic-thumbnail-rule {
  align-self: center;
  height: 1.05rem;
  border-block: 1px solid color-mix(in srgb, var(--thumb-tone) 46%, transparent);
  background: repeating-linear-gradient(
    to bottom,
    transparent 0 0.22rem,
    color-mix(in srgb, var(--thumb-tone) 24%, transparent) 0.22rem 0.28rem
  );
}

.relic-thumbnail-label {
  overflow: hidden;
  font-family: var(--mono);
  font-size: 0.58rem;
  line-height: 1;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.relic-thumbnail-code,
.relic-thumbnail-component {
  --thumb-tone: var(--oxide);
}

.relic-thumbnail-image,
.relic-thumbnail-media {
  --thumb-tone: var(--patina);
}

.relic-thumbnail-pdf,
.relic-thumbnail-archive {
  --thumb-tone: var(--patina-ink);
}

.dashboard-relic-info {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

.relic-link {
  color: var(--ink);
  text-decoration: none;
  font-weight: 500;
  font-size: 0.95rem;
  word-break: break-word;
}

.relic-link:hover {
  color: var(--patina);
  text-decoration: underline;
}

.dashboard-relic-actions {
  display: flex;
  align-items: center;
  flex: 0 0 auto;
}

.dashboard-relic-actions .action-forget {
  border: 1px solid var(--rule);
  padding: 0.35rem 0.75rem;
  font-size: 0.78rem;
  font-family: var(--sans);
  color: var(--ink-soft);
  background: var(--surface);
}

.dashboard-relic-actions .action-forget:hover {
  border-color: var(--oxide);
  color: var(--oxide);
  background: var(--diff-removed);
}

.relic-title-unopenable {
  font-weight: 500;
  font-size: 0.95rem;
  color: var(--ink-soft);
  word-break: break-word;
}

.relic-unopenable-note {
  margin: 0.2rem 0 0;
  font-size: 0.8rem;
  color: var(--ink-soft);
  font-style: italic;
}

.relic-list-empty {
  margin: 1.25rem 0;
  padding: 1.25rem;
  background: var(--ground);
  border: 1px solid var(--rule);
  font-size: 0.86rem;
  color: var(--ink-soft);
  font-style: italic;
  text-align: center;
}

.vault-tools {
  margin-top: 1.75rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--rule);
}

.vault-tools-title {
  font-family: var(--sans);
  font-size: 0.95rem;
  font-weight: 600;
  margin: 0 0 0.35rem;
  color: var(--ink);
}

.vault-tools-note {
  margin: 0 0 1rem;
  font-size: 0.82rem;
  color: var(--ink-soft);
  line-height: 1.5;
}

.vault-tools-actions {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
}

.vault-tools-actions .action {
  border: 1px solid var(--rule);
  padding: 0.4rem 0.85rem;
  font-size: 0.82rem;
  background: var(--surface);
}

.vault-tools-actions .action:hover {
  border-color: var(--patina);
  color: var(--patina-ink);
  background: var(--ground);
}

.vault-import-panel {
  margin-top: 1.25rem;
  padding: 1.25rem;
  background: var(--ground);
  border: 1px solid var(--rule);
}

.vault-import-input {
  width: 100%;
  margin-top: 0.35rem;
  margin-bottom: 0.75rem;
}

.dashboard-auth-section {
  border-top-color: var(--rule-strong);
}

.dashboard-auth-outcome {
  margin-top: 0.75rem;
  font-size: 0.86rem;
  color: var(--ink-soft);
}

/* Native OTIO: the same accession surface, with lanes instead of a document. */
.stage-otio { padding: 0 0 2rem; min-width: 0; }
.otio-view { --otio-label-width: 174px; min-width: 0; width: 100%; }
.otio-loading { margin: 1rem; font: .8rem var(--mono); color: var(--ink-soft); }
.otio-monitor-row { display: grid; grid-template-columns: minmax(0, 1fr) 244px; border-bottom: 1px solid var(--rule-strong); }
.otio-preview { position: relative; background: #080a0b; min-width: 0; display: grid; place-items: center; min-height: 240px; }
.otio-canvas { display: block; width: 100%; height: auto; max-height: 380px; object-fit: contain; }
.otio-preview-scope { position: absolute; top: .7rem; left: .7rem; max-width: calc(100% - 1.4rem); padding: .2rem .35rem; color: #e6e9e7; background: #080a0bd9; font: .6rem/1.5 var(--mono); }
.otio-preview-status { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: .65rem; padding: 1.25rem; overflow-y: auto; background: #080a0bf0; color: #e6e9e7; text-align: center; }
.otio-preview-status p { max-width: 38rem; margin: 0; font: .75rem/1.6 var(--mono); color: #d2b49f; overflow-wrap: anywhere; }
.otio-preview-status .otio-buffering { color: #e6e9e7; }
/* OTIO accent controls use --surface on --patina: 6.06:1 light, 6.89:1 dark. */
.otio-preview-base { max-width: 30rem; padding: .5rem .7rem; color: var(--surface); background: var(--patina); border: 1px solid var(--patina); font-size: .75rem; cursor: pointer; }
.otio-preview-scope { z-index: 1; display: flex; align-items: center; flex-wrap: wrap; gap: .3rem .5rem; }
.otio-preview-block { padding: .15rem .3rem; border: 1px solid currentColor; background: transparent; color: inherit; font: inherit; cursor: pointer; }
/* Blocked previews reserve separate rows for the scope and diagnostics. */
.otio-preview:has(> .otio-preview-status:not([hidden])) {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(min-content, 1fr);
  place-items: stretch;
}
.otio-preview:has(> .otio-preview-status:not([hidden])) > .otio-canvas {
  grid-area: 1 / 1 / 3 / 2;
  align-self: center;
  justify-self: center;
}
.otio-preview:has(> .otio-preview-status:not([hidden])) > .otio-preview-scope {
  position: relative;
  inset: auto;
  grid-area: 1 / 1;
  align-self: start;
  justify-self: start;
  min-width: 0;
  max-width: calc(100% - 1.4rem);
  margin: .7rem .7rem 0;
  overflow-wrap: anywhere;
}
.otio-preview:has(> .otio-preview-status:not([hidden])) > .otio-preview-status {
  position: relative;
  inset: auto;
  grid-area: 2 / 1;
  align-self: stretch;
  justify-self: stretch;
  min-width: 0;
  margin-top: .65rem;
  overflow: visible;
}
.otio-raw { margin-top: .6rem; min-width: 0; }
.otio-raw summary { color: var(--ink-soft); font: .62rem/1.6 var(--mono); cursor: pointer; }
.otio-inspector { background: var(--surface); min-width: 0; border-left: 1px solid var(--rule); }
.otio-inspector-tabs { display: flex; border-bottom: 1px solid var(--rule); }
.otio-inspector-tab { flex: 1; min-width: 0; padding: .6rem .4rem; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--ink-soft); font: .7rem var(--sans); cursor: pointer; }
.otio-inspector-tab[aria-selected="true"] { border-bottom-color: var(--patina); color: var(--patina-ink); }
.otio-context { max-height: 340px; overflow-y: auto; padding: .8rem; font-size: .68rem; }
.otio-context h3 { margin: 0 0 .3rem; color: var(--ink); font: 600 .82rem var(--sans); overflow-wrap: anywhere; }
.otio-context h4 { margin: .8rem 0 .3rem; font: 600 .7rem var(--sans); }
.otio-context dl { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: .4rem; margin: .7rem 0; font-size: .62rem; }
.otio-context dt { color: var(--ink-soft); }
.otio-context dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }
.otio-schema { color: var(--ink-soft); font: .62rem var(--mono); }
.otio-effect, .otio-metadata { font: .62rem/1.6 var(--mono); overflow-wrap: anywhere; white-space: pre-wrap; }
.otio-media-reference, .otio-inspector-marker { padding: .6rem 0; border-bottom: 1px solid var(--rule); }
.otio-media-reference strong, .otio-inspector-marker strong { display: block; font-weight: 500; overflow-wrap: anywhere; }
.otio-media-reference span, .otio-inspector-marker span { display: block; color: var(--ink-soft); font: .6rem/1.6 var(--mono); overflow-wrap: anywhere; }
.otio-inspector-marker p { font: .8rem var(--serif); }
.otio-inspector-marker button { border: 1px solid var(--rule-strong); background: var(--ground); color: var(--patina-ink); font: .62rem var(--mono); cursor: pointer; }
.otio-transport { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; min-height: 46px; padding: .55rem .75rem; border-bottom: 1px solid var(--rule-strong); background: var(--surface); }
.otio-transport button { padding: .3rem .45rem; border: 1px solid var(--rule-strong); background: transparent; color: var(--ink); font: .65rem var(--sans); cursor: pointer; }
.otio-transport .otio-play { background: var(--patina); border-color: var(--patina); color: var(--surface); min-width: 44px; }
.otio-time { font: .7rem var(--mono); font-variant-numeric: tabular-nums; }
.otio-seek { min-width: 65px; width: 100px; flex: 1; accent-color: var(--patina); cursor: pointer; }
.otio-transport .otio-inspector-toggle { display: none; }
.otio-timeline-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .65rem; padding: .7rem .75rem; border-bottom: 1px solid var(--rule); }
.otio-timeline-name { margin: 0; font: 600 .82rem var(--sans); overflow-wrap: anywhere; }
.otio-selection-tools { display: flex; gap: .25rem; align-items: center; flex-wrap: wrap; }
.otio-mode { border: 1px solid var(--rule-strong); border-radius: 0; padding: .3rem .5rem; background: var(--surface); color: var(--ink); font: .65rem var(--sans); cursor: pointer; }
.otio-mode[aria-pressed="true"] { border-color: var(--patina); background: var(--diff-added); color: var(--patina-ink); }
.otio-track-select, .otio-timeline-select { max-width: 190px; min-width: 0; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink); padding: .28rem; padding-inline-end: 1.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: .62rem var(--sans); }
.otio-timeline-scroll { max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; scroll-padding-inline-start: var(--otio-label-width); }
.otio-track-grid { position: relative; min-width: 760px; }
.otio-ruler, .otio-track-row { display: grid; grid-template-columns: var(--otio-label-width) minmax(0, 1fr); border-bottom: 1px solid var(--rule); }
.otio-ruler-label { position: sticky; z-index: 7; left: 0; padding: .35rem .6rem; border-right: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink-soft); font: .6rem var(--mono); }
.otio-ruler-ticks { container-name: otio-ruler; container-type: inline-size; height: 26px; position: relative; overflow: hidden; }
.otio-ruler-ticks span { position: absolute; top: 5px; color: var(--ink-soft); font: .53rem var(--mono); transform: translateX(-50%); }
.otio-ruler-ticks span:first-child { transform: none; }
.otio-ruler-ticks span:last-child { transform: translateX(-100%); }
@container otio-ruler (max-width: 54rem) {
  .otio-ruler-ticks span:nth-child(2n) { display: none; }
}
.otio-track-label { position: sticky; left: 0; z-index: 6; display: flex; align-items: center; gap: .35rem; min-width: 0; padding: .4rem .45rem; border-right: 1px solid var(--rule-strong); background: var(--surface); }
.otio-track-code { flex: 0 0 auto; color: var(--ink-soft); font: .6rem var(--mono); }
.otio-track-name { flex: 1; min-width: 0; line-height: 1.35; }
.otio-track-name strong { display: block; font: 500 .65rem var(--sans); overflow-wrap: anywhere; }
.otio-track-name small { display: block; color: var(--ink-soft); font: .48rem var(--mono); overflow-wrap: anywhere; }
.otio-track-row:not([data-depth="0"]) .otio-track-label { padding-left: calc(.45rem + min(var(--otio-depth, 0), 4) * .35rem); background: var(--ground); }
.otio-track-toggle, .otio-disclosure { flex: 0 0 auto; border: 0; background: transparent; color: var(--ink-soft); padding: .2rem; font: .53rem var(--sans); cursor: pointer; }
.otio-track-toggle[aria-pressed="true"] { text-decoration: line-through; color: var(--oxide); }
.otio-track-solo[aria-pressed="true"] { text-decoration: none; color: var(--patina-ink); background: var(--diff-added); }
.otio-disclosure svg { width: 11px; height: 11px; display: block; fill: none; stroke: currentColor; }
.otio-disclosure[aria-expanded="false"] svg { transform: rotate(-90deg); }
.otio-track-body { display: flex; flex-direction: column; min-width: 0; }
.otio-comment-band { position: relative; flex: none; min-width: 0; height: 0; }
.otio-track-rail { position: relative; flex: 1 0 auto; min-height: 54px; min-width: 0; cursor: crosshair; user-select: none; touch-action: pan-y; background: repeating-linear-gradient(90deg, transparent 0, transparent calc(10% - 1px), var(--rule) calc(10% - 1px), var(--rule) 10%); }
.otio-track-rail[data-selected="true"] { background-color: color-mix(in srgb, var(--patina) 8%, transparent); }
.otio-composition-row .otio-track-rail { min-height: 26px; }
.otio-composition-row .otio-track-label { padding-top: .15rem; padding-bottom: .15rem; }
.otio-item { position: absolute; top: 5px; bottom: 6px; min-width: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid var(--rule-strong); border-top-width: 2px; border-radius: 0; background: var(--surface); color: var(--ink); padding: .25rem .35rem; text-align: left; font: .62rem var(--mono); cursor: crosshair; }
.otio-item[data-enabled="false"], .otio-track-row[data-enabled="false"] .otio-item { opacity: .5; }
.otio-item.is-gap { border-style: dashed; color: var(--ink-soft); background: repeating-linear-gradient(135deg, transparent 0 4px, var(--rule) 4px 5px); }
.otio-item.is-compound { border-top-color: var(--patina); }
.otio-item.is-transition { z-index: 2; padding: 0; font-size: 0; background: linear-gradient(135deg, transparent 48%, var(--patina) 49%, var(--patina) 51%, transparent 52%); }
.otio-item.is-transition:not(.is-unplaced):not(.is-trimmed-out) { top: 10px; bottom: auto; height: 12px; }
.otio-item.has-diagnostic { border-color: var(--oxide); color: var(--oxide); }
.otio-item.is-unplaced, .otio-item.is-trimmed-out { position: relative; display: block; left: auto; top: auto; bottom: auto; width: auto; margin: .2rem; border-style: dashed; color: var(--oxide); white-space: normal; }
.otio-item.is-trimmed-out { color: var(--ink-soft); opacity: .6; }
.otio-timeline-marker { position: absolute; top: 0; height: 5px; min-width: 7px; z-index: 4; padding: 0; border: 1px solid var(--ink); border-radius: 0; background: var(--otio-marker-color, var(--patina)); cursor: pointer; }
.otio-timeline-marker.is-point { top: 1px; width: 7px; height: 7px; z-index: 5; transform: translateX(-50%) rotate(45deg); }
.otio-selection { position: absolute; top: 1px; bottom: 1px; z-index: 3; min-width: 4px; border: 2px dashed var(--patina); background: color-mix(in srgb, var(--patina) 22%, transparent); pointer-events: none; }
.otio-selection.is-point { width: 4px; transform: translateX(-50%); }
.otio-comment-mark { position: absolute; bottom: 1px; height: 14px; min-width: 5px; z-index: 4; padding: 0; border: 1px solid var(--patina); border-left-width: 2px; border-right-width: 2px; border-radius: 0; background: color-mix(in srgb, var(--patina) 35%, var(--surface)); cursor: pointer; }
.otio-comment-band .otio-comment-mark { bottom: calc(4px + var(--otio-comment-lane, 0) * 22px); }
.otio-comment-mark.is-point { width: 5px; transform: translateX(-50%); background: var(--ink); border-color: var(--surface); }
.otio-comment-mark.is-active { outline: 2px solid var(--patina); outline-offset: 2px; z-index: 8; }
.otio-comment-mark.is-pending { border-style: dashed; }
.otio-comment-mark.is-resolved { opacity: .55; filter: grayscale(.6); border-style: dotted; }
.otio-comment-mark[data-projection="partial"] { border-style: dashed; }
.otio-playhead { position: absolute; top: 25px; bottom: 0; z-index: 5; width: 1px; background: var(--ink); box-shadow: 0 0 0 1px var(--surface); pointer-events: none; }
.otio-selection-readout { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding: .65rem .75rem; border-bottom: 1px solid var(--rule-strong); background: var(--surface); }
.otio-selection-label { flex: 1 1 100%; font: .64rem/1.6 var(--mono); overflow-wrap: anywhere; }
.otio-selection-readout label { font: .62rem var(--sans); }
.otio-selection-readout input { width: 70px; border: 1px solid var(--rule-strong); background: var(--ground); color: var(--ink); padding: .25rem; font: .65rem var(--mono); }
.otio-selection-readout button { border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink); padding: .3rem .6rem; font: .65rem var(--sans); cursor: pointer; }
.otio-selection-readout .otio-comment-selection { background: var(--patina); color: var(--surface); border-color: var(--patina); }
.otio-diagnostics { padding: .5rem .75rem; }
.otio-diagnostics:empty { display: none; }
.otio-diagnostic { margin: .35rem 0; color: var(--oxide); font: .68rem/1.6 var(--mono); overflow-wrap: anywhere; }
.otio-feedback-target { margin: .6rem 0; padding: .35rem .55rem; border-left: 2px solid var(--patina); background: var(--diff-added); color: var(--ink); font: .66rem/1.6 var(--mono); overflow-wrap: anywhere; }
.otio-feedback-target span { display: block; margin-top: .15rem; color: var(--ink-soft); font-size: .6rem; }
.otio-feedback-projection { display: flex; align-items: baseline; flex-wrap: wrap; gap: .5rem; padding: .5rem 0 0; font: .66rem/1.6 var(--mono); color: var(--oxide); }
.otio-view-original { border: 1px solid var(--rule-strong); background: var(--surface); color: var(--patina-ink); padding: .2rem .4rem; font: .68rem var(--sans); cursor: pointer; }
.otio-view button:focus-visible, .otio-view input:focus-visible, .otio-view select:focus-visible, .otio-track-rail:focus-visible { outline: 2px solid var(--patina); outline-offset: 2px; }
/* The OTIO composer stays on the preview surface. Its context can scroll,
   while the editor and actions remain on the same opaque card. */
.popover-card.is-otio-composer {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
  padding: 0.25rem 0.45rem;
  margin-top: 0;
}
.is-otio-composer .popover-bounded-body {
  flex: 1 1 auto;
  min-height: 1.35rem;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.is-otio-composer .popover-target {
  margin: 0 0 0.2rem;
  overflow-wrap: anywhere;
}
.is-otio-composer .popover-disclosure { margin: 0.2rem 0; }
.is-otio-composer .popover-note { margin: 0.2rem 0; }
.is-otio-composer .popover-field {
  margin-top: 0.15rem;
  flex: 0 1 4.5rem;
  height: 4.5rem;
  min-height: calc(1.4em + 0.8rem + 2px);
  resize: none;
}
.is-otio-composer .popover-tools {
  flex: none;
  margin-top: 0.15rem;
  padding-top: 0.15rem;
  background: var(--surface);
}
@media (max-width: 64rem) {
  .otio-monitor-row { grid-template-columns: minmax(0, 1fr) 210px; }
  .otio-selection-tools { width: 100%; }
}
@media (max-width: 44rem) {
  .otio-view { --otio-label-width: 148px; }
  .otio-monitor-row { display: block; }
  .otio-preview { min-height: 180px; }
  .otio-canvas { max-height: none; }
  .otio-inspector { display: none; border-left: 0; border-top: 1px solid var(--rule); }
  .otio-monitor-row[data-inspector-open="true"] .otio-inspector { display: block; }
  .otio-context { max-height: 260px; }
  .otio-transport .otio-inspector-toggle { display: block; }
  .otio-transport { gap: .4rem; padding: .5rem; }
  .otio-seek { flex-basis: 100%; order: 2; }
  .otio-timeline-heading { padding: .65rem .5rem; }
  .otio-track-select { max-width: 160px; }
  .otio-preview-scope { font-size: .5rem; }
  .otio-selection-readout { padding: .6rem .5rem; }
}

/* ---------- decisions ---------- */

/*
 * A decision is a different act from a comment, so it gets its own entry on
 * the band and its own sheet, and neither borrows the composer's patina rule.
 *
 * The subject is a register: a catalogued object, an exact version of it, and
 * a dated mark saying who signed off. So the sheet is ruled like a ledger
 * (a double ink rule along the top, where the share sheet has patina) and the
 * verdict is an impression, a bordered uppercase mark, rather than a pill or
 * a badge. Approve is patina because it is the system's one colour for "go";
 * reject is oxide, already the colour of every refusal in the viewer.
 */

/* The tally rides inside the band control, one bordered chip split by a
   hairline, in the same box as the comment count so the two read as siblings
   and the verdict colours are the only difference. */
.decision-tally {
  display: inline-flex;
  align-items: stretch;
  border: 1px solid var(--rule-strong);
  font-family: var(--mono);
  font-size: 0.68rem;
  line-height: 1.4;
}

.decision-tally > span {
  display: inline-flex;
  align-items: center;
  gap: 0.15rem;
  padding: 0 0.3rem;
}

.decision-tally > span + span {
  border-left: 1px solid var(--rule-strong);
}

.decision-tally .icon {
  width: 10px;
  height: 10px;
}

.tally-approve {
  color: var(--patina-ink);
}

.tally-approve .icon {
  fill: var(--patina);
}

.tally-reject {
  color: var(--oxide);
}

/* Zero is a fact, not an alarm: it keeps its place and loses its colour. */
.decision-tally > span[data-zero="true"] {
  color: var(--ink-soft);
}

.decision-tally > span[data-zero="true"] .icon {
  fill: var(--rule-strong);
}

.action-decisions[aria-expanded="true"] {
  background: var(--ground);
  box-shadow: inset 0 -2px 0 var(--ink);
}

/*
 * The sheet drops from the band like the share sheet, but it is not modal.
 * The comment sidebar stays open and live beside it, because the point of the
 * layout is that the two are visibly separate places: one for talking about
 * the version, one for signing it. Its right edge is set by the page to the
 * sidebar's left edge when the sidebar is open.
 */
.decision-panel {
  position: fixed;
  inset: var(--decision-top, var(--bar-height)) var(--decision-right, 0) auto
    auto;
  z-index: 8;
  width: min(27rem, 100vw);
  max-width: 100vw;
  max-height: calc(100dvh - var(--decision-top, var(--bar-height)));
  margin: 0;
  padding: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  color: var(--ink);
  font-family: var(--sans);
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-top: 3px double var(--ink);
  box-shadow: 0 6px 18px rgb(0 0 0 / 18%);
}

.decision-head {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  min-height: 2.75rem;
  padding: 0 0.4rem 0 1.25rem;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.decision-title {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  min-width: 0;
  margin: 0;
  font-size: 1rem;
  font-weight: 600;
}

.decision-title:focus {
  outline: none;
}

.decision-title .accession {
  font-weight: 400;
}

.decision-close {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 2.25rem;
  height: 2.25rem;
  padding: 0;
  color: var(--ink-soft);
  background: transparent;
  border: 0;
  cursor: pointer;
}

.decision-close:hover {
  color: var(--patina-ink);
  background: var(--ground);
}

.decision-close:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: -2px;
}

.decision-body {
  display: grid;
  gap: 1rem;
  padding: 1.1rem 1.25rem 1.4rem;
}

.decision-body > * {
  min-width: 0;
  margin: 0;
}

/* Said first, every time, at reading size: the one sentence that keeps a
   comment saying "greenlight" from being mistaken for a decision. */
.decision-lead {
  padding: 0.6rem 0.75rem;
  color: var(--ink);
  font-size: 0.84rem;
  line-height: 1.5;
  background: var(--ground);
  border-left: 2px solid var(--ink);
}

.decision-section-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5rem;
  margin: 0 0 0.35rem;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.66rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.decision-section-title .decision-digest-chip {
  letter-spacing: 0.04em;
  text-transform: none;
  font-weight: 400;
}

.decision-list {
  margin: 0;
  padding: 0;
  list-style: none;
  border-top: 1px solid var(--rule);
}

.decision-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: baseline;
  column-gap: 0.65rem;
  row-gap: 0.25rem;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--rule);
}

.decision-who {
  min-width: 0;
  font-family: var(--mono);
  font-size: 0.76rem;
  overflow-wrap: anywhere;
}

.decision-you {
  margin-left: 0.35rem;
  color: var(--ink-soft);
  font-family: var(--sans);
  font-size: 0.72rem;
}

.decision-time {
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.68rem;
  white-space: nowrap;
}

/* The verdict as an impression: bordered, uppercase, set in the catalog
   face. Never a filled pill, so it cannot be mistaken for a button. */
.decision-mark {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.05rem 0.4rem;
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  line-height: 1.5;
  text-transform: uppercase;
  white-space: nowrap;
  border: 1.5px solid currentColor;
}

.decision-mark .icon {
  width: 10px;
  height: 10px;
}

.decision-mark.is-approve {
  color: var(--patina);
  background: color-mix(in srgb, var(--patina) 7%, transparent);
}

.decision-mark.is-reject {
  color: var(--oxide);
  background: color-mix(in srgb, var(--oxide) 7%, transparent);
}

/* Earlier records stay on the page because they stay on the record. Each
   author's history hangs off their current row and says what replaced it. */
.decision-history {
  grid-column: 2 / -1;
  font-size: 0.78rem;
}

.decision-history summary {
  width: max-content;
  max-width: 100%;
  color: var(--ink-soft);
  font-size: 0.74rem;
  cursor: pointer;
}

.decision-history summary:hover {
  color: var(--patina-ink);
}

.decision-history summary:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: 2px;
}

.decision-history ol {
  margin: 0.4rem 0 0;
  padding: 0 0 0 0.75rem;
  list-style: none;
  border-left: 2px solid var(--rule);
}

.decision-history li {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.2rem 0.5rem;
  padding: 0.2rem 0;
  color: var(--ink-soft);
}

.decision-history .decision-mark {
  opacity: 0.7;
}

.decision-superseded {
  font-size: 0.72rem;
  font-style: italic;
}

.decision-empty {
  padding: 0.9rem 0;
  color: var(--ink-soft);
  font-size: 0.86rem;
  font-style: italic;
  border-bottom: 1px solid var(--rule);
}

.decision-identity {
  margin: 0;
  color: var(--ink-soft);
  font-size: 0.8rem;
}

.decision-identity strong {
  color: var(--ink);
  font-family: var(--mono);
  font-size: 0.78rem;
  font-weight: 500;
  overflow-wrap: anywhere;
}

/* Two verdicts, equal weight, so the panel does not lean either way. Each
   carries its own colour on its rule and glyph and never as a fill: filling
   is reserved for the one button that actually records something. */
.decision-verdicts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
}

.decision-verdict {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  min-height: 2.75rem;
  padding: 0.55rem 0.75rem;
  color: var(--ink);
  font: inherit;
  font-size: 0.86rem;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-top-width: 3px;
  cursor: pointer;
}

.decision-verdict.is-approve {
  border-top-color: var(--patina);
}

.decision-verdict.is-approve .icon {
  fill: var(--patina);
}

.decision-verdict.is-reject {
  border-top-color: var(--oxide);
}

.decision-verdict.is-reject .icon {
  fill: var(--oxide);
}

.decision-verdict.is-approve:hover {
  color: var(--patina-ink);
  background: color-mix(in srgb, var(--patina) 8%, var(--surface));
}

.decision-verdict.is-reject:hover {
  color: var(--oxide);
  background: color-mix(in srgb, var(--oxide) 8%, var(--surface));
}

.decision-verdict:focus-visible,
.decision-confirm:focus-visible,
.decision-secondary:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: 2px;
}

.decision-verdict:disabled {
  color: var(--ink-soft);
  cursor: default;
}

.decision-fine {
  margin: 0;
  color: var(--ink-soft);
  font-size: 0.78rem;
  line-height: 1.5;
}

/* The confirm step. The digest is printed because it is what the decision is
   bound to, and a reader who cares can compare it with what the publisher
   was told. Twelve characters: enough to compare by eye, short enough not to
   be a wall of hex. */
.decision-ticket {
  display: grid;
  gap: 0.75rem;
  padding: 0.9rem 1rem 1rem;
  background: var(--ground);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--patina);
}

.decision-ticket[data-verdict="reject"] {
  border-left-color: var(--oxide);
}

.decision-ticket h3 {
  margin: 0;
  font-size: 0.95rem;
  font-weight: 600;
}

.decision-facts {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 0.3rem 0.85rem;
  margin: 0;
  font-size: 0.82rem;
}

.decision-facts dt {
  padding-top: 0.1rem;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.decision-facts dd {
  margin: 0;
  overflow-wrap: anywhere;
}

.decision-digest-chip {
  font-family: var(--mono);
  font-size: 0.76rem;
  letter-spacing: 0.04em;
}

.decision-digest-chip b {
  color: var(--ink);
  font-weight: 600;
}

.decision-digest-chip span {
  color: var(--ink-soft);
}

.decision-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.6rem 1rem;
}

.decision-confirm {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  min-height: 2.75rem;
  padding: 0.55rem 1rem;
  color: var(--surface);
  font: inherit;
  font-size: 0.88rem;
  font-weight: 600;
  background: var(--patina);
  border: 0;
  cursor: pointer;
}

.decision-confirm:hover {
  background: var(--patina-ink);
}

.decision-confirm[data-verdict="reject"] {
  background: var(--oxide);
}

.decision-confirm[data-verdict="reject"]:hover {
  background: color-mix(in srgb, var(--oxide) 78%, var(--ink));
}

.decision-confirm .icon {
  width: 16px;
  height: 16px;
}

.decision-confirm:disabled {
  color: var(--ink-soft);
  background: var(--rule);
  cursor: default;
}

.decision-secondary {
  justify-self: start;
  padding: 0;
  color: var(--patina-ink);
  font: inherit;
  font-size: 0.82rem;
  text-decoration: underline;
  text-underline-offset: 2px;
  background: none;
  border: 0;
  cursor: pointer;
}

/* Waiting on the device. A rule that travels along the ticket rather than a
   spinner: nothing in the viewer spins, and this is a wait on a person. */
.decision-waiting {
  position: relative;
  height: 2px;
  overflow: hidden;
  background: var(--rule);
}

.decision-waiting::after {
  position: absolute;
  inset: 0 auto 0 0;
  width: 30%;
  content: "";
  background: var(--ink);
}

@media (prefers-reduced-motion: no-preference) {
  .decision-waiting::after {
    animation: decision-wait 1.4s ease-in-out infinite alternate;
  }
}

@keyframes decision-wait {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(233%);
  }
}

/* The stamp. The single place in the viewer that is set at an angle, because
   it is the single thing in it that was pressed onto the page by a person.
   The double rule echoes the sheet's top edge. */
.decision-outcome {
  display: grid;
  gap: 0.75rem;
}

.decision-stamp {
  justify-self: center;
  display: grid;
  justify-items: center;
  gap: 0.25rem;
  max-width: 100%;
  margin: 0.4rem 0 0.2rem;
  padding: 0.7rem 1.1rem 0.75rem;
  color: var(--patina);
  text-align: center;
  border: 4px double currentColor;
  transform: rotate(-1.5deg);
}

.decision-stamp.is-reject {
  color: var(--oxide);
}

.decision-stamp-verdict {
  font-family: var(--mono);
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: 0.22em;
  line-height: 1.1;
  text-transform: uppercase;
}

.decision-stamp-line {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  overflow-wrap: anywhere;
}

.decision-note {
  margin: 0;
  color: var(--ink);
  font-size: 0.86rem;
  line-height: 1.55;
}

/* Outcomes that are not a record. Cancelled is neutral, because the reader
   chose it; a refusal carries the viewer's usual oxide rule. */
.decision-refusal {
  display: grid;
  gap: 0.5rem;
  padding: 0.9rem 1rem;
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-top: 2px solid var(--oxide);
}

.decision-refusal[data-state="cancelled"] {
  border-top-color: var(--ink-soft);
}

.decision-refusal-title {
  margin: 0;
  font-weight: 600;
}

.decision-refusal p {
  margin: 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.decision-refusal .accession {
  font-size: 0.62rem;
}

.decision-refusal .decision-facts {
  padding: 0.5rem 0.65rem;
  background: var(--ground);
}

/* Reading an older version is allowed and so is deciding on it, so the
   notice says plainly which version a decision here lands on. */
.decision-stale {
  display: grid;
  gap: 0.45rem;
  padding: 0.65rem 0.75rem;
  font-size: 0.84rem;
  line-height: 1.5;
  background: var(--diff-removed);
  border-left: 2px solid var(--oxide);
}

.decision-stale p {
  margin: 0;
}

.decision-stale .decision-secondary {
  justify-self: start;
}

/* Setting up the passkey. The trust-on-first-use sentence is a warning, not
   fine print: it is the one irreversible thing in this panel. */
.decision-passkey {
  display: grid;
  gap: 0.75rem;
}

.decision-passkey h3 {
  margin: 0;
  font-size: 0.95rem;
  font-weight: 600;
}

.decision-passkey .compose-warning {
  margin: 0;
}

.decision-passkey .action.primary,
.decision-signin .action.primary {
  align-self: auto;
  justify-self: start;
}

.decision-signin {
  display: grid;
  gap: 0.75rem;
  padding-top: 0.25rem;
}

.decision-signin form {
  display: grid;
  gap: 0.75rem;
  margin: 0;
}

.decision-signin h3 {
  margin: 0;
  font-size: 0.95rem;
  font-weight: 600;
}

/* A comment that says "approve" is still a comment. The sidebar keeps its
   composer exactly as it was: no verdict control, no stamp, nothing that
   could be read as one. */

@media (max-width: 34rem) {
  .decision-panel {
    width: 100vw;
    border-right: 0;
    border-left: 0;
  }

  .decision-head {
    padding-left: 1rem;
  }

  .decision-body {
    padding: 1rem 1rem 1.25rem;
  }

  /* The tally is the control's whole reason to be on a phone's band, like
     the comment count beside it, so it keeps its numbers when labels go.
     The two glyphs say what the numbers count, so the stamp icon is what
     goes: on a phone the tally is the control. */
  .action span.decision-tally {
    display: inline-flex;
  }

  .action .decision-tally > span {
    display: inline-flex;
  }

  .action-decisions > .icon {
    display: none;
  }

  /* Unless there is no tally to stand in for it (decisions not open on this
     relic), when the stamp is all that is left to press. */
  .action-decisions:not([data-decision-approvals]) > .icon {
    display: inline-block;
  }

  /* Inside the sheet every button keeps its words, as in the share sheet:
     the band's icon-only rule is about the band. */
  .decision-panel .action span {
    display: inline;
  }

  /*
   * The narrow hierarchy, re-derived a third time, for the eighth action.
   *
   * Measured at 390px before this rule: the band ran 36px past the viewport
   * and the filename rendered 0px wide. The bar has to be no worse for the
   * filename than it was before Decisions arrived (31px at 390), so three
   * things give way, smallest loss first: the stamp icon above (21px), a
   * slightly tighter action padding (about 38px across eight), and Relics
   * (39px), which the 24rem floor already treats as the first to go and
   * which opens a tab rather than acting on this relic.
   */
  .action-relics {
    display: none;
  }

  .actions .action {
    padding: 0 0.6rem;
  }

  .decision-row {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .decision-time {
    grid-column: 2;
  }
}

/* The chooser and the refusal's single action, as the mock lays them out. */
.decision-choose {
  display: grid;
  gap: 0.65rem;
}

.decision-refusal > .action.primary {
  justify-self: start;
}

/*
 * The real band carries Compare versions, which the mock's did not, so the
 * mock's narrow rules alone left the filename narrower than before Decisions
 * arrived. Measured filename width before Decisions / with these rules:
 * 31 / 31 px at 390, 104 / 105 at 360, 64 / 65 at 320. A tighter tally chip
 * buys the 8px at 390; a tighter action padding at the floor buys the rest.
 */
@media (max-width: 34rem) {
  .action .decision-tally > span {
    gap: 0.1rem;
    padding: 0 0.2rem;
  }
}

@media (max-width: 24rem) {
  .actions .action {
    padding: 0 0.4rem;
  }
}

  function el(tag, attrs, ...children) {

  const UNITS = [[1e9, 'GB'], [1e6, 'MB'], [1e3, 'KB']];
  function unitFor(total) {
    for (const unit of UNITS) if (total >= unit[0]) return unit;
    return null;

  function formatBytes(bytes) {
    const unit = unitFor(bytes);
    return unit ? `${(bytes / unit[0]).toFixed(1)} ${unit[1]}` : `${bytes} B`;
  }
  function formatTransfer(received, total) {
    const unit = unitFor(total);

      ? `${(received / unit[0]).toFixed(1)} of ${(total / unit[0]).toFixed(1)} ${unit[1]}`
      : `${received} of ${total} B`;

  function paintPlate(view, p) {
    const main = view.main;
    const phase = main.querySelector('.load-phase');
    const meter = main.querySelector('.load-meter');
    const transfer = main.querySelector('[data-load-transfer]');
    const contents = main.querySelector('[data-load-contents]');
    const name = p.phase === 'opening' ? COPY.LOAD_OPENING
      : p.phase === 'fetching' ? COPY.PHASE_FETCHING : COPY.PHASE_DECRYPTING;
    // The live region changes only at a phase transition, never per chunk.
    if (phase.textContent !== name) phase.textContent = name;
    main.dataset.loadPhase = p.phase;

      // main.ts writes this text before otio-view.ts has loaded.
      root.textContent = 'Loading OTIO';
      return root;
    }
    root.dataset.ready = 'true';
    const tabs = ['Inspector', 'Markers', 'Media'].map((label, index) =>
      el('button', { type: 'button', class: 'otio-inspector-tab', role: 'tab', 'aria-selected': index === 0 ? 'true' : 'false' }, label));
    const ticks = ['00:00', '00:02', '00:04', '00:06', '00:08', '00:10'];
    const track = (code, name, items) => el('div', { class: 'otio-track-row', 'data-depth': '0' },
      el('div', { class: 'otio-track-label' }, el('span', { class: 'otio-track-code' }, code), el('span', { class: 'otio-track-name' }, el('strong', null, name))),
      el('div', { class: 'otio-track-body' },
        el('div', { class: 'otio-track-rail' }, items.map(([label, left, width]) =>
          el('span', { class: 'otio-item', style: { left: `${left}%`, width: `${width}%` } }, label)))));
    root.append(
      el('div', { class: 'otio-monitor-row' },
        el('div', { class: 'otio-preview' },
          el('img', { class: 'otio-canvas', src: OTIO_FRAME_URI, alt: '', width: '1280', height: '720' }),
          el('span', { class: 'otio-preview-scope' }, el('span', null, 'Composition · browser-managed SDR'))),
        el('aside', { class: 'otio-inspector', 'aria-label': 'OTIO source context' },
          el('div', { class: 'otio-inspector-tabs', role: 'tablist' }, tabs),
          el('div', { class: 'otio-context', role: 'tabpanel' },
            el('h3', null, 'primary-a'),
            el('div', { class: 'otio-schema' }, 'Clip.2')))),
      el('div', { class: 'otio-transport', 'aria-label': 'OTIO playback' },
        el('button', { type: 'button', class: 'otio-previous-frame' }, 'Previous frame'),
        el('button', { type: 'button', class: 'otio-play' }, 'Play'),
        el('output', { class: 'otio-time' }, '00:00:00:00'),
        el('input', { type: 'range', class: 'otio-seek', min: '0', max: '240', value: '0', 'aria-label': 'Seek' })),
      el('div', { class: 'otio-timeline-heading' }, el('h2', { class: 'otio-timeline-name' }, 'standard-sample')),
      el('div', { class: 'otio-timeline-scroll' },
        el('div', { class: 'otio-track-grid' },
          el('div', { class: 'otio-ruler' },
            el('div', { class: 'otio-ruler-label' }, 'Time'),
            el('div', { class: 'otio-ruler-ticks' }, ticks.map((tick, index) => el('span', { style: { left: `${index * 20}%` } }, tick)))),
          track('V1', 'Video 1', [['primary-a', 0, 47], ['primary-b', 47, 53]]),
          track('A1', 'Audio 1', [['dialogue', 0, 100]]))));
    return root;
  }

  function frameDoc(phase) {
    const frame = el('div', { class: 'usercontent-frame', title: CLASSES.frame.filename });
    if (phase === 'ready') {
      frame.classList.add('mock-author-page');
      frame.append(
        el('div', { class: 'mock-author-hero' },
          el('span', { class: 'mock-author-title' }, 'Launch brief'),
          el('span', { class: 'mock-author-rule' })),
        el('div', { class: 'mock-author-body' },
          [0, 1, 2].map(() => el('div', null, el('b'), el('i'), el('i', { style: { width: '92%' } }), el('i', { style: { width: '64%' } })))));
    }
    return el('div', { class: 'doc doc-html' }, frame);
  }

  const DOCS = { pdf: pdfDoc, image: imageDoc, media: mediaDoc, otio: otioDoc, frame: frameDoc };

  // trackRenderState: data-render-state on the stage, aria-busy on its wrap.
  function stageWrap(key, phase) {
    const c = CLASSES[key];
    const main = el('main', { class: `stage stage-${c.route}`, 'data-render-state': phase });
    if (c.versions > 1) main.append(notice(COMPARISON_UNAVAILABLE));
    main.append(DOCS[key](phase));
    return el('div', { class: 'stage-wrap', 'aria-busy': phase === 'rendering' ? 'true' : 'false' }, main);
  }

  function relicRow(wrap) {
    return el('div', { class: 'relic-row' },
      wrap,
      el('aside', { class: 'thread', id: 'comment-thread', 'aria-labelledby': 'thread-title' }),
      el('button', { type: 'button', class: 'thread-tab', 'aria-controls': 'comment-thread', 'aria-expanded': 'false' }, 'Comments'));
  }

  // body > div.render-status, placed straight after the band. Its text sits in
  // the tag; a version line keeps "Version 2: " in a span the floor can drop
  // from view while a screen reader still hears it.
  function pill(text, kind) {
    const attrs = { class: 'render-status', role: 'status' };
    attrs[kind === 'version' ? 'data-version-progress' : 'data-render-status'] = true;
    const node = el('div', attrs, el('span', { class: 'render-status-label' }));
    setPillText(node, text);
    return node;
  }

  function setPillText(node, text) {
    const label = node.querySelector('.render-status-label');
    const split = text.match(/^(Version \d+: )(.*)$/);
    if (split) label.replaceChildren(el('span', { class: 'render-status-version' }, split[1]), split[2]);
    else label.textContent = text;
  }

  function showReady(key, phase, { pillText = null, pillKind = 'render', selectedVersion } = {}) {
    const bar = readyBar(key, { selectedVersion });
    const pillNode = pillText === null ? null : pill(pillText, pillKind);
    mount(bar, pillNode, relicRow(stageWrap(key, phase)));
    return { bar, pill: pillNode };
  }

  /* ---------- version history: the comparison scaffold ---------- */

  function sidePicker(side, caption, version) {
    const value = version === CLASSES.pdf.versions ? `Version ${version}, current` : `Version ${version}`;
    return el('div', { class: `compare-picker-side compare-picker-${side}`, 'data-side': side },
      el('span', { class: 'compare-picker-caption' }, caption),
      el('button', {
        type: 'button', class: 'version-label version-trigger compare-picker-trigger', 'data-side': side,
        'aria-haspopup': 'listbox', 'aria-expanded': 'false', 'aria-label': `${caption} version: ${value}`,
      }, el('span', { class: 'compare-picker-value' }, value), icon(ICON.chevron)));
  }

  function showComparison(line) {
    const loading = el('p', { class: 'diff-loading', role: 'status' }, line);
    const main = el('main', { class: 'stage stage-diff' },
      el('div', { class: 'diff-shell' },
        el('header', { class: 'diff-toolbar' },
          el('div', { class: 'diff-heading' },
            el('div', { class: 'diff-eyebrow' }, 'Version history'),
            el('h1', { tabindex: '-1' }, 'Comparing version 1 with version 3'),
            el('p', { class: 'diff-history-note' }, 'Version 3 is current. Version 1 is retained history and may contain content removed from the current artifact.')),
          el('div', { class: 'compare-picker', role: 'group', 'aria-label': 'Compare versions' },
            sidePicker('left', 'Left', 1),
            el('span', { class: 'compare-picker-separator', 'aria-hidden': 'true' }, 'to'),
            sidePicker('right', 'Right', 3))),
        el('div', { class: 'diff-result', 'aria-live': 'polite', 'aria-busy': 'true' }, loading)));
    // The changes sidebar opens beside a desk-width comparison. Below 44rem
    // it would take the whole row, so the mock draws it closed there to keep
    // the loading line in view.
    const open = !window.matchMedia('(max-width: 44rem)').matches;
    const count = () => el('span', { class: 'action-count' }, '0');
    const sidebar = el('aside', { class: `thread diff-changes-sidebar${open ? ' is-open' : ''}`, id: 'diff-changes-sidebar', 'aria-labelledby': 'changes-title' },
      el('h2', { class: 'thread-title', id: 'changes-title' },
        el('button', { type: 'button', class: 'thread-toggle', 'aria-controls': 'diff-changes-sidebar', 'aria-expanded': String(open) }, el('span', null, 'Changes'), count())),
      el('div', { class: 'diff-changes-body' }));
    const tab = el('button', { type: 'button', class: 'thread-tab diff-tab', 'aria-controls': 'diff-changes-sidebar', 'aria-expanded': String(open) },
      el('span', null, 'Changes'), count());
    mount(readyBar('pdf', { comparisonOpen: true, comments: false, decisions: false }),
      el('div', { class: 'relic-row diff-row' }, main, sidebar, tab));
    return loading;
  }

  function showToast(message, persistent) {
    document.querySelector('.toast')?.remove();
    const toast = el('div', { class: 'toast', role: 'status' }, message);
    document.body.insertBefore(toast, panel);
    if (!persistent) later(() => toast.remove(), 4000);
  }

  /* ---------- flows: the throttled open and the clickable paths ---------- */

  let frameRequest = 0;
  const timers = [];
  function later(callback, delay) {
    timers.push(window.setTimeout(callback, delay));
  }
  function stopFlows() {
    window.cancelAnimationFrame(frameRequest);
    while (timers.length > 0) window.clearTimeout(timers.pop());
  }
  // A curve over [0, 1] that stays monotonic but never runs at one speed, the
  // way a throttled link delivers.
  const wobble = (x) => Math.min(1, Math.max(0, x + 0.035 * Math.sin(x * Math.PI * 6) * x * (1 - x) * 4));
  const CHUNK = 16384;

  function fetchProgress(c, elapsed, span) {
    // The first chunks crawl until record 0 is in, then the transfer opens up.
    const head = span * 0.18;
    let received;
    if (elapsed < head) received = Math.floor((RECORD0_BYTES * elapsed) / head / CHUNK) * CHUNK;
    else received = RECORD0_BYTES + (c.object - RECORD0_BYTES) * wobble((elapsed - head) / (span - head));
    received = Math.min(c.object, Math.floor(received));
    const p = { phase: 'fetching', received, total: c.object };
    if (received >= RECORD0_BYTES) p.contents = { filename: c.filename, length: c.content };
    return p;
  }

  function simulateOpen(key) {
    stopFlows();
    const c = CLASSES[key];
    const view = showPlate({ phase: 'opening', total: c.object });
    markPressed('opening');
    const T = { mint: 900, first: 1300, fetched: 6900, decrypted: 8700 };
    const start = performance.now();
    let pressed = 'opening';
    const step = (now) => {
      const t = now - start;
      let p;
      let state;
      if (t < T.mint) {
        p = { phase: 'opening', total: c.object };
        state = 'opening';
      } else if (t < T.first) {
        p = { phase: 'fetching', received: 0, total: c.object };
        state = 'mint-returned';
      } else if (t < T.fetched) {
        p = fetchProgress(c, t - T.first, T.fetched - T.first);
        state = p.contents ? 'fetching-after-record-0' : 'fetching-before-record-0';
      } else if (t < T.decrypted) {
        const opened = Math.floor((c.content * (t - T.fetched)) / (T.decrypted - T.fetched));
        p = { phase: 'decrypting', opened, contents: { filename: c.filename, length: c.content } };
        state = 'decrypting';
      } else {
        showReady(key, 'rendering', { pillText: COPY.PHASE_RENDERING });
        markPressed('rendering');
        later(() => {
          showReady(key, 'ready');
          markPressed('ready');
        }, 1800);
        return;
      }
      paintPlate(view, p);
      if (state !== pressed) {
        pressed = state;
        markPressed(state);
      }
      frameRequest = window.requestAnimationFrame(step);
    };
    frameRequest = window.requestAnimationFrame(step);
  }

  function startKeyEntryFetch(value) {
    stopFlows();
    const c = CLASSES.pdf;
    showDead('decrypt_failed', { keyEntry: { value, fetching: { phase: 'fetching', received: 0, total: c.object } } });
    markPressed('key-entry-fetching');
    const line = document.querySelector('.key-entry-progress');
    const span = 4200;
    const decrypt = 1500;
    const start = performance.now();
    const step = (now) => {
      const t = now - start;
      let p;
      if (t < span) p = { phase: 'fetching', received: Math.floor(c.object * wobble(t / span)), total: c.object };
      else if (t < span + decrypt) p = { phase: 'decrypting', opened: Math.floor((c.content * (t - span)) / decrypt), contents: { filename: c.filename, length: c.content } };
      else {
        showReady('pdf', 'rendering', { pillText: COPY.PHASE_RENDERING });
        markPressed('rendering');
        later(() => {
          showReady('pdf', 'ready');
          markPressed('ready');
        }, 1800);
        return;
      }
      const text = progressLine(p);
      if (line.textContent !== text) line.textContent = text;
      frameRequest = window.requestAnimationFrame(step);
    };
    frameRequest = window.requestAnimationFrame(step);
  }

  function startVersionSwitch(version) {
    stopFlows();
    const c = CLASSES.pdf;
    const view = showReady('pdf', 'ready', { pillText: `Opening version ${version}`, pillKind: 'version' });
    markPressed('version-opening');
    // Version 2 fails part way, as in C4; version 1 arrives and replaces the view.
    const stopAt = version === 2 ? 41200000 : c.object;
    later(() => {
      markPressed('version-fetching');
      const span = version === 2 ? 2600 : 4200;
      const start = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - start) / span);
        const received = Math.floor(stopAt * wobble(t));
        setPillText(view.pill, `Version ${version}: ${progressLine({ phase: 'fetching', received, total: c.object })}`);
        if (t < 1) {
          frameRequest = window.requestAnimationFrame(step);
          return;
        }
        if (version === 2) {
          view.pill.remove();
          showToast(VERSION_UNAVAILABLE, false);
          markPressed('version-failed');
        } else {
          showReady('pdf', 'ready', { selectedVersion: version });
        }
      };
      frameRequest = window.requestAnimationFrame(step);
    }, 900);
  }

  function openComparison() {
    stopFlows();
    const c = CLASSES.pdf;
    const prefix = 'Loading comparison: version 1 and version 3.';
    const loading = showComparison(`${prefix} Version 1: ${COPY.LOAD_OPENING}`);
    markPressed('comparison-loading');
    const span = 5200;
    const decrypt = 1600;
    later(() => {
      const start = performance.now();
      const step = (now) => {
        const t = now - start;
        let p;
        if (t < span) p = { phase: 'fetching', received: Math.floor(c.object * wobble(t / span)), total: c.object };
        else p = { phase: 'decrypting', opened: Math.floor((c.content * Math.min(1, (t - span) / decrypt))), contents: { filename: c.filename, length: c.content } };
        const text = `${prefix} Version 1: ${progressLine(p)}`;
        if (loading.textContent !== text) loading.textContent = text;
        if (t < span + decrypt) frameRequest = window.requestAnimationFrame(step);
      };
      frameRequest = window.requestAnimationFrame(step);
    }, 700);
  }

  /* ---------- the sixteen states, as stills ---------- */

  const DOSSIER_CONTENTS = { filename: DOSSIER, length: CAP.content };
  const STILLS = {
    'static-plate': () => showPlate({ phase: 'opening', total: CAP.object }),
    noscript: () => mount(plateBar(COPY.LOAD_OPENING), noscriptMain()),
    opening: () => showPlate({ phase: 'opening', total: CAP.object }),
    'mint-returned': () => showPlate({ phase: 'fetching', received: 0, total: CAP.object }),
    'fetching-before-record-0': () => showPlate({ phase: 'fetching', received: 629145, total: CAP.object }),
    'fetching-after-record-0': () => showPlate({ phase: 'fetching', received: 41200000, total: CAP.object, contents: DOSSIER_CONTENTS }),
    decrypting: () => showPlate({ phase: 'decrypting', opened: 98100000, contents: DOSSIER_CONTENTS }),
    rendering: (key) => showReady(key, 'rendering', { pillText: COPY.PHASE_RENDERING }),
    ready: (key) => showReady(key, 'ready'),
    'could-not-open': () => showDead('decrypt_failed', { keyEntry: { value: '' } }),
    'key-entry-fetching': () => showDead('decrypt_failed', { keyEntry: { value: KEY_PHRASE, fetching: { phase: 'fetching', received: 629145, total: CAP.object } } }),
    damaged: () => showDead('content_damaged', { custody: DOSSIER }),
    'cut-short': () => showDead('truncated_transfer', { custody: DOSSIER }),
    'service-unreachable': () => showDead('service_unreachable'),
    insecure: () => showDead('insecure_context'),
    'version-opening': () => showReady('pdf', 'ready', { pillText: 'Opening version 2', pillKind: 'version' }),
    'version-fetching': () => showReady('pdf', 'ready', { pillText: 'Version 2: Fetching 41.2 of 105.3 MB', pillKind: 'version' }),
    'version-failed': () => {
      showReady('pdf', 'ready');
      showToast(VERSION_UNAVAILABLE, true);
    },
    'comparison-loading': () => showComparison('Loading comparison: version 1 and version 3. Version 1: Fetching 41.2 of 105.3 MB'),
  };

  /* ---------- controls ---------- */

  let currentState = 'static-plate';
  let currentClass = 'pdf';
  const stateButtons = new Map();
  const classButtons = new Map();

  function saved() {
    try {
      return JSON.parse(window.localStorage.getItem(STORAGE_KEY) || '{}') || {};
    } catch {
      return {};
    }
  }
  function save(patch) {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...saved(), ...patch }));
    } catch {
      // A blocked store only loses the remembered choice.
    }
  }

  const themeSelect = document.getElementById('mock-theme');
  function setTheme(theme, persist) {
    const value = ['light', 'dark'].includes(theme) ? theme : 'system';
    document.documentElement.dataset.theme = value;
    themeSelect.value = value;
    if (persist) save({ theme: value });
  }
  themeSelect.addEventListener('change', () => setTheme(themeSelect.value, true));

  function setClass(key, persist) {
    if (!CLASSES[key]) return;
    currentClass = key;
    for (const [id, button] of classButtons) button.setAttribute('aria-pressed', id === key ? 'true' : 'false');
    if (persist) save({ class: key });
  }

  function markPressed(id) {
    currentState = id;
    for (const [stateId, button] of stateButtons) button.setAttribute('aria-pressed', stateId === id ? 'true' : 'false');
  }

  function render(id) {
    stopFlows();
    STILLS[id](currentClass);
    markPressed(id);
  }

  function writeHash(id) {
    const params = new URLSearchParams(window.location.hash.slice(1));
    params.set('state', id);
    if (id === 'rendering' || id === 'ready') params.set('class', currentClass);
    else params.delete('class');
    window.history.replaceState(null, '', `#${params.toString()}`);
  }

  function selectState(id, key) {
    if (key) setClass(key, true);
    render(id);
    writeHash(id);
  }

  for (const [key, c] of Object.entries(CLASSES)) {
    const button = el('button', {
      type: 'button', 'aria-pressed': key === currentClass ? 'true' : 'false',
      on: {
        click: () => {
          setClass(key, true);
          if (currentState === 'rendering' || currentState === 'ready') selectState(currentState);
        },
      },
    }, c.label);
    classButtons.set(key, button);
    panel.querySelector('ul[data-group="class"]').append(el('li', null, button));
  }

  for (const [group, id, label] of STATES) {
    const button = el('button', { type: 'button', 'aria-pressed': 'false', 'data-state': id, on: { click: () => selectState(id) } }, label);
    stateButtons.set(id, button);
    panel.querySelector(`ul[data-group="${group}"]`).append(el('li', null, button));
  }

  document.getElementById('mock-simulate').addEventListener('click', () => simulateOpen(currentClass));

  document.getElementById('mock-collapse').addEventListener('click', (event) => {
    const collapsed = panel.classList.toggle('is-collapsed');
    event.currentTarget.textContent = collapsed ? 'Show' : 'Hide';
    event.currentTarget.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
  });

  // The viewer's links lead to service pages this mock does not have.
  document.addEventListener('click', (event) => {
    const link = event.target.closest('a[href]');
    if (link && !panel.contains(link)) event.preventDefault();
    if (!event.target.closest('.version')) closeLists();
  });

  function applyHash() {
    const params = new URLSearchParams(window.location.hash.slice(1));
    const theme = params.get('theme');
    if (theme) setTheme(theme, false);
    let state = params.get('state');
    let key = params.get('class');
    const combined = state && state.match(/^(rendering|ready)-(pdf|image|media|otio|frame)$/);
    if (combined) {
      state = combined[1];
      key = combined[2];
    }
    if (key) setClass(key, false);
    panel.hidden = params.get('controls') === 'hide';
    render(STATE_IDS.has(state) ? state : 'static-plate');
  }

  const remembered = saved();
  setTheme(remembered.theme, false);
  setClass(remembered.class || 'pdf', false);
  window.addEventListener('hashchange', applyHash);
  applyHash();

  // The comparison draws its sidebar for the width it opened at.
  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(() => {
      if (currentState === 'comparison-loading') render(currentState);
    }, 150);
  });
})();
</script>
</body>
</html>
