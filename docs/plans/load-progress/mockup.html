<!--
  Spec B mock: the loading plate, the record-0 key check refusals, the damaged
  file card, the render pill and version progress
  (docs/plans/load-progress/plan.md, slice M).

  A local, clickable mock, not the viewer. Nothing is fetched, decrypted or
  sent. The theme and class choices stay in this page's localStorage.

  Stylesheet: packages/relic-viewer/src/styles.css at origin/main 8ae3b3c3
  (Decisions merged), verbatim, with one change: its dark tokens also answer
  the mock's theme control. Spec B's section sits where V2 adds it, after
  `.stage-dead .accession`, so the mock previews the real cascade. The band
  carries Decisions as main.ts builds it. Mock-only rules, the relic drawings
  and the controls panel, come last.

  Copy: plan.md C2, C3 and C4 word for word; key entry strings from
  docs/plans/copy-link-key-phrase/plan.md; every other dead card and version
  line is the existing copy in viewer.ts, as C3's table requires.

  Deep links for review and screenshots:
    mockup.html#state=<id>[&class=pdf|image|media|otio|frame][&theme=light|dark][&controls=hide]

  Decisions:
  - The plate stands where a dead card stands: the same stage, card, width and
    margins. A failed open replaces it without moving anything. The top rule
    is patina while the open is live and oxide once it has stopped.
    Rejected: a centred spinner page, which is a second visual language, and a
    full-width bar under the band, which says nothing about bytes.
  - Every row the plate will show is reserved from the first frame, so the
    transfer line and the contents line fill in without pushing the
    explanation down while it is being read.
  - Opening has no fraction, so its meter is hatched, not partly filled. A
    still segment would read as a third of the way there.
  - The render pill is a body child after the band: a transparent strip laid
    over the band's bottom edge, carrying a sweep along the band's rule and a
    patina tag at the far end that names the phase. A negative top margin
    equal to its height means it takes no height and no width from anything:
    no layout shift, no band rebuild, never over a frame. The tag sits in the
    empty strip under the action labels and touches none of them.
    Rejected: a tab hanging under the band (covers the top of a sandboxed
    frame), a strip below the relic (moves the Comments tab and resizes the
    frame when it leaves), a token in the identity line (plan correction 3),
    a plain outlined chip (read as a caption of Report, the action above it).
  - On a dead card the custody line keeps the filename only when record 0
    gave one (damaged, cut short after record 0). Otherwise it is cleared:
    a bar reading "Opening…" over a card saying the open stopped is false.
  - Card actions are bordered buttons that keep their words at every width,
    the share sheet's rule away from the band.
-->
<style>
/*
 * Relic viewer.
 *
 * The art direction comes from the subject rather than a template. A relic is
 * a catalogued object with a fixed lifespan, so the chrome is an accession
 * label: a hairline-ruled band carrying a catalog number in monospace, over a
 * reading surface. Nothing is rounded, nothing glows, and the only saturated
 * colour in the system is a patina teal used for interaction.
 *
 * No webfonts, by necessity and by preference: the CSP blocks external
 * requests and the viewer has to work offline once installed.
 */

:root {
  color-scheme: light dark;

  --ground: #f1f2f0;
  --surface: #fbfbfa;
  --ink: #16191a;
  --ink-soft: #5a6163;
  --rule: #d2d5d2;
  --rule-strong: #b3b8b4;
  --patina: #1f6b64;
  --patina-ink: #0f3b37;
  --oxide: #8c4a2f;
  --diff-added: #dfeeea;
  --diff-added-strong: #a7d6ca;
  --diff-removed: #f3e5df;
  --diff-removed-strong: #ddb6a6;

  --serif: Charter, "Iowan Old Style", "Source Serif Pro", Palatino,
    "Palatino Linotype", Georgia, serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo,
    Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --bar-height: 3.25rem;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #101314;
    --surface: #171b1c;
    --ink: #e6e9e7;
    --ink-soft: #969e9d;
    --rule: #2a3032;
    --rule-strong: #3b4345;
    --patina: #4fb3a6;
    --patina-ink: #a7ded6;
    --oxide: #c98058;
    --diff-added: #15332f;
    --diff-added-strong: #24564e;
    --diff-removed: #34231d;
    --diff-removed-strong: #684331;
  }
}

/* Mock only: the theme control forces either scheme over the system's. */
:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #101314;
  --surface: #171b1c;
  --ink: #e6e9e7;
  --ink-soft: #969e9d;
  --rule: #2a3032;
  --rule-strong: #3b4345;
  --patina: #4fb3a6;
  --patina-ink: #a7ded6;
  --oxide: #c98058;
  --diff-added: #15332f;
  --diff-added-strong: #24564e;
  --diff-removed: #34231d;
  --diff-removed-strong: #684331;
}

* {
  box-sizing: border-box;
}

/*
 * `hidden` means hidden, everywhere.
 *
 * The attribute's own rule comes from the user agent stylesheet at the
 * lowest possible weight, so any `display` here beats it and the element
 * stays on screen with its `hidden` attribute set. That is how the swipe
 * slider survived in side by side, where it controls nothing: a control a
 * reader can drag with no effect is worse than no control. One rule rather
 * than a per-element fix each time, because the next element to hit this
 * would have hit it silently.
 */
[hidden] {
  display: none !important;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}

.relic-row {
  position: relative;
  display: flex;
  flex: 1 1 auto;
  min-height: 0;
}

.stage-wrap {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  overflow: auto;
}

.comment-pins {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.comment-pin {
  position: absolute;
  width: 1.35rem;
  height: 1.35rem;
  padding: 0;
  border: 2px solid var(--surface);
  border-radius: 999px;
  background: var(--patina);
  color: var(--surface);
  font-family: var(--sans);
  font-size: 0.7rem;
  font-weight: 600;
  line-height: 1;
  transform: translate(-50%, -50%);
  pointer-events: auto;
  cursor: pointer;
}

.relic-text-mark {
  background: color-mix(in srgb, var(--patina) 22%, transparent);
  border-bottom: 2px solid var(--patina);
  color: inherit;
}

/* Hovering either half lights both, because a thread and a document are two
   views of one set of remarks and nothing else joins them. Outline rather
   than border on the mark: a border would reflow the line under the cursor. */
.relic-text-mark.is-active {
  background: color-mix(in srgb, var(--patina) 42%, transparent);
  outline: 2px solid var(--patina);
}

.comment-pin.is-active {
  outline: 2px solid var(--patina);
  outline-offset: 2px;
}

.comment.is-active {
  background: color-mix(in srgb, var(--patina) 10%, transparent);
}

/* A settled remark keeps its mark and loses its colour. Removing the mark
   would make the page claim a conversation that did not happen; leaving it
   at full strength would make a closed question look open. */
.relic-text-mark.is-resolved {
  background: none;
  border-bottom: 1px dotted var(--rule-strong);
}

.comment-pin.is-resolved,
.comment-region.is-resolved,
.time-marker.is-resolved {
  opacity: 0.55;
  filter: grayscale(0.6);
}

.comment.is-resolved {
  opacity: 0.62;
}

.comment.is-resolved.is-active {
  opacity: 1;
}

.comment-badge-resolved {
  border-color: var(--patina);
  color: var(--patina);
}

/* The target a reader has aimed and not yet posted. Dashed, because the thing
   it marks is a sentence they are about to talk about rather than one anybody
   has said anything about yet.

   Heavier than a posted mark rather than lighter, which is how it read until
   a comment aimed inside an existing mark was painted rather than dropped.
   This is the one thing on the page the reader is working with, and it has to
   stay identifiable where it lands on top of somebody else's mark, so the
   difference from posted is one of kind (dashed, outlined) and not only of
   degree. The outline is dashed where `is-active` is solid, so the provisional
   target and a lit thread never read as the same state. */
.relic-text-mark.is-pending {
  background: color-mix(in srgb, var(--patina) 30%, transparent);
  border-bottom: 2px dashed var(--patina);
  outline: 2px dashed var(--patina);
}

.comment-pin.is-pending {
  background: transparent;
  border: 2px dashed var(--patina);
  /* Nothing to press yet, so it must not answer a pointer or take the cursor
     that says something is pressable. */
  pointer-events: none;
  cursor: default;
}

/* The armed pin tool, on the surface it is armed against. A reader who has
   asked to point at something is told so where they are looking. */
.stage-wrap.is-pinning {
  cursor: crosshair;
}

/* Out of flow deliberately. A hint that took layout space would shift the
   line under the cursor between arming the tool and the click that places the
   point, which would move the point off the line it was meant for. */
.mark-hint {
  position: absolute;
  top: 0;
  left: 50%;
  z-index: 6;
  margin: 0;
  /* With `left` set and no `right`, a shrink-to-fit box is capped at half the
     container, so a sentence that fits on one line wrapped anyway. */
  width: max-content;
  max-width: calc(100% - 1.4rem);
  padding: 0.35rem 0.7rem;
  background: var(--patina);
  color: var(--surface);
  font-family: var(--sans);
  font-size: 0.76rem;
  border-radius: 0 0 0.35rem 0.35rem;
  transform: translateX(-50%);
  pointer-events: none;
}

/*
 * The panel that opens on the thing a comment is about.
 *
 * One rule for both its uses, because a selection's offer and a comment's
 * card are the same object in two states and styling them apart is how they
 * start reading as two unrelated pieces of chrome.
 *
 * Positioned against the stage's scrolled content rather than the viewport,
 * because the stage scrolls its own children and a panel placed against the
 * visible box is correct only until somebody scrolls. Nothing is rounded,
 * because nothing else in this system is.
 */
.popover {
  position: absolute;
  z-index: 8;
  background: var(--surface);
  /* Its own ink rather than whatever it inherits. Inside a fullscreen stage
     the surface is dark and the page around it is not, and an inherited ink
     put the comment's own words dark on dark. */
  color: var(--ink);
  border: 1px solid var(--rule-strong);
  box-shadow: 0 6px 18px rgb(0 0 0 / 14%);
  font-family: var(--sans);
}

.popover-offer {
  display: flex;
  align-items: stretch;
}

.popover-card {
  width: min(22rem, calc(100vw - 2rem));
  max-width: calc(100% - 1rem);
  padding: 0.55rem 0.7rem 0.5rem;
}

.popover-action {
  padding: 0.4rem 0.7rem;
  background: none;
  border: 0;
  color: var(--ink);
  font: inherit;
  font-size: 0.82rem;
  white-space: nowrap;
  cursor: pointer;
}

.popover-offer .popover-action + .popover-action {
  border-left: 1px solid var(--rule);
}

.popover-action:hover {
  background: color-mix(in srgb, var(--patina) 12%, transparent);
}

.popover-action:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: -2px;
}

.popover-action:disabled {
  color: var(--ink-soft);
  cursor: default;
}

.popover-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-top: 0.5rem;
  padding-top: 0.45rem;
  border-top: 1px solid var(--rule);
}

.popover-card .popover-action {
  padding: 0.2rem 0.55rem;
  border: 1px solid var(--rule-strong);
  font-size: 0.8rem;
}

.popover-card .popover-action.is-primary {
  background: var(--patina);
  border-color: var(--patina);
  color: var(--surface);
}

.popover-card .popover-action.is-quiet {
  border-color: transparent;
  color: var(--ink-soft);
}

/* The thread inside the panel is the sidebar's own rows, so it inherits
   their look and drops only the list furniture. */
.popover-thread {
  margin: 0;
  padding: 0;
  list-style: none;
}

/* The card lights the row it opened for, and the light runs edge to edge of
   the row. The sidebar has margins around its rows; a card has none, so the
   row brings its own and the author and the date stop touching the light. */
.popover-thread .comment {
  padding-right: 0.6rem;
  padding-left: 0.6rem;
}

.popover-target {
  margin: 0 0 0.4rem;
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.popover-composer {
  margin-top: 0.5rem;
}

.popover-field {
  width: 100%;
  min-height: 4.5rem;
  padding: 0.4rem;
  background: var(--ground);
  border: 1px solid var(--rule-strong);
  color: var(--ink);
  font: inherit;
  font-family: var(--serif);
  font-size: 0.9rem;
  resize: vertical;
}

.popover-note {
  margin: 0.4rem 0 0;
  color: var(--oxide);
  font-size: 0.76rem;
}

.popover-disclosure {
  margin: 0.4rem 0 0;
  color: var(--ink-soft);
  font-size: 0.72rem;
}

/* The comments that share one cluster on the timeline. Each row opens that
   comment's own card, so a row is a button that reads as the sidebar's
   comment head shrunk to one line plus the start of what was said. */
.popover-members {
  margin: 0;
  padding: 0;
  list-style: none;
}

.popover-members li + li {
  border-top: 1px solid var(--rule);
}

.popover-member {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  column-gap: 0.6rem;
  row-gap: 0.15rem;
  width: 100%;
  padding: 0.45rem 0.3rem;
  background: none;
  border: 0;
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.popover-member:hover {
  background: color-mix(in srgb, var(--patina) 12%, transparent);
}

.popover-member:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: -2px;
}

.popover-member-time {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--patina);
}

.popover-member-author {
  overflow: hidden;
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-soft);
  white-space: nowrap;
  text-overflow: ellipsis;
}

.popover-member-body {
  grid-column: 1 / -1;
  display: -webkit-box;
  overflow: hidden;
  font-family: var(--serif);
  font-size: 0.86rem;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

/* ---------- the accession band ---------- */

.bar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: stretch;
  gap: 0;
  flex: none;
  min-height: var(--bar-height);
  background: var(--surface);
  border-bottom: 1px solid var(--rule-strong);
}

.mark {
  display: flex;
  align-items: center;
  padding: 0 1rem;
  font-family: var(--mono);
  font-size: 0.78rem;
  font-weight: 600;
  /* A domain reads as an address, so it is set tight. The wide tracking this
     replaced was balancing a five-letter uppercase monogram. */
  letter-spacing: 0.01em;
  color: var(--ink);
  border-right: 1px solid var(--rule);
  white-space: nowrap;
}

.identity {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.1rem;
  padding: 0.4rem 1rem;
  min-width: 0;
  flex: 1;
}

/*
 * One line of text, and not a thing to shrink.
 *
 * `overflow: hidden` is here for the horizontal ellipsis, and it has a second
 * effect that is easy to miss: it removes this item's automatic minimum size,
 * so a flex column with too little room crushes the filename to any height at
 * all and then clips the glyphs with that same rule. Measured on a bar pinned
 * to `--bar-height` with a version control present: the line needs 22.33px
 * and rendered at 11.83px, with the top and bottom of every letter shaved.
 *
 * Refusing to shrink puts the pressure back where it belongs. The bar's
 * height is a minimum, so it grows to fit a two-line identity zone rather
 * than cropping the name of the thing on screen.
 */
.filename {
  flex: 0 0 auto;
  font-size: 0.9rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* The relic id is a catalog number, so it is set like one. */
.accession {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.14em;
  color: var(--ink-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  user-select: all;
}

/* The relic id and the version share one metadata line under the filename.
   The id shrinks and ellipsizes; the version keeps its width, because a
   truncated version number is worse than a truncated catalog number. */
.identity-meta {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  min-width: 0;
}

/* The id gives way, the version does not: this row is left packed so the
   version sits against the catalog number it belongs with, rather than being
   pushed to the far edge of the zone and reading as part of the actions. */
.identity-meta .accession {
  min-width: 0;
  flex: 0 1 auto;
}

.version {
  position: relative;
  flex: none;
}

.version-label {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  margin: 0;
  padding: 0.05rem 0.35rem;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.06em;
  white-space: nowrap;
}

.version-trigger {
  cursor: pointer;
  font: inherit;
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.06em;
}

.version-trigger:hover {
  border-color: var(--patina);
  color: var(--patina-ink);
}

.version-trigger:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: 1px;
}

.version-trigger .icon {
  width: 10px;
  height: 10px;
}

/* One label, two lengths. The stylesheet chooses, so nothing measures. */
.version-short {
  display: none;
}

.version-list {
  position: absolute;
  top: calc(100% + 0.3rem);
  left: 0;
  z-index: 20;
  min-width: 8rem;
  max-height: 14rem;
  overflow-y: auto;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  box-shadow: 0 6px 18px rgb(0 0 0 / 18%);
}

.version-option {
  padding: 0.4rem 0.7rem;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 0.72rem;
  white-space: nowrap;
  cursor: pointer;
}

.version-option + .version-option {
  border-top: 1px solid var(--rule);
}

.version-option:hover {
  background: var(--ground);
  color: var(--patina-ink);
}

/* Focus lands here only from a keyboard or a pointer inside an open list, so
   the ring is drawn on :focus rather than :focus-visible: it is always
   wanted, and a programmatic focus does not always match :focus-visible. */
.version-option:focus {
  outline: 2px solid var(--patina);
  outline-offset: -2px;
}

.version-option[aria-selected='true'] {
  border-left: 3px solid var(--patina);
  font-weight: 700;
}

.actions {
  display: flex;
  align-items: stretch;
  border-left: 1px solid var(--rule);
}

.action {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0 0.9rem;
  border: 0;
  border-right: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 0.82rem;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
}

.actions .action:last-child {
  border-right: 0;
}

.action:hover {
  background: var(--ground);
  color: var(--patina-ink);
}

.action:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: -2px;
}

.action.primary {
  background: var(--patina);
  color: var(--surface);
  border: 0;
  padding: 0.55rem 1rem;
  align-self: flex-start;
}

.action.primary:hover {
  background: var(--patina-ink);
  color: var(--surface);
}

.icon {
  width: 14px;
  height: 14px;
  flex: none;
  fill: currentColor;
}

/* The comment count. A number rather than a dot, because "there is a thread"
   is worth less than "there are two comments in it". */
.action-count {
  min-width: 1.1rem;
  padding: 0 0.25rem;
  border: 1px solid var(--rule-strong);
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.68rem;
  line-height: 1.4;
  text-align: center;
}

.action:hover .action-count {
  border-color: var(--patina);
  color: var(--patina-ink);
}

/*
 * The narrow hierarchy, re-derived twice: once because version added an
 * element to a row that had already overflowed, and again because Comments
 * added the eleventh.
 *
 * At 320px the row has 20rem. Five collapsed actions take about 11.9rem and
 * the version chip about 3rem, which leaves nothing for a 6.7rem wordmark and
 * a filename both. So the wordmark goes: the domain is in the address bar
 * directly above it, while the filename, the version, and the four actions
 * are not available anywhere else. Brand gives way before function.
 */
@media (max-width: 34rem) {
  /* The marker collapses with the buttons. Exempting it kept a fact at full
     width while the actions lost their labels, which pushed Report off the
     row at 420px. Its accessible name carries the meaning when the text
     goes. */
  .action span {
    display: none;
  }
  /* Except the count, which is the whole point of the control and is two
     characters wide. A bare speech bubble says a thread might exist. */
  .action span.action-count {
    display: inline-block;
  }
  .action {
    padding: 0 0.75rem;
  }
  .mark {
    display: none;
  }
  .version-long {
    display: none;
  }
  .version-short {
    display: inline;
  }
  .identity {
    padding: 0.4rem 0.7rem;
  }
  .identity-meta {
    gap: 0.4rem;
  }
}

/*
 * The 320px floor, where the sixth action stops fitting.
 *
 * Six collapsed actions are about 14.6rem, and with the count badge nearer
 * 15.2rem. Add the identity zone's 1.4rem of padding, its 0.4rem gap, and a
 * 3rem version chip and the row wants 20rem before the filename gets a
 * pixel. The filename is on the floor's must-survive list and Comments is
 * deliberately not, so Comments is what leaves.
 *
 * It is the right one to lose because losing the taskbar entry costs nothing:
 * the closed overlay leaves its compact handle on the stage at this same
 * breakpoint. Every other candidate on the row leads somewhere that is only
 * reachable through it.
 */
@media (max-width: 24rem) {
  .action-comments,
  .action-relics {
    display: none;
  }
}

/* ---------- the reading surface ---------- */

.stage {
  padding: 2rem 1.25rem 5rem;
}

.doc {
  max-width: 46rem;
  margin: 0 auto;
}

/* A markdown relic is a document, so it gets the width of a document: a
   letter page, the 8.5in sheet Google Docs lays out and a printer feeds. The
   46rem column above is narrower than that page, and it read as a strip down
   the middle of the window. The notice is widened with it so the explanation
   above the document lines up with the document it explains. */
.stage-markdown .doc,
.stage-markdown .notice {
  max-width: 8.5in;
}

.toggle-row {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 0.75rem;
}

.toggle-row .action {
  border: 1px solid var(--rule);
  padding: 0.35rem 0.7rem;
}

.notice {
  display: flex;
  gap: 0.6rem;
  align-items: flex-start;
  max-width: 46rem;
  margin: 0 auto 1.5rem;
  padding: 0.7rem 0.9rem;
  border-left: 3px solid var(--oxide);
  background: var(--surface);
  color: var(--ink);
  font-size: 0.86rem;
}

.notice .icon {
  fill: var(--oxide);
  margin-top: 0.2rem;
}

/* ---------- prose ---------- */

.prose {
  font-family: var(--serif);
  font-size: 1.06rem;
  line-height: 1.7;
}

.prose h1,
.prose h2,
.prose h3,
.prose h4,
.prose h5,
.prose h6 {
  font-family: var(--sans);
  line-height: 1.25;
  margin: 2rem 0 0.6rem;
  letter-spacing: -0.01em;
}

.prose h1 {
  font-size: 1.7rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--rule);
}

.prose h2 {
  font-size: 1.32rem;
}

.prose h3 {
  font-size: 1.1rem;
}

.prose p {
  margin: 0 0 1.1rem;
}

.prose a {
  color: var(--patina-ink);
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.prose blockquote {
  margin: 1.2rem 0;
  padding-left: 1rem;
  border-left: 2px solid var(--rule-strong);
  color: var(--ink-soft);
}

.prose hr {
  border: 0;
  border-top: 1px solid var(--rule);
  margin: 2rem 0;
}

.prose code {
  font-family: var(--mono);
  font-size: 0.86em;
  background: var(--surface);
  border: 1px solid var(--rule);
  padding: 0.05em 0.3em;
}

.prose pre {
  font-family: var(--mono);
  font-size: 0.82rem;
  line-height: 1.6;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--rule-strong);
  padding: 0.9rem 1rem;
  overflow-x: auto;
  margin: 1.2rem 0;
}

.prose pre code {
  background: none;
  border: 0;
  padding: 0;
  font-size: inherit;
}

.md-image {
  font-family: var(--mono);
  font-size: 0.8rem;
  color: var(--ink-soft);
  border: 1px dashed var(--rule-strong);
  padding: 0.1em 0.4em;
}

/* Wide content scrolls inside its own container; the body never does. */
.md-scroll {
  overflow-x: auto;
  margin: 1.2rem 0;
  border: 1px solid var(--rule);
}

.prose table {
  border-collapse: collapse;
  width: 100%;
  font-family: var(--sans);
  font-size: 0.88rem;
}

.prose th,
.prose td {
  text-align: left;
  padding: 0.5rem 0.75rem;
  border-bottom: 1px solid var(--rule);
  white-space: nowrap;
}

.prose th {
  background: var(--surface);
  font-weight: 600;
}

.raw {
  font-family: var(--mono);
  font-size: 0.82rem;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  background: var(--surface);
  border: 1px solid var(--rule);
  padding: 1rem;
  margin: 0;
}

/* ---------- code ---------- */

.code {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--rule);
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 0.82rem;
  line-height: 1.6;
}

.gutter {
  margin: 0;
  padding: 1rem 0.75rem;
  text-align: right;
  color: var(--ink-soft);
  background: var(--ground);
  border-right: 1px solid var(--rule);
  user-select: none;
  flex: none;
}

.code-body {
  margin: 0;
  padding: 1rem;
  flex: 1;
  min-width: 0;
}

.tok-kw {
  color: var(--patina-ink);
  font-weight: 600;
}

.tok-str {
  color: var(--oxide);
}

.tok-num {
  color: var(--oxide);
}

.tok-com {
  color: var(--ink-soft);
  font-style: italic;
}

/* ---------- image, html, download ---------- */

.doc-image {
  max-width: none;
  display: flex;
  justify-content: center;
}

.doc-image img {
  max-width: 100%;
  height: auto;
  border: 1px solid var(--rule);
  background: var(--surface);
}

.doc-media {
  max-width: 52rem;
  margin: 2rem auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.25rem;
}

.media-player {
  max-width: 100%;
  width: 100%;
  background: #000;
  border: 1px solid var(--rule);
}

.media-video {
  max-height: 48rem;
}

.media-audio {
  background: var(--surface);
}

/* The picture and its controls, the element fullscreen takes. Inline it lays
   them out exactly as the card did when they were its own children: full
   width, stacked, the card's gap between them. */
.media-stage {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.25rem;
}

.media-chrome {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
}

.media-audio-card {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem 1.25rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  box-sizing: border-box;
}

.media-audio-emblem {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2.25rem;
  height: 2.25rem;
  background: color-mix(in srgb, var(--ink) 6%, transparent);
  border: 1px solid var(--rule);
  color: var(--patina);
  flex-shrink: 0;
}

.media-audio-emblem .media-icon {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

.media-audio-info {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  min-width: 0;
}

.media-audio-title {
  font-family: var(--sans);
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--ink);
  word-break: break-word;
}

.media-audio-state {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-soft);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Scrubber */
.media-scrubber-wrap {
  width: 100%;
  padding: 0.5rem 0.75rem 0.25rem;
  box-sizing: border-box;
}

.media-scrubber {
  position: relative;
  width: 100%;
  height: 24px;
  display: flex;
  align-items: center;
  cursor: pointer;
  user-select: none;
  touch-action: none;
  outline: none;
}

.media-scrubber:focus-visible .media-track-rail {
  outline: 1px solid var(--patina);
  outline-offset: 2px;
}

.media-track-rail {
  position: relative;
  width: 100%;
  height: 4px;
  background: color-mix(in srgb, var(--ink) 14%, transparent);
  box-sizing: border-box;
}

.media-buffered-bar {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: 0%;
  background: color-mix(in srgb, var(--ink) 24%, transparent);
  pointer-events: none;
}

.media-played-bar {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: 0%;
  background: var(--patina);
  pointer-events: none;
}

/* Pending Selection */
.media-pending-selection {
  position: absolute;
  top: -2px;
  height: 8px;
  background: color-mix(in srgb, var(--patina) 35%, transparent);
  border-top: 1px dashed var(--patina);
  border-bottom: 1px dashed var(--patina);
  pointer-events: none;
  z-index: 3;
}

.media-pending-selection.is-hidden {
  display: none !important;
}

.timeline-span-handle {
  position: absolute;
  top: 50%;
  right: 0;
  width: 8px;
  height: 16px;
  transform: translate(50%, -50%);
  background: var(--surface);
  border: 1px solid var(--patina);
  border-radius: 0;
  padding: 0;
  cursor: ew-resize;
  pointer-events: auto;
  z-index: 6;
}

.timeline-span-handle:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: 1px;
}

.pending-time-tag {
  display: none;
}

/* Hover Indicator */
.media-hover-indicator {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.media-hover-indicator.is-hidden {
  display: none !important;
}

.hover-rule {
  width: 1px;
  height: 18px;
  background: var(--ink);
}

.hover-timecode {
  position: absolute;
  bottom: calc(100% + 4px);
  background: var(--surface);
  border: 1px solid var(--rule);
  padding: 1px 4px;
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--ink);
  white-space: nowrap;
}

/* A panel open over the scrubber already names the time it is about, and it
   sits exactly where this readout does: the readout's lower edge would show
   under the panel as a stray notch. The rule and the comment button stay, so
   a reader can still aim somewhere else. */
.stage-wrap:has(.popover) .hover-timecode {
  visibility: hidden;
}

.timeline-hover-comment-btn {
  position: absolute;
  top: calc(100% + 4px);
  width: 18px;
  height: 18px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border: 1px solid var(--patina);
  border-radius: 0;
  color: var(--patina);
  cursor: pointer;
  pointer-events: auto;
}

.timeline-hover-comment-btn:hover {
  background: var(--patina);
  color: var(--surface);
}

.timeline-hover-comment-btn .media-icon {
  width: 12px;
  height: 12px;
  fill: currentColor;
}

/* Controls Bar */
.media-controls-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.4rem 0.75rem 0.5rem;
  gap: 0.75rem;
  border-top: 1px solid color-mix(in srgb, var(--rule) 60%, transparent);
}

.media-controls-left,
.media-controls-right {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.media-btn {
  width: 28px;
  height: 28px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 0;
  color: var(--ink);
  cursor: pointer;
  transition: border-color 0.1s ease, color 0.1s ease;
}

.media-btn:hover {
  border-color: var(--patina);
  color: var(--patina);
}

.media-btn:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: 1px;
}

.media-btn .media-icon {
  width: 14px;
  height: 14px;
  fill: currentColor;
}

.media-timecode {
  font-family: var(--mono);
  font-size: 0.76rem;
  color: var(--ink);
  letter-spacing: 0.04em;
  user-select: none;
}

.time-sep {
  color: var(--ink-soft);
}

.time-duration {
  color: var(--ink-soft);
}

.media-meta-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 0.75rem 1rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  gap: 1rem;
}

.media-meta-info {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  min-width: 0;
}

.media-meta-name {
  font-family: var(--sans);
  font-size: 0.95rem;
  font-weight: 600;
  word-break: break-word;
}

.media-meta-details {
  font-family: var(--mono);
  font-size: 0.76rem;
  color: var(--ink-soft);
  word-break: break-word;
}

/* ---------- media fullscreen ----------

   Only the stage goes fullscreen, so this is the whole screen: the picture
   letterboxed on black and the controls laid over the bottom of the frame on
   a dark band. The band keeps the label's language, a hairline rule, square
   corners and patina for interaction, and reads light on dark in either
   scheme because the ground here is the film rather than the page. Every
   control rule above takes its colours from these tokens, so redefining them
   on the stage is the whole of the restyle. */

.media-stage:fullscreen {
  color-scheme: dark;
  --surface: #171b1c;
  /* Below the band rather than above it: a comment field in a panel on the
     stage sits on the ground, and the page's light ground under the stage's
     light ink made what was typed there unreadable. */
  --ground: #0e1112;
  --ink: #e6e9e7;
  --ink-soft: #969e9d;
  --rule: #3b4345;
  --rule-strong: #4d5759;
  --patina: #4fb3a6;
  --patina-ink: #a7ded6;
  display: block;
  background: #000;
}

.media-stage::backdrop {
  background: #000;
}

.media-stage:fullscreen .media-video {
  display: block;
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
  border: 0;
  object-fit: contain;
}

.media-stage:fullscreen .media-chrome {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  width: auto;
  padding: 0 1rem 0.5rem;
  border: 0;
  border-top: 1px solid var(--rule);
  background: rgb(8 10 11 / 0.82);
}

/* Idle playback leaves the bare frame. Markers, the span handle and the hover
   button opt back into pointer events on their own, so the band's descendants
   are released too: nothing invisible can be pressed. */
.media-stage.is-idle:fullscreen {
  cursor: none;
}

.media-stage.is-idle:fullscreen .media-chrome {
  opacity: 0;
}

.media-stage.is-idle:fullscreen .media-chrome,
.media-stage.is-idle:fullscreen .media-chrome * {
  pointer-events: none;
}

@media (prefers-reduced-motion: no-preference) {
  .media-stage:fullscreen .media-chrome {
    transition: opacity 200ms ease;
  }
}

.doc-html,
.doc-jsx {
  max-width: none;
}

/*
 * No height here, deliberately. Every frame this class reaches is inside a
 * sandboxed stage or a comparison pane, and both set their own: the only
 * routes that build a frame are `sandboxed-html` and `sandboxed-jsx`, plus the
 * two panes of a rendered comparison. This rule used to carry
 * `calc(100vh - var(--bar-height) - 4rem)`, a third answer nothing ever read,
 * which is how the same guess survived unnoticed in the rule below it.
 */
.usercontent-frame {
  width: 100%;
  border: 1px solid var(--rule);
  background: #fff;
}

/*
 * A published HTML document is already a page. It brings its own margins, its
 * own background, and often a full-bleed hero that runs to the edge on
 * purpose. Sitting it inside the reading gutter puts a second margin around a
 * document that already decided how it wants to sit, and frames somebody's
 * design in a border they did not ask for.
 *
 * So the HTML and component routes get the whole surface. Markdown and code
 * keep the gutter, because that markup is generated here from a plain file
 * and has no opinion of its own to respect.
 */
.stage-sandboxed-html,
.stage-sandboxed-jsx {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 0;
}

/*
 * The wrapper is in the chain and skipping it broke the viewer once.
 *
 * The frame is not a child of the stage: `renderSandboxedHtml` wraps it in a
 * `.doc` first. An earlier attempt put the fill on the frame and the flex
 * container on the stage, so the flex properties applied to something that
 * was not a flex child and did nothing, while the height they replaced was
 * the only thing sizing the iframe. It collapsed to its intrinsic 300x150 in
 * production. This rule is the missing middle.
 *
 * A flex child rather than `height: 100%` so a notice above it takes its own
 * height instead of being added to a frame already claiming the whole row.
 */
.stage-sandboxed-html .doc,
.stage-sandboxed-jsx .doc {
  flex: 1 1 auto;
  min-height: 0;
  margin: 0;
}

.stage-sandboxed-html .usercontent-frame,
.stage-sandboxed-jsx .usercontent-frame {
  /* Block, or the iframe sits on the text baseline and leaves a strip of page
     background under it that reads as one more stray margin. */
  display: block;

  /*
   * Fills the wrapper rather than guessing at the chrome. This was
   * `calc(100vh - var(--bar-height))`, and the reserve has to equal the real
   * taskbar to the pixel. It does not: `.bar` carries a min-height and the
   * identity zone stacks a filename over an accession number, so the frame
   * ended up taller than the row, `.stage-wrap` grew a scrollbar for the
   * overflow, and the iframe kept its own.
   */
  height: 100%;
  border: 0;
}

/* The network notice sits above every frame, and a downgrade notice would
   too if routing ever changed; either way it must not be jammed against the
   window edge. */
.stage-sandboxed-html .notice,
.stage-sandboxed-jsx .notice {
  margin: 1rem 1.25rem;
}

.card {
  max-width: 34rem;
  margin: 3rem auto;
  padding: 1.75rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-top: 3px solid var(--rule-strong);
}

.card-title {
  font-family: var(--sans);
  font-size: 1.15rem;
  font-weight: 600;
  margin: 0 0 0.35rem;
  word-break: break-word;
}

.card-meta {
  font-family: var(--mono);
  font-size: 0.76rem;
  color: var(--ink-soft);
  margin-bottom: 1.25rem;
  word-break: break-word;
}

.card-note {
  margin: 1.25rem 0 0;
  font-size: 0.86rem;
  color: var(--ink-soft);
}

.stage-dead .card {
  border-top-color: var(--oxide);
}

.stage-dead .accession {
  margin-top: 1.25rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--rule);
}

/* ---------- the loading plate, dead and damaged cards, render pill ---------- */

/*
 * The plate stands where a dead card would stand: the same stage, the same
 * card, the same width and margins. An open that fails replaces it in place,
 * and the only thing that changes colour is the top rule, patina while the
 * open is live and oxide once it has stopped.
 */
.stage-loading .card {
  border-top-color: var(--patina);
}

/*
 * Every line the plate will ever show has its row from the first frame. The
 * transfer line is empty until the mint returns and the contents line is
 * hidden until record 0 decrypts, so in a flow layout each arrival would push
 * the explanation down while the reader is reading it. Fixed rows mean the
 * card fills in rather than grows. Hidden still means display: none; the row
 * it would occupy is the grid's, not the paragraph's.
 */
.load-card {
  --load-line: 1.25rem;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto var(--load-line) var(--load-line) auto;
}

.load-card > * {
  margin: 0;
}

/* The phase sits where a dead card's headline sits, and is set the same way. */
.load-phase {
  grid-row: 1;
  font-family: var(--sans);
  font-size: 1.15rem;
  font-weight: 600;
}

/*
 * A hairline track, square like everything else, filled in patina. The
 * fraction arrives as `--load-fraction`, so the fill is a transform and a
 * reader on a slow line watching it creep costs no layout.
 */
.load-meter {
  grid-row: 2;
  position: relative;
  height: 0.375rem;
  margin: 1rem 0 0.85rem;
  overflow: hidden;
  background: var(--ground);
  border: 1px solid var(--rule-strong);
}

.load-meter::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--patina);
  transform: scaleX(var(--load-fraction, 0));
  transform-origin: left center;
}

/*
 * Opening has no fraction, so the meter carries no aria-valuenow and the
 * track is hatched. A still segment would read as a third of the way there,
 * which is a number nobody has yet.
 */
.load-meter:not([aria-valuenow])::before {
  background: repeating-linear-gradient(
    135deg,
    var(--rule-strong) 0 1px,
    transparent 1px 5px
  );
  transform: none;
}

.load-card > [data-load-transfer] {
  grid-row: 3;
}

.load-card > [data-load-contents] {
  grid-row: 4;
}

/* TRANSFER, CONTENTS and Fetching are all eight letters, so in monospace the
   numbers on the two lines start in the same column. */
.load-card > [data-load-transfer],
.load-card > [data-load-contents] {
  min-width: 0;
  overflow: hidden;
  font-family: var(--mono);
  font-size: 0.78rem;
  line-height: var(--load-line);
  letter-spacing: 0.02em;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.load-card > .card-note {
  grid-row: 5;
  margin-top: 1rem;
  padding-top: 0.85rem;
  border-top: 1px solid var(--rule);
}

/*
 * Away from the band every action is a bordered button that keeps its words,
 * the share sheet's rule. The band's dividers mean nothing on a card, and the
 * narrow collapse that strips the band's labels would otherwise leave Try
 * again as a bare glyph.
 */
.card-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-top: 1.25rem;
}

.card-actions .action {
  padding: 0.55rem 1rem;
  border: 1px solid var(--rule-strong);
}

.card-actions .action.primary {
  border-color: var(--patina);
}

.card-actions .action span {
  display: inline;
}

/* While a key that passed the local check downloads its relic, the submit
   rests and the bytes are counted under the form. */
.key-entry-submit:disabled,
.key-entry-submit:disabled:hover {
  color: var(--ink-soft);
  background: var(--ground);
  box-shadow: inset 0 0 0 1px var(--rule-strong);
  cursor: default;
}

.key-entry-progress {
  margin: 0.6rem 0 0;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.78rem;
  letter-spacing: 0.02em;
}

/*
 * Below the band's collapse width the field takes the card's whole width and
 * the button drops under it. Side by side, the field was a third of the card
 * and its placeholder, the twelve words or the whole link, showed two words.
 */
@media (max-width: 34rem) {
  .key-entry-row {
    flex-wrap: wrap;
  }

  .key-entry-input {
    flex-basis: 100%;
  }
}

/*
 * The render pill, which also carries a version switch's progress.
 *
 * A body child placed straight after the band, never inside it: it adds
 * nothing to the band's width accounting (viewer.md 6.5) and updating it never
 * rebuilds the band, so no band control loses focus. It is a strip as wide as
 * the band, laid over the band's own bottom edge and transparent except for
 * two things: a sweep along the band's rule, and a patina tag at the far end
 * naming the phase, set like the pin tool's hint because it is the same kind
 * of thing, a statement nobody presses. Its negative top margin equals its
 * height, so it takes no height: it arrives and leaves without moving the
 * relic, and because it never leaves the band's box it never covers a frame.
 */
.render-status {
  --render-status-height: 0.95rem;
  position: relative;
  z-index: 11;
  flex: none;
  display: flex;
  justify-content: flex-end;
  height: var(--render-status-height);
  margin-top: calc(-1 * var(--render-status-height));
  overflow: hidden;
  pointer-events: none;
}

.render-status-label {
  position: relative;
  display: block;
  max-width: 100%;
  padding: 0 0.55rem;
  overflow: hidden;
  background: var(--patina);
  color: var(--surface);
  font-family: var(--mono);
  font-size: 0.66rem;
  line-height: var(--render-status-height);
  white-space: nowrap;
  text-overflow: ellipsis;
}

@media (prefers-reduced-motion: no-preference) {
  .load-meter[aria-valuenow]::before {
    transition: transform 140ms linear;
  }
  .load-meter:not([aria-valuenow])::before,
  .render-status::before {
    width: 30%;
    background: var(--patina);
    animation: load-sweep 1.4s ease-in-out infinite;
  }
  .load-meter:not([aria-valuenow])::before {
    right: auto;
  }
  /* The strip's own meter: a sweep along the band's bottom rule. */
  .render-status::before {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    height: 2px;
  }
  @keyframes load-sweep {
    from {
      transform: translateX(-100%);
    }
    to {
      transform: translateX(334%);
    }
  }
}

/*
 * One line, two lengths, as the version label does it. At the 320px floor the
 * band's actions are narrower than "Version 2: Fetching 41.2 of 105.3 MB",
 * and the overflow would land on the version chip. The version number has
 * already been announced by "Opening version 2", so it leaves the view there
 * and stays in the sentence a screen reader hears.
 */
@media (max-width: 24rem) {
  .render-status-version {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
}

/* ---------- PDF stage and marks ---------- */

.stage-pdf {
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: auto;
  padding: 1.5rem 1rem;
}

.doc-pdf {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}

.pdf-toolbar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  padding: 0.5rem 1rem;
  margin-bottom: 1rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 6px;
  font-family: var(--sans);
  font-size: 0.85rem;
  color: var(--ink);
}

.pdf-toolbar button {
  padding: 0.25rem 0.6rem;
  font-size: 0.85rem;
}

.pdf-page-indicator {
  font-family: var(--mono);
  font-size: 0.8rem;
  color: var(--ink-soft);
}

.pdf-page-container {
  position: relative;
  display: inline-block;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
  background: #ffffff;
  border-radius: 2px;
  overflow: hidden;
}

canvas.relic-page {
  display: block;
  max-width: 100%;
  height: auto;
  background: #ffffff;
}

.pdf-status-card {
  max-width: 34rem;
  margin: 3rem auto;
  padding: 1.75rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-top: 3px solid var(--patina);
}

.pdf-status-title {
  font-family: var(--sans);
  font-size: 1.15rem;
  font-weight: 600;
  margin: 0 0 0.35rem;
}

.mark-page,
.mark-region {
  position: absolute;
  box-sizing: border-box;
  border: 2px solid var(--patina);
  background: rgba(31, 107, 100, 0.15);
  border-radius: 2px;
  pointer-events: auto;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.mark-page.is-active,
.mark-region.is-active {
  background: rgba(31, 107, 100, 0.35);
  border-color: var(--patina-ink);
  box-shadow: 0 0 0 2px rgba(31, 107, 100, 0.4);
}

.mark-page.is-pending,
.mark-region.is-pending {
  border-style: dashed;
  background: rgba(31, 107, 100, 0.1);
  pointer-events: none;
}

/* ---------- version history ---------- */

.stage-diff {
  position: relative;
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-width: min(100%, 28rem);
  min-height: 0;
  padding: 1.25rem 1.25rem 0;
  overflow: hidden;
}

/*
 * A two-column comparison is the view that most needs width, so it opts out
 * of the reading gutter the way `.doc-image` and `.doc-jsx` already do rather
 * than inventing a cap of its own. It carried `width: min(78rem, 100%)`,
 * which pinned the pane at 1248px and left roughly 425px of dead page beside
 * it at a 1568px viewport.
 *
 * There is nothing left to declare: a block element already fills its parent,
 * and `.stage-diff`'s padding is the only gutter wanted here.
 */
.diff-shell {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  max-width: none;
}

.diff-toolbar {
  flex: none;
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 2rem;
  padding: 0 0 0.75rem;
  border-bottom: 1px solid var(--rule-strong);
}

.diff-heading {
  min-width: 0;
}

.diff-eyebrow {
  margin-bottom: 0.25rem;
  color: var(--patina-ink);
  font-family: var(--mono);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.diff-heading h1 {
  margin: 0;
  font-size: clamp(1.3rem, 2.5vw, 1.9rem);
  line-height: 1.2;
  letter-spacing: -0.02em;
}

/*
 * The heading takes focus when a comparison opens, so a screen reader lands on
 * what changed rather than at the top of the taskbar. A mouse user should not
 * see a ring for a focus they did not ask for, and a keyboard user must.
 */
.diff-heading h1:focus {
  outline: none;
}

.diff-heading h1:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: 4px;
}

.diff-history-note {
  max-width: 52rem;
  margin: 0.45rem 0 0;
  color: var(--ink-soft);
  font-size: 0.88rem;
}

.compare-picker {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex: none;
}

.compare-picker-side {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  position: relative;
}

.compare-picker-caption {
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--ink-soft);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.compare-picker-separator {
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--ink-soft);
}

.compare-picker-trigger {
  padding: 0.2rem 0.5rem;
  font-size: 0.72rem;
}

.compare-picker-right .version-list {
  left: auto;
  right: 0;
}

.image-diff-control input:focus-visible,
.compare-swipe input:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: 2px;
}

/* ---------- the rendered comparison ---------- */

/*
 * Two panes showing the same artifact at two versions. Swipe stacks them and
 * wipes between them, which is what answers "did the page move". Side by side
 * puts them in two columns, which is what answers "what does it say now".
 */
.compare-stage {
  --split: 50%;
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
}

.compare-stage[data-layout='swipe'] {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
}

.compare-stage[data-layout='swipe'] .compare-pane {
  grid-area: 1 / 1;
  min-width: 0;
  min-height: 0;
  height: 100%;
}

.compare-stage[data-layout='swipe'] .compare-pane-current {
  clip-path: inset(0 calc(100% - var(--split)) 0 0);
}

.compare-stage[data-layout='split'] {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: minmax(0, 1fr);
}

.compare-stage[data-layout='split'] .compare-pane {
  min-width: 0;
  min-height: 0;
  height: 100%;
}

.compare-stage[data-layout='split'] .compare-pane-before {
  border-right: 1px solid var(--rule-strong);
}

.compare-stage[data-layout='split'] .compare-divider {
  display: none;
}

.compare-pane {
  overflow: auto;
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  height: 100%;
}

/* Prose panes carry their own reading padding; a frame brings its own page. */
.compare-pane .prose {
  padding: 1.25rem 1.5rem;
}

.compare-pane .usercontent-frame {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
.compare-divider {
  position: absolute;
  top: 0;
  bottom: 0;
  left: var(--split);
  width: 1px;
  background: #fff;
  box-shadow: 0 0 0 1px rgb(0 0 0 / 35%);
  pointer-events: none;
}

.compare-label {
  position: absolute;
  top: 0.6rem;
  z-index: 2;
  padding: 0.2rem 0.45rem;
  background: rgb(16 19 20 / 82%);
  color: #fff;
  font-family: var(--mono);
  font-size: 0.66rem;
  pointer-events: none;
}

/*
 * Swipe reveals the current version from the left, so its label sits left and
 * the historical one sits right. Side by side puts the panes in DOM order,
 * historical then current, so the labels swap with them. They are stage
 * children rather than pane children because a label inside the current pane
 * would be clipped away with it at the far end of the swipe.
 */
.compare-label-before {
  right: 0.6rem;
}

.compare-label-current {
  left: 0.6rem;
}

.compare-stage[data-layout='split'] .compare-label-before {
  right: auto;
  left: 0.6rem;
}

.compare-stage[data-layout='split'] .compare-label-current {
  left: auto;
  right: 0.6rem;
}

.compare-controls {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  margin-top: 0.75rem;
}

.compare-layout {
  display: flex;
  flex: none;
  border: 1px solid var(--rule-strong);
}

.compare-layout .action {
  padding: 0.35rem 0.7rem;
}

.compare-layout .action[aria-pressed='true'] {
  background: var(--patina);
  color: var(--surface);
}

/*
 * Moving through the changes.
 *
 * Beside the layout control because they are the same kind of thing: what
 * the comparison shows, and where in it you are.
 */
.compare-nav {
  display: flex;
  flex: none;
  align-items: center;
  gap: 0.25rem;
  border: 1px solid var(--rule-strong);
}

.compare-nav .action {
  padding: 0.35rem 0.5rem;
}

/* The chevron is drawn pointing down, so each direction turns it. */
.compare-nav-previous svg {
  transform: rotate(90deg);
}

.compare-nav-next svg {
  transform: rotate(-90deg);
}

.compare-nav-position {
  padding: 0 0.35rem;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.72rem;
  white-space: nowrap;
}

/*
 * The one you were sent to.
 *
 * Stronger than the outline every changed node already carries, because
 * the question this answers is which of them you are looking at, and an
 * outline identical to its neighbours answers nothing.
 */
[data-relic-change-id].is-current-change {
  outline: 3px solid var(--patina);
  outline-offset: 3px;
}

/* A row that takes you to the change it names says so by behaving like it. */
.diff-change.is-linked {
  cursor: pointer;
}

.diff-change.is-linked:hover,
.diff-change.is-linked:focus-visible {
  background: color-mix(in srgb, var(--patina) 10%, transparent);
}

.compare-swipe {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex: 1;
  min-width: 0;
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.compare-swipe span {
  flex: none;
}

.compare-swipe input {
  flex: 1;
  min-width: 4rem;
  accent-color: var(--patina);
}

.diff-rendered-result {
  margin-top: 1rem;
}

.diff-rendered-result:empty {
  display: none;
}

/* What changed, in rendered terms. Attacker text arrives as text nodes. */
.diff-change-list {
  margin: 0;
  padding: 0;
  list-style: none;
  border: 1px solid var(--rule);
  background: var(--surface);
  font-size: 0.84rem;
}

/*
 * Two lines: the label above, the quote under it.
 *
 * Three columns was the layout, and every list lands in a sidebar a reader
 * can drag down to 230px, where the first two columns ate every pixel:
 * 5.5rem and 7rem plus the gaps leave about six for the quote, which
 * `overflow-wrap: anywhere` then broke one character per line into a 995px
 * tall row. One layout, sized for the column the list actually renders in.
 */
.diff-change {
  display: grid;
  grid-template-columns: 5.5rem minmax(0, 1fr);
  gap: 0.15rem 0.75rem;
  padding: 0.5rem 0.75rem;
}

.diff-change + .diff-change {
  border-top: 1px solid var(--rule);
}

.diff-change-kind {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.diff-change-added .diff-change-kind {
  color: var(--patina-ink);
}

.diff-change-removed .diff-change-kind {
  color: var(--oxide);
}

.diff-change-what {
  color: var(--ink-soft);
}

/*
 * Three lines of the quote, then it stops.
 *
 * The row is a way to reach the change, not a copy of it: pressing it puts
 * the reader on the real text. An unclamped paragraph made one row taller
 * than the viewport, which turned a list of three changes into a scroll.
 */
.diff-change-detail {
  grid-column: 1 / -1;
  min-width: 0;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  line-clamp: 3;
  overflow: hidden;
}


/*
 * On a changed row the old text and the new one each get their own two
 * lines.
 *
 * Clamping the whole cell cut the replacement off entirely: the row showed
 * three lines of struck-through old text and nothing of what it became,
 * which is the half the reader is looking for. So the cell stops clamping
 * where both exist and each side clamps itself.
 */
.diff-change-changed .diff-change-detail {
  display: block;
  overflow: visible;
}

.diff-change-detail del,
.diff-change-detail ins {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
}

.diff-change-detail del {
  background: var(--diff-removed);
  text-decoration-thickness: 1px;
}

.diff-change-detail ins {
  background: var(--diff-added);
  text-decoration: none;
}

.diff-result {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-height: 0;
  padding-top: 0.75rem;
}

.diff-loading {
  margin: 2rem 0;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.82rem;
}

/* ---------- one version, shown on its own ---------- */

/* The reason, the label, and the version all sit in one column so the page
   reads top to bottom. Without this the label sat at the far left of a
   full-bleed shell while the notice and the rendered version were centred
   by their own rules, which looked like three unrelated fragments rather
   than one version with an explanation above it. */
.diff-single {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-height: 0;
  gap: 1rem;
}

.diff-single > .notice {
  margin: 0;
}

.diff-single-label {
  margin: 0;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.82rem;
}

/* The stage builder centres its own children against the reading column, so
   the wrapper hands it the full width it expects rather than nesting a
   second narrower one inside this one. */
.diff-single > .doc,
.diff-single > .stage {
  flex: 1 1 auto;
  min-height: 0;
  margin: 0;
  max-width: none;
}

.diff-view,
.diff-view-markdown,
.diff-view-rendered,
.diff-view-code,
.diff-view-image {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-height: 0;
}

.diff-summary {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 0.75rem;
  font-family: var(--mono);
  font-size: 0.76rem;
}

.diff-summary span {
  color: var(--ink-soft);
  text-align: right;
}

.diff-empty {
  display: grid;
  gap: 0.25rem;
  padding: 1.25rem;
  border: 1px solid var(--rule);
  border-top: 3px solid var(--patina);
  background: var(--surface);
}

.diff-empty span {
  color: var(--ink-soft);
  font-size: 0.86rem;
}

.diff-changes {
  overflow: auto;
  flex: 1 1 auto;
  min-height: 0;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  font-family: var(--mono);
  font-size: 0.78rem;
  line-height: 1.6;
}

.diff-part {
  display: grid;
  grid-template-columns: 3.2rem 3.2rem minmax(0, 1fr);
}

.diff-part + .diff-part {
  border-top: 1px solid var(--rule);
}

.diff-part-added {
  background: var(--diff-added);
}

.diff-part-removed {
  background: var(--diff-removed);
}

.diff-part-unchanged {
  color: var(--ink-soft);
}

.diff-gutter,
.diff-body {
  min-width: 0;
  margin: 0;
  padding: 0.5rem 0.65rem;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.diff-gutter {
  text-align: right;
  color: var(--ink-soft);
  background: color-mix(in srgb, var(--ground) 75%, transparent);
  border-right: 1px solid var(--rule);
  user-select: none;
}

.diff-body {
  overflow-x: auto;
  color: var(--ink);
}

.diff-inline-added {
  background: var(--diff-added-strong);
  color: var(--ink);
  font-weight: 700;
}

.diff-inline-removed {
  background: var(--diff-removed-strong);
  color: var(--ink);
  font-weight: 700;
}

.image-diff-canvas {
  --split: 50%;
  position: relative;
  display: grid;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  place-items: center;
}

.image-diff-control {
  flex: none;
}

.image-diff-canvas img {
  grid-area: 1 / 1;
  display: block;
  width: 100%;
  max-height: 70vh;
  object-fit: contain;
}

.image-diff-current {
  clip-path: inset(0 calc(100% - var(--split)) 0 0);
}

.image-diff-divider {
  position: absolute;
  top: 0;
  bottom: 0;
  left: var(--split);
  width: 1px;
  background: #fff;
  box-shadow: 0 0 0 1px rgb(0 0 0 / 35%);
  pointer-events: none;
}

.image-diff-label {
  position: absolute;
  top: 0.75rem;
  padding: 0.25rem 0.45rem;
  background: rgb(16 19 20 / 82%);
  color: #fff;
  font-family: var(--mono);
  font-size: 0.68rem;
  pointer-events: none;
}

.image-diff-label-before {
  right: 0.75rem;
}

.image-diff-label-current {
  left: 0.75rem;
}

.image-diff-control {
  display: grid;
  gap: 0.45rem;
  margin-top: 0.75rem;
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.image-diff-control input {
  width: 100%;
  accent-color: var(--patina);
}

@media (max-width: 44rem) {
  .stage-diff {
    min-width: 0;
    padding: 1rem 0.65rem 0;
  }

  .diff-toolbar {
    align-items: stretch;
    flex-direction: column;
    gap: 0.85rem;
  }
  .compare-picker {
    flex-wrap: wrap;
    gap: 0.5rem;
  }


  /* Two columns of prose at 320px is two columns of nothing, so a split
     layout stacks and the swipe control keeps working either way. */
  .compare-stage[data-layout='split'] {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
  }

  .compare-stage[data-layout='split'] .compare-pane-before {
    border-right: 0;
    border-bottom: 1px solid var(--rule-strong);
  }

  /* Stacked, the two labels would both sit at the top of the stage and the
     current one would name the historical pane. It moves to the foot, which
     is where its pane now is. */
  .compare-stage[data-layout='split'] .compare-label-current {
    top: auto;
    bottom: 0.6rem;
  }

  .compare-pane,
  .compare-pane .usercontent-frame {
    max-height: none;
    height: 100%;
  }

  .compare-pane .prose {
    padding: 0.9rem 1rem;
  }

  .compare-controls {
    align-items: stretch;
    flex-direction: column;
    gap: 0.6rem;
  }


  .diff-summary {
    align-items: flex-start;
    flex-direction: column;
    gap: 0.2rem;
  }

  .diff-summary span {
    text-align: left;
  }

  .diff-part {
    grid-template-columns: 2.35rem 2.35rem minmax(0, 1fr);
  }

  .diff-gutter,
  .diff-body {
    padding: 0.4rem;
  }

  .image-diff-canvas {
    min-height: 10rem;
  }
}

/* ---------- the comment sidebar ---------- */

/*
 * The conversation sits beside the relic, not under it and not over it.
 *
 * Reading and commenting are one pass: a comment gets written next to the
 * line it is about, while that line is still on the screen. So the sidebar
 * takes width from the row and the relic reflows narrower. Darkrun keeps its
 * thread in a side panel beside the marks it paints on the artifact, and this
 * is that, on the viewing origin, because the render frame cannot fetch.
 */
.thread {
  display: none;
  flex: 0 0 auto;
  width: var(--thread-width, 22rem);
  max-width: 100%;
  margin: 0;
  padding: 0 1.25rem 1.5rem;
  overflow-y: auto;
  background: var(--surface);
  border-left: 1px solid var(--rule-strong);
}

.thread.is-open {
  display: block;
}

/* Seven pixels of grab centred on the one pixel of rule, so the divider is
   reachable without putting a visible slab between the two columns. */
.thread-resizer {
  position: absolute;
  top: 0;
  right: var(--thread-width, 22rem);
  bottom: 0;
  z-index: 5;
  width: 7px;
  margin-right: -3px;
  cursor: col-resize;
  touch-action: none;
}

.thread-resizer:focus-visible {
  outline: 2px solid var(--patina);
}

.thread:not(.is-open) ~ .thread-resizer {
  display: none;
}

/* The entry that survives every width, including the floor where the taskbar
   control leaves the row. */
.thread-tab {
  position: relative;
  flex: 0 0 auto;
  align-self: center;
  z-index: 5;
  padding: 0.85rem 0.4rem;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 0.76rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  writing-mode: vertical-rl;
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-right: 0;
  cursor: pointer;
}

.diff-row {
  position: relative;
  display: flex;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
}

/**
 * The sidebar needs a floor of its own, not just a ceiling.
 *
 * Bounding it to `calc(100% - 28rem)` stopped it crushing the comparison,
 * which was the defect it was written for, and then handed the sidebar
 * whatever was left: 167px at a 1180 viewport, 192 at 1400, 135 at 900, with
 * two dozen of its own children overflowing horizontally and its rows reading
 * "CHANGED par". A squeezed panel is the same defect as a squeezed rail, one
 * element over.
 *
 * So both sides carry a legible minimum and the ceiling stays. `clamp` picks
 * the reader's dragged width when it fits between them. Below the width where
 * both minima cannot hold, the narrow rule further down takes over and the
 * row stacks instead of splitting.
 */
.diff-row .thread {
  flex: 0 1 auto;
  width: clamp(18rem, var(--thread-width, 22rem), calc(100% - 28rem));
  min-width: 18rem;
  max-width: calc(100% - 28rem);
}

.diff-changes-sidebar .thread-title {
  display: flex;
  align-items: center;
  margin: 0;
  padding: 1rem 0;
  border-bottom: 1px solid var(--rule);
}

.diff-changes-sidebar .thread-toggle {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: none;
  border: 0;
  padding: 0;
  font-family: var(--sans);
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--ink);
  cursor: pointer;
}

.diff-changes-body {
  padding: 0.75rem 0 1.5rem;
}

.diff-tab {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.thread-tab:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: 2px;
}

.thread.is-open ~ .thread-tab {
  display: none;
}

.thread-title {
  position: sticky;
  top: 0;
  z-index: 1;
  margin: 0 -1.25rem 1rem;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.thread-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 2.75rem;
  padding: 0.65rem 1.25rem;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  font-weight: 600;
  text-align: left;
  background: transparent;
  border: 0;
  cursor: pointer;
}

/* Pointing right, because the header control only ever closes: the sidebar is
   not on the page to be opened from. */
.thread-toggle::after {
  width: 0.55rem;
  height: 0.55rem;
  content: "";
  border-top: 1px solid currentColor;
  border-right: 1px solid currentColor;
  transform: rotate(45deg);
}

.thread-toggle:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: -4px;
}

/* The tool row, directly under the heading, because arming a tool is the
   first thing a reader does in here and the second thing is scrolling. */
.thread-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem;
  margin: 0 0 1rem;
}

.mark-mode {
  padding: 0.35rem 0.7rem;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 0.78rem;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-radius: 0.35rem;
  cursor: pointer;
}

.mark-mode:hover {
  border-color: var(--patina);
  color: var(--patina-ink);
}

/* The pressed state is the armed state, so it has to be unmistakable: the
   reader's next click on the document does something different because of it. */
.mark-mode[aria-pressed="true"] {
  background: var(--patina);
  color: var(--surface);
  border-color: var(--patina);
}

.mark-mode:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: 2px;
}

/* Discoverability hint in thread tools, announcing how to aim on this artifact. */
.thread-hint {
  font-family: var(--sans);
  font-size: 0.76rem;
  color: var(--ink-secondary, #666);
  font-style: italic;
  line-height: 1.4;
}

/* Keyboard and click action in tools row when text is selected in the document. */
.mark-quote-action {
  padding: 0.35rem 0.7rem;
  color: var(--patina-ink);
  font-family: var(--sans);
  font-size: 0.78rem;
  font-weight: 600;
  background: var(--patina-wash, rgba(46, 125, 107, 0.1));
  border: 1px solid var(--patina);
  border-radius: 0.35rem;
  cursor: pointer;
}

.mark-quote-action:hover {
  background: var(--patina);
  color: var(--surface);
}

.mark-quote-action:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: 2px;
}

/* Keyboard-aimed region box on images with clear focus indication. */
.comment-region.is-keyboard {
  outline: 2px dashed var(--patina);
  background: rgba(46, 125, 107, 0.15);
}

.stage-wrap.is-pinning:focus-visible,
.stage-wrap.is-pinning img.relic-image:focus-visible,
.stage-wrap.is-pinning .doc:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: 2px;
}

/*
 * Below this width, side by side is twenty characters of relic beside twenty
 * characters of conversation, which is neither reading nor commenting. The
 * sidebar takes the row and the relic collapses rather than shrinking to an
 * unusable sliver. Its frame stays loaded, so closing brings the relic back
 * without a refetch.
 */
@media (max-width: 44rem) {
  .diff-row .thread,
  .thread.is-open {
    width: 100%;
    /* The floor above is for sharing a row. Here the sidebar owns the row, so
       carrying a minimum would only let it overflow a narrow screen. */
    min-width: 0;
    max-width: 100%;
  }
  .thread.is-open ~ .thread-resizer {
    display: none;
  }
}

.thread-note {
  margin: 0 0 0.75rem;
  color: var(--ink-soft);
  font-size: 0.86rem;
  line-height: 1.55;
}

.thread-policy {
  display: inline-block;
  margin-bottom: 1rem;
  color: var(--patina-ink);
  font-size: 0.8rem;
  text-underline-offset: 2px;
}

.thread-refusal {
  padding: 1rem 1.1rem;
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-top: 2px solid var(--oxide);
}

.thread-refusal-title {
  margin: 0 0 0.5rem;
  font-family: var(--sans);
  font-weight: 600;
}

.thread-refusal .accession {
  margin-top: 0.75rem;
}

.thread-list {
  margin: 0 0 2rem;
  padding: 0;
  list-style: none;
}

.comment {
  padding: 1rem 0;
  border-top: 1px solid var(--rule);
}

.comment-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.5rem;
  margin-bottom: 0.4rem;
}

/* The alias reads as a name. */
.comment-name {
  font-family: var(--sans);
  font-size: 0.9rem;
  font-weight: 600;
}

/* The address reads as the record, which is what it is. */
.comment-author {
  font-family: var(--mono);
  font-size: 0.74rem;
  color: var(--ink-soft);
  overflow-wrap: anywhere;
}

.comment-badge {
  padding: 0.05rem 0.4rem;
  border: 1px solid var(--patina);
  color: var(--patina-ink);
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.comment-badge-unversioned {
  border-color: var(--rule-strong);
  color: var(--ink-soft);
}

.comment-badge-addressed {
  border-color: var(--patina);
  color: var(--patina-ink);
  background: color-mix(in srgb, var(--patina) 8%, transparent);
}

.comment-time {
  margin-left: auto;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.68rem;
  white-space: nowrap;
}

.comment-replies {
  margin: 0.75rem 0 0 0.75rem;
  padding: 0 0 0 0.75rem;
  border-left: 2px solid var(--rule);
  list-style: none;
}

.comment.comment-reply {
  padding: 0.75rem 0 0;
  border-top: 1px solid var(--rule);
}

.comment.comment-reply:first-child {
  border-top: 0;
  padding-top: 0;
}

.comment-body {
  margin: 0;
  font-family: var(--serif);
  font-size: 0.94rem;
  line-height: 1.55;
  overflow-wrap: anywhere;
  overflow-x: hidden;
  max-width: 100%;
}

.comment-body p {
  margin: 0 0 0.5rem;
}

.comment-body p:last-child {
  margin-bottom: 0;
}

/* Headings inside comments must not out-shout the relic's own headings or the sidebar title. */
.comment-body h1,
.comment-body h2,
.comment-body h3,
.comment-body h4,
.comment-body h5,
.comment-body h6 {
  font-family: var(--sans);
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.3;
  margin: 0.6rem 0 0.25rem;
}

.comment-body h1:first-child,
.comment-body h2:first-child,
.comment-body h3:first-child,
.comment-body h4:first-child,
.comment-body h5:first-child,
.comment-body h6:first-child {
  margin-top: 0;
}

/* Code blocks must scroll horizontally within the sidebar and never widen it. */
.comment-body pre {
  font-family: var(--mono);
  font-size: 0.8rem;
  line-height: 1.5;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-left: 2px solid var(--rule-strong);
  padding: 0.5rem 0.6rem;
  margin: 0.5rem 0;
  max-width: 100%;
  overflow-x: auto;
  box-sizing: border-box;
}

.comment-body code {
  font-family: var(--mono);
  font-size: 0.84em;
  background: var(--surface);
  border: 1px solid var(--rule);
  padding: 0.05em 0.25em;
}

.comment-body pre code {
  background: none;
  border: 0;
  padding: 0;
  font-size: inherit;
}

/* Blockquotes inside comments. */
.comment-body blockquote {
  margin: 0.5rem 0;
  padding-left: 0.65rem;
  border-left: 2px solid var(--rule-strong);
  color: var(--ink-soft);
  font-size: 0.92rem;
}

/* Lists inside comments. */
.comment-body ul,
.comment-body ol {
  margin: 0.4rem 0 0.5rem;
  padding-left: 1.2rem;
}

.comment-body li {
  margin-bottom: 0.2rem;
}

/* Tables inside comments must not widen the sidebar; .md-scroll handles scrolling. */
.comment-body .md-scroll {
  max-width: 100%;
  overflow-x: auto;
  margin: 0.5rem 0;
  border: 1px solid var(--rule);
  box-sizing: border-box;
}

.comment-body table {
  border-collapse: collapse;
  width: 100%;
  font-family: var(--sans);
  font-size: 0.8rem;
}

.comment-body th,
.comment-body td {
  text-align: left;
  padding: 0.35rem 0.5rem;
  border-bottom: 1px solid var(--rule);
  white-space: nowrap;
}

.comment-body th {
  background: var(--surface);
  font-weight: 600;
}

.comment-body hr {
  border: 0;
  border-top: 1px solid var(--rule);
  margin: 0.6rem 0;
}

.comment-body a {
  color: var(--patina-ink);
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

/* An unopened comment is shown, not hidden, and it must not read as prose
   somebody wrote. */
.comment-sealed {
  padding-left: 0.75rem;
  border-left: 2px solid var(--oxide);
  color: var(--ink-soft);
  font-family: var(--sans);
  font-size: 0.84rem;
  font-style: italic;
}
/* ---------- the composer ---------- */

.compose {
  display: grid;
  gap: 0.75rem;
  padding: 1.25rem;
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-top: 2px solid var(--patina);
}

.compose-title {
  margin: 0;
  font-family: var(--sans);
  font-size: 0.95rem;
  font-weight: 600;
}

.compose-identity {
  margin: 0;
  font-size: 0.86rem;
}

.compose-identity strong {
  font-family: var(--mono);
  font-size: 0.8rem;
  overflow-wrap: anywhere;
}

/*
 * What the next comment is about, stated before it is written.
 *
 * Present in every state, including the state where nothing is marked. The
 * empty state is the one that had to be added: a composer that said nothing
 * about its target is a composer where a stray selection quietly aimed the
 * comment somewhere the reader never chose.
 */
.compose-target {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.5rem;
  margin: 0;
  padding: 0.45rem 0.65rem;
  background: var(--ground);
  border-left: 3px solid var(--patina);
  font-size: 0.82rem;
}

.compose-target-label {
  flex: 1 1 auto;
  min-width: 0;
  color: var(--ink);
  overflow-wrap: anywhere;
}

.compose-target-clear {
  flex: 0 0 auto;
  padding: 0.1rem 0.4rem;
  color: var(--patina-ink);
  font-family: var(--sans);
  font-size: 0.72rem;
  font-weight: 600;
  background: transparent;
  border: 1px solid var(--rule-strong);
  border-radius: 0.25rem;
  cursor: pointer;
}

.compose-target-clear:hover {
  border-color: var(--patina);
  background: var(--surface);
}

.compose-target-clear:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: 1px;
}

/* The disclosure. Not fine print: a reader learns what commenting publishes
   before they type, so it is set at reading size and above the fields. */
.compose-note {
  margin: 0;
  padding: 0.6rem 0.75rem;
  background: var(--ground);
  border-left: 2px solid var(--oxide);
  font-size: 0.84rem;
  line-height: 1.5;
}

.compose-fine {
  margin: 0;
  color: var(--ink-soft);
  font-size: 0.78rem;
  line-height: 1.5;
}

.compose-warning {
  margin: 0.5rem 0 0;
  padding: 0.6rem 0.75rem;
  background: var(--diff-removed);
  border-left: 2px solid var(--oxide);
  font-size: 0.84rem;
  line-height: 1.5;
}

.compose-field {
  display: grid;
  gap: 0.3rem;
}

.compose-field > span {
  font-family: var(--sans);
  font-size: 0.76rem;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.compose-input,
.compose-textarea {
  width: 100%;
  padding: 0.5rem 0.6rem;
  background: var(--ground);
  border: 1px solid var(--rule-strong);
  color: var(--ink);
  font: inherit;
  font-size: 0.9rem;
}

.compose-textarea {
  font-family: var(--serif);
  line-height: 1.55;
  resize: vertical;
}

.compose-input:focus-visible,
.compose-textarea:focus-visible {
  outline: 2px solid var(--patina);
  outline-offset: 1px;
}

.compose-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}

.compose-count {
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.7rem;
}

.compose-count.over {
  color: var(--oxide);
  font-weight: 700;
}

/* The composer is a grid, so a button in it stretches to the column unless
   told otherwise, and a full-bleed primary in a 46rem card reads as a phone
   layout that wandered onto a desktop. */
.compose .action.primary {
  justify-self: start;
  align-self: center;
}

.thread-outcome {
  margin-top: 0.75rem;
}

.thread-outcome .thread-note {
  margin: 0;
}

@media (max-width: 34rem) {
  .thread {
    padding: 2rem 0.9rem 4rem;
  }
  .compose {
    padding: 1rem;
  }
  /* Two identifiers and a timestamp do not share a line at this width, and a
     timestamp pushed to the right edge of a 320px row reads as a column that
     is not there. */
  .comment-time {
    margin-left: 0;
  }
}

/* ---------- the share panel ---------- */

/* A sheet that drops from the band, under the action that opened it. It is a
   modal dialog rather than a third sidebar: sharing is a short errand with an
   end, the reading row already has a conversation beside it, and a dialog
   gives the keyboard its trap and Escape for nothing. Square, hairline, the
   patina rule on top like the composer, and the version list's shadow, so it
   reads as the same family of chrome as everything else that drops from the
   band. */
.share-panel {
  position: fixed;
  inset: var(--share-top, var(--bar-height)) 0 auto auto;
  width: min(28rem, 100vw);
  max-width: 100vw;
