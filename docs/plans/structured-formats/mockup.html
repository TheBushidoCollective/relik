<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Relik · tables, trees, subtitles, notebooks and documents · mock</title>
<!--
  A local, clickable mock for docs/plans/structured-formats/plan.md, section 7, plus the
  cell-commenting set (CC1 to CC7) asked for on 2026-11-19. It is not the viewer.

  The band, the mode strip, the comments sidebar, the popover card, the comment row,
  the notice, the download card and the loading plate are the viewer's own, copied from
  docs/plans/suggested-edits/mockup.html (which copies packages/relic-viewer/src/styles.css).
  Everything new extends that vocabulary and is marked as new in the stylesheet.

  Art direction, derived from the subject rather than chosen: the table is a ledger, so it
  borrows the two conventions a field supervisor already reads (A1 addresses and a cell bar
  above the grid, sheet tabs below it). Comments live in the corner of the thing commented
  on, the way a spreadsheet note does, in Relic's patina rather than a spreadsheet's red, and
  the same corner mark is used on a tree node, a cue and a notebook cell so the family reads
  as one system. Rejected: a gutter of comment pins beside the rows (it loses the column),
  tinting whole commented cells (it fights the find highlight and the selection), a
  floating comment rail per row (a second sidebar), colour per author on marks (colour
  belongs to live carets only, per the suggested-edits plan).

  Untrusted text: every cell, key, cue and output in the fixtures is inserted with
  createTextNode. The hostile fixtures (<img src=x onerror=alert(1)>, =HYPERLINK(...), a
  U+202E bidi override) render as literal text; the bidi override is drawn as a visible escape.

  Fixtures are fictional: Larkspur field crews, a Postgres work-order export, a demo video's
  subtitles, a data-science notebook, a spec document and a field handbook.

  Mock chrome (the state bar, the state list, mock notes) is drawn with dashed rules so it
  never passes for the product.
-->
<style>
:root {
  color-scheme: light;
  --ground: #f1f2f0; --surface: #fbfbfa; --ink: #16191a; --ink-soft: #5a6163;
  --rule: #d2d5d2; --rule-strong: #b3b8b4; --patina: #1f6b64; --patina-ink: #0f3b37;
  --oxide: #8c4a2f; --diff-added: #dfeeea; --diff-added-strong: #a7d6ca;
  --diff-removed: #f3e5df; --diff-removed-strong: #ddb6a6;
  --peer-1: #7b4a8c; --peer-2: #8a6514; --peer-3: #33598a; --peer-4: #8c4a2f;
  --serif: Charter, "Iowan Old Style", "Source Serif Pro", Palatino, "Palatino Linotype", Georgia, serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bar-height: 3.25rem;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #101314; --surface: #171b1c; --ink: #e6e9e7; --ink-soft: #969e9d;
  --rule: #2a3032; --rule-strong: #3b4345; --patina: #4fb3a6; --patina-ink: #a7ded6;
  --oxide: #c98058; --diff-added: #15332f; --diff-added-strong: #24564e;
  --diff-removed: #34231d; --diff-removed-strong: #684331;
  --peer-1: #c8a0dc; --peer-2: #dbb45e; --peer-3: #93b4e0; --peer-4: #d58f68;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  background: var(--ground); color: var(--ink);
  font: 16px/1.55 var(--sans); -webkit-text-size-adjust: 100%;
}
.icon { width: 14px; height: 14px; flex: none; }
button { font: inherit; }

/* ---------- mock chrome: not the viewer, drawn with dashed rules ---------- */
.mk-bar { flex: none; position: relative; z-index: 60; display: flex; align-items: center; gap: .35rem; height: 36px; padding: 0 .5rem; min-width: 0; background: var(--surface); border-bottom: 1px dashed var(--rule-strong); font: 11px/1.3 var(--mono); }
.mk-tag { flex: none; padding: .1rem .35rem; border: 1px dashed var(--rule-strong); color: var(--ink-soft); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.mk-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: .3rem; height: 24px; min-width: 24px; padding: 0 .5rem; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink); font: 11px var(--mono); cursor: pointer; white-space: nowrap; }
.mk-btn:hover { border-color: var(--patina); color: var(--patina-ink); }
.mk-btn:focus-visible { outline: 2px solid var(--patina); outline-offset: 1px; }
.mk-btn[aria-pressed="true"], .mk-btn[aria-current="true"] { border-color: var(--patina); background: var(--diff-added); color: var(--patina-ink); }
.mk-btn .icon { width: 12px; height: 12px; }
.mk-title { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 12px/1.3 var(--sans); padding: 0 .2rem; }
.mk-title b { margin-right: .45rem; font: 600 11px var(--mono); color: var(--patina-ink); }
@media (max-width: 719px) { .mk-wide { display: none !important; } }
.mk-drawer { position: absolute; top: 36px; left: 0; right: 0; z-index: 70; max-height: calc(100dvh - 36px); overflow-y: auto; padding: .7rem .75rem 1.2rem; background: var(--surface); border-bottom: 1px dashed var(--rule-strong); box-shadow: 0 12px 24px rgb(0 0 0 / 18%); font: 12px/1.45 var(--sans); }
.mk-drawer p { margin: 0 0 .6rem; max-width: 60rem; color: var(--ink-soft); }
.mk-drawer h3 { margin: .9rem 0 .35rem; color: var(--ink-soft); font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.mk-drawer ol { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); gap: .25rem; margin: 0; padding: 0; list-style: none; }
.mk-state { display: flex; gap: .5rem; width: 100%; padding: .35rem .5rem; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font: 12px/1.35 var(--sans); text-align: left; cursor: pointer; }
.mk-state b { flex: none; min-width: 3.4rem; font: 600 11px/1.5 var(--mono); color: var(--patina-ink); }
.mk-state:hover { border-color: var(--patina); }
.mk-state[aria-current="true"] { border-color: var(--patina); background: var(--diff-added); }
.mk-controls { display: flex; flex-wrap: wrap; gap: .3rem .6rem; align-items: center; padding: .4rem 0 .2rem; border-top: 1px dashed var(--rule); }
.mk-controls span { color: var(--ink-soft); font: 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.mk-floor { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; align-items: flex-start; overflow: hidden; }
.mk-device { container: viewer / inline-size; position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--ground); }
.mk-device[data-frame="390"] { width: min(390px, 100%); height: min(844px, 100%); box-shadow: 0 0 0 1px var(--rule-strong); }
.mk-device[data-frame="320"] { width: min(320px, 100%); height: min(480px, 100%); box-shadow: 0 0 0 1px var(--rule-strong); }
.mk-keyboard { flex: none; position: relative; height: 336px; border-top: 1px dashed var(--rule-strong); background: repeating-linear-gradient(90deg, transparent 0 4px, var(--rule) 4px 5px, transparent 5px 36px), var(--ground); background-size: 36px 52px; }
.mk-keyboard::before { content: ""; position: absolute; inset: 52px 0 0; background: repeating-linear-gradient(180deg, transparent 0 46px, var(--ground) 46px 52px); }
.mk-keyboard-label { position: absolute; z-index: 1; top: 14px; left: 50%; transform: translateX(-50%); padding: .1rem .45rem; border: 1px dashed var(--rule-strong); background: var(--surface); color: var(--ink-soft); font: 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.mk-note { margin: .5rem 0 0; padding: .35rem .5rem; border: 1px dashed var(--rule-strong); color: var(--ink-soft); font: .72rem/1.4 var(--mono); }

/* ---------- the viewer, from packages/relic-viewer/src/styles.css ---------- */
.viewer { position: relative; display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; background: var(--ground); color: var(--ink); }
.bar { position: relative; z-index: 10; display: flex; align-items: stretch; flex: none; min-height: var(--bar-height); background: var(--surface); border-bottom: 1px solid var(--rule-strong); }
.mark { display: flex; align-items: center; padding: 0 1rem; font: 600 .78rem var(--mono); letter-spacing: .01em; color: var(--ink); border-right: 1px solid var(--rule); white-space: nowrap; }
.identity { display: flex; flex-direction: column; justify-content: center; gap: .1rem; padding: .4rem 1rem; min-width: 0; flex: 1; }
.filename { flex: 0 0 auto; font-size: .9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.identity-meta { display: flex; align-items: center; gap: .6rem; min-width: 0; }
.accession { min-width: 0; flex: 0 1 auto; font: .66rem var(--mono); letter-spacing: .14em; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.version-label { flex: none; display: inline-flex; align-items: center; padding: .05rem .35rem; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink-soft); font: .66rem var(--mono); letter-spacing: .06em; white-space: nowrap; }
.actions { display: flex; align-items: stretch; border-left: 1px solid var(--rule); }
.action { position: relative; display: inline-flex; align-items: center; gap: .45rem; padding: 0 .9rem; border: 0; border-right: 1px solid var(--rule); background: transparent; color: var(--ink); font-size: .82rem; text-decoration: none; cursor: pointer; white-space: nowrap; }
.actions .action:last-child { border-right: 0; }
.action:hover { background: var(--ground); color: var(--patina-ink); }
.action:focus-visible { outline: 2px solid var(--patina); outline-offset: -2px; }
.action[aria-pressed="true"] { color: var(--patina-ink); background: var(--diff-added); }
.action.marker { cursor: default; color: var(--ink-soft); }
.action-count { min-width: 1.1rem; padding: 0 .25rem; border: 1px solid var(--rule-strong); color: var(--ink-soft); font: .68rem/1.4 var(--mono); text-align: center; }
@container viewer (max-width: 34rem) {
  .action span:not(.action-count) { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .action { padding: 0 .75rem; }
  .mark { display: none; }
  .identity { padding: .4rem .7rem; }
  .identity-meta { gap: .4rem; }
}
@container viewer (max-width: 24rem) { .action-share, .action.marker { display: none; } }

/* The mode strip: one segmented control (the Suggesting toggle, in Relic's chrome per
   plan 4.2), the applied switch, the presence chip. */
.sg-strip { flex: none; position: relative; z-index: 9; display: flex; flex-wrap: wrap; align-items: center; gap: .45rem 1rem; min-height: 2.6rem; padding: .35rem 1rem; background: var(--surface); border-bottom: 1px solid var(--rule); font-size: .8rem; }
.sg-seg { display: inline-flex; flex: none; border: 1px solid var(--rule-strong); }
.sg-seg button { display: inline-flex; align-items: center; gap: .35rem; padding: .26rem .75rem; border: 0; background: transparent; color: var(--ink); font: 600 .78rem/1.3 var(--sans); cursor: pointer; white-space: nowrap; }
.sg-seg button + button { border-left: 1px solid var(--rule-strong); }
.sg-seg button:hover { color: var(--patina-ink); background: var(--ground); }
.sg-seg button[aria-pressed="true"] { background: var(--patina); color: var(--surface); }
.sg-seg button:disabled { color: var(--ink-soft); cursor: default; background: transparent; }
.sg-seg button:focus-visible { outline: 2px solid var(--patina); outline-offset: 1px; position: relative; z-index: 1; }
.sg-switch { display: inline-flex; flex: none; align-items: center; gap: .5rem; padding: .2rem .1rem; border: 0; background: transparent; color: var(--ink); font: .8rem/1.3 var(--sans); cursor: pointer; text-align: left; }
.sg-switch:focus-visible { outline: 2px solid var(--patina); outline-offset: 2px; }
.sg-switch-box { position: relative; flex: none; width: 1.9rem; height: 1rem; border: 1px solid var(--rule-strong); background: var(--ground); }
.sg-switch-box::after { content: ""; position: absolute; top: 2px; left: 2px; width: calc(.5rem + 2px); height: calc(1rem - 6px); background: var(--ink-soft); }
.sg-switch[aria-checked="true"] .sg-switch-box { border-color: var(--patina); background: var(--diff-added); }
.sg-switch[aria-checked="true"] .sg-switch-box::after { left: auto; right: 2px; background: var(--patina); }
.sg-presence { display: inline-flex; flex: none; align-items: center; gap: .35rem; padding: .1rem .45rem .1rem .2rem; border: 1px solid var(--rule); color: var(--ink-soft); font: .7rem/1.3 var(--mono); white-space: nowrap; }
.sg-presence.is-off { padding-left: .45rem; border-color: var(--oxide); color: var(--oxide); }
.sg-presence.is-off .icon { width: 12px; height: 12px; }
.peer-dot { display: inline-grid; place-items: center; width: 1.05rem; height: 1.05rem; background: var(--c); color: var(--surface); font: 600 .62rem/1 var(--mono); }
.sg-strip-meta { margin-left: auto; min-width: 0; color: var(--ink-soft); font: .7rem/1.4 var(--mono); letter-spacing: .02em; }
.sg-strip-meta.is-note { color: var(--patina-ink); }
@container viewer (max-width: 34rem) {
  .sg-strip { padding: .35rem .6rem; gap: .4rem .6rem; }
  .sg-strip-meta:not(.is-note) { display: none; }
  .sg-strip-meta.is-note { margin-left: 0; flex-basis: 100%; }
  .sg-seg button { padding: .26rem .55rem; }
}

.viewer-main { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
.relic-row { position: relative; display: flex; flex: 1 1 auto; min-height: 0; min-width: 0; }
.stage-wrap { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; overflow: auto; }
.stage { position: relative; padding: 2rem 1.25rem 7rem; }
@container viewer (max-width: 34rem) { .stage { padding: 1.25rem .9rem 8rem; } }
.notice { display: flex; gap: .6rem; align-items: flex-start; max-width: 46rem; margin: 0 auto 1.5rem; padding: .7rem .9rem; border-left: 3px solid var(--oxide); background: var(--surface); color: var(--ink); font-size: .86rem; }
.notice.is-info { border-left-color: var(--patina); }
.notice p { margin: 0; }
.notice .icon { margin-top: .2rem; color: var(--oxide); }
.notice.is-info .icon { color: var(--patina); }

.doc { position: relative; max-width: 46rem; margin: 0 auto; }
.prose { font-family: var(--serif); font-size: 1.06rem; line-height: 1.7; }
.prose h1, .prose h2, .prose h3 { font-family: var(--sans); line-height: 1.25; margin: 2rem 0 .6rem; letter-spacing: -.01em; }
.prose h1 { font-size: 1.7rem; padding-bottom: .4rem; border-bottom: 1px solid var(--rule); margin-top: 0; }
.prose h2 { font-size: 1.32rem; }
.prose p { margin: 0 0 1.1rem; }
.prose ul { margin: 0 0 1.1rem; padding-left: 1.4rem; }
.prose li { margin: .3rem 0; }
.prose a { color: var(--patina-ink); text-decoration-thickness: 1px; text-underline-offset: 2px; }
.prose a:not([href]) { cursor: help; }
.prose blockquote { margin: 1.2rem 0; padding-left: 1rem; border-left: 2px solid var(--rule-strong); color: var(--ink-soft); }
.md-scroll { overflow-x: auto; margin: 1.2rem 0; border: 1px solid var(--rule); }
.prose table { border-collapse: collapse; width: 100%; font-family: var(--sans); font-size: .88rem; }
.prose th, .prose td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.prose th { background: var(--surface); font-weight: 600; }
[data-root] { outline: none; }
.is-suggesting [data-root][contenteditable="true"] { cursor: text; caret-color: var(--patina); }
[data-block].is-drafting { outline: 1px dashed color-mix(in srgb, var(--patina) 70%, transparent); outline-offset: 5px; }
[data-block].is-mirror { outline: 1px dotted var(--rule-strong); outline-offset: 4px; }

/* Tracked changes. Pending is a quiet tint plus rule; the struck text keeps its colour so
   it stays readable. Yours is dashed. A draft is a stronger tint, because it is the thing
   you are working on. */
.sg-chg { cursor: pointer; }
.sg-chg:focus-visible { outline: 2px solid var(--patina); outline-offset: 2px; }
.sg-del { background: var(--diff-removed); color: inherit; text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--oxide); }
.sg-ins { background: var(--diff-added); color: inherit; text-decoration: none; border-bottom: 2px solid var(--patina); }
.sg-del + .sg-ins { margin-left: .18em; }
.sg-chg:hover .sg-del, .sg-chg.is-active .sg-del { background: var(--diff-removed-strong); }
.sg-chg:hover .sg-ins, .sg-chg.is-active .sg-ins { background: var(--diff-added-strong); }
.sg-chg.is-mine .sg-ins { border-bottom-style: dashed; }
.sg-chg.is-mine .sg-del { text-decoration-style: dashed; }
.sg-chg.is-new .sg-ins, .sg-chg.is-new .sg-del { animation: sg-arrive 2.4s ease-out; }
@keyframes sg-arrive { 0%, 30% { outline: 2px solid var(--patina); outline-offset: 2px; } 100% { outline: 2px solid transparent; outline-offset: 2px; } }
.sg-del.is-draft { background: color-mix(in srgb, var(--oxide) 18%, transparent); }
.sg-ins.is-draft { background: color-mix(in srgb, var(--patina) 18%, transparent); border-bottom: 2px solid var(--patina); white-space: pre-wrap; }
.sg-chip { display: inline-block; margin-left: .15rem; padding: .1rem .25rem; border: 1px solid var(--patina); background: var(--surface); color: var(--patina-ink); font: 600 .6rem/1 var(--mono); letter-spacing: .02em; vertical-align: .45em; user-select: none; cursor: pointer; }
.sg-chip.is-soft { border-color: var(--rule-strong); color: var(--ink-soft); }
.sg-chip.is-fold { border-color: var(--oxide); color: var(--oxide); }
.sg-applied { background: color-mix(in srgb, var(--patina) 7%, transparent); border-bottom: 1px dotted var(--patina); }
.sg-applied-gap { display: inline-block; width: 2px; height: .9em; margin: 0 .1em; vertical-align: -.1em; background: var(--patina); opacity: .55; }
.relic-text-mark { background: color-mix(in srgb, var(--patina) 22%, transparent); border-bottom: 2px solid var(--patina); color: inherit; cursor: pointer; }
/* Older-version pages: the outcome is drawn on the change, read-only (O1). Settled
   changes that did not ship fade; the outcome chip names the state. */
.sg-chg.is-out-quiet .sg-ins, .sg-chg.is-out-quiet .sg-del { background: none; border-bottom-color: var(--rule-strong); color: var(--ink-soft); }
.sg-chg.is-out-quiet .sg-del { text-decoration-color: var(--ink-soft); }
.sg-chg.is-out-ok .sg-ins { background: var(--diff-added-strong); }
.sg-chip.is-out { border-color: var(--rule-strong); color: var(--ink-soft); text-transform: none; }
.sg-chip.is-out.is-ok { border-color: var(--patina); color: var(--patina-ink); background: var(--diff-added); }
.sg-chip.is-unposted { border-color: var(--oxide); color: var(--oxide); }
.mk-pin { position: absolute; z-index: 7; max-width: 19rem; margin: 0; pointer-events: none; background: var(--surface); }

/* The draft hint, hung under the block it belongs to. */
.sg-hint { position: absolute; z-index: 6; display: flex; flex-wrap: wrap; gap: .1rem 0; padding: .22rem .55rem; background: var(--patina); color: var(--surface); font: .7rem/1.45 var(--mono); }
.sg-hint > span + span::before { content: "·"; margin: 0 .45rem; opacity: .8; }
.sg-hint b { font-weight: 700; }
.sg-hint .is-near { padding: 0 .3rem; background: var(--surface); color: var(--oxide); font-weight: 700; }
.sg-hint .is-warn, .sg-hint .is-fold { font-weight: 700; }
.sg-hint.is-flash { background: var(--ink-soft); }

/* Peers. Colour belongs to a live caret only. */
.presence-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.peer-caret { position: absolute; width: 2px; background: var(--c); transition: left .25s, top .25s; }
.peer-flag { position: absolute; left: 0; bottom: 100%; padding: .02rem .3rem; background: var(--c); color: var(--surface); font: 600 .6rem/1.35 var(--mono); white-space: nowrap; }
.peer-typing { position: absolute; border: 1px dashed var(--c); background: color-mix(in srgb, var(--c) 9%, transparent); }
.peer-typing-tag { position: absolute; padding: .02rem .35rem; background: var(--c); color: var(--surface); font: 600 .62rem/1.35 var(--mono); white-space: nowrap; }

/* The code relic. */
.code-doc { display: grid; grid-template-columns: auto minmax(0, 1fr); max-width: 62rem; margin: 0 auto; background: var(--surface); border: 1px solid var(--rule); font: .82rem/1.6 var(--mono); }
.code-gutter { padding: .75rem 0; background: var(--ground); border-right: 1px solid var(--rule); color: var(--ink-soft); text-align: right; user-select: none; }
.code-gutter span { display: block; padding: 0 .75rem; }
.code-gutter span.is-added { color: var(--patina-ink); font-weight: 700; }
.code-body { margin: 0; padding: .75rem 1rem; overflow-x: auto; white-space: pre; tab-size: 2; font: inherit; }
.code-body .sg-ins.is-draft { white-space: pre; }
.code-body [data-block].is-drafting { outline: none; }
.tok-kw { color: var(--patina-ink); font-weight: 600; }
.tok-str, .tok-num { color: var(--oxide); }
.tok-com { color: var(--ink-soft); font-style: italic; }


/* Popovers: the viewer's one panel object, used as the selection offer, the attached card,
   the refusal and the sign-in. */
.popover { position: absolute; z-index: 8; background: var(--surface); color: var(--ink); border: 1px solid var(--rule-strong); box-shadow: 0 6px 18px rgb(0 0 0 / 14%); font: 16px/1.55 var(--sans); text-align: left; }
.popover-offer { display: flex; flex-wrap: wrap; align-items: stretch; }
@container viewer (max-width: 24rem) { .popover-offer .icon { display: none; } .popover-offer .popover-action { padding: .45rem .6rem; } }
.popover-action { display: inline-flex; align-items: center; gap: .35rem; padding: .4rem .7rem; border: 0; background: none; color: var(--ink); font-size: .82rem; white-space: nowrap; cursor: pointer; }
.popover-offer .popover-action + .popover-action { border-left: 1px solid var(--rule); }
.popover-action:hover { background: color-mix(in srgb, var(--patina) 12%, transparent); }
.popover-action:focus-visible { outline: 2px solid var(--patina); outline-offset: -2px; }
.popover-reason { margin: 0; padding: .35rem .7rem .45rem; border-top: 1px solid var(--rule); color: var(--ink-soft); font-size: .74rem; line-height: 1.4; }
.popover-offer-wrap { width: max-content; max-width: min(22rem, calc(100cqw - 1rem)); }
.popover-card { width: min(23rem, calc(100cqw - 1rem)); padding: .6rem .75rem .65rem; overflow-y: auto; }
.popover-tools { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin-top: .55rem; padding-top: .45rem; border-top: 1px solid var(--rule); }

.popover-tools .popover-action.is-primary { background: var(--patina); border-color: var(--patina); color: var(--surface); }

.popover-field:focus-visible { outline: 2px solid var(--patina); outline-offset: 1px; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .5rem; margin-bottom: .45rem; }
.card-who { font-size: .9rem; font-weight: 600; }
.card-verified { display: inline-flex; align-items: center; gap: .25rem; min-width: 0; color: var(--ink-soft); font: .7rem var(--mono); overflow-wrap: anywhere; }
.card-verified .icon { width: 12px; height: 12px; color: var(--patina); }
.card-time { margin-left: auto; color: var(--ink-soft); font: .68rem var(--mono); white-space: nowrap; }
.card-yours { padding: .02rem .35rem; border: 1px dashed var(--patina); color: var(--patina-ink); font: 600 .6rem var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.card-diff { margin: 0 0 .4rem; font: .95rem/1.55 var(--serif); overflow-wrap: anywhere; }
.card-row { display: flex; gap: .5rem; margin: .2rem 0; font-size: .78rem; line-height: 1.45; }
.card-row .k { flex: none; width: 3.6rem; color: var(--ink-soft); font: .66rem/1.9 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.card-row code { font: .74rem var(--mono); overflow-wrap: anywhere; }
.card-row .v { min-width: 0; overflow-wrap: anywhere; }
.card-replies { margin: .5rem 0 0; padding: 0 0 0 .65rem; border-left: 2px solid var(--rule); list-style: none; }
.card-replies li + li { margin-top: .45rem; }
.card-reply-head { display: flex; gap: .4rem; align-items: baseline; font-size: .76rem; }

.card-reply-body { margin: .05rem 0 0; font: .88rem/1.45 var(--serif); overflow-wrap: anywhere; }
.card-members { margin: .35rem 0 0; padding: 0; list-style: none; }
.card-member { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .1rem .5rem; align-items: baseline; padding: .4rem 0 .45rem; border-top: 1px solid var(--rule); }
.card-member-who { font-size: .8rem; font-weight: 600; }

.card-member .popover-action { grid-row: 1; grid-column: 2; padding: .1rem .45rem; border: 1px solid var(--rule-strong); background: none; color: var(--ink); font-size: .74rem; cursor: pointer; }
.card-diff del, .card-diff ins, .card-member-text ins { white-space: pre-wrap; }
.card-status { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: .3rem .45rem; }
.card-note { margin: .45rem 0 0; color: var(--ink-soft); font-size: .74rem; line-height: 1.4; }
.sg-refusal { width: max-content; max-width: min(21rem, calc(100cqw - 1rem)); padding: .5rem .7rem .55rem; border-left: 3px solid var(--oxide); }
.sg-refusal p { margin: 0; font-size: .84rem; line-height: 1.45; }
.sg-refusal-code { display: block; margin-top: .3rem; color: var(--oxide); font: .66rem var(--mono); letter-spacing: .04em; }
.sg-refusal .popover-tools { margin-top: .4rem; padding-top: .4rem; }
.chrome-pop { z-index: 40; width: min(20rem, calc(100cqw - 1rem)); padding: .7rem .8rem .75rem; }
.pop-title { margin: 0 0 .3rem; font-size: .9rem; font-weight: 600; }
.pop-text { margin: 0 0 .5rem; color: var(--ink-soft); font-size: .8rem; line-height: 1.45; }

/* The receipt: Relic's own chrome, outside the document. A failed post stays in it as
   "Not posted" (plan 3.6). */
.sg-dock { position: absolute; z-index: 30; background: var(--surface); border: 1px solid var(--rule-strong); box-shadow: 0 8px 24px rgb(0 0 0 / 16%); font-size: .82rem; line-height: 1.45; }
.sg-receipt { right: 1rem; bottom: 1rem; width: min(25rem, calc(100% - 2rem)); padding: .6rem .8rem .65rem; border-top: 3px solid var(--patina); }
.sg-receipt.is-failed { border-top-color: var(--oxide); }
.sg-receipt.is-failed .rc-head .icon { color: var(--oxide); }
@container viewer (max-width: 44rem) {
  .sg-receipt { left: .5rem; right: .5rem; width: auto; bottom: .5rem; }
}
.rc-head { display: flex; align-items: center; gap: .45rem; }
.rc-head .icon { color: var(--patina); }
.rc-head strong { font-size: .88rem; }
.rc-time { color: var(--ink-soft); font: .66rem var(--mono); }
.rc-close { margin-left: auto; display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; padding: 0; border: 1px solid transparent; background: none; color: var(--ink-soft); cursor: pointer; }
.rc-close:hover { border-color: var(--rule-strong); color: var(--ink); }
.rc-body { margin-top: .35rem; }
.rc-body .card-row { font: .9rem/1.45 var(--serif); }
.rc-sub { margin: .3rem 0 0; color: var(--ink-soft); font-size: .76rem; }
.rc-warn { display: flex; gap: .4rem; margin: .35rem 0 0; color: var(--oxide); font-size: .78rem; }
.rc-warn .icon { margin-top: .15rem; }
.rc-notice { margin: .45rem 0 .1rem; padding: .45rem .55rem; border-left: 3px solid var(--oxide); background: var(--ground); font-size: .78rem; line-height: 1.45; }
.rc-notice p { margin: 0 0 .35rem; }
.rc-notice .popover-action { padding: .15rem .5rem; border: 1px solid var(--rule-strong); font-size: .76rem; }

/* The comments sidebar. */
.thread { flex: 0 0 auto; width: 22rem; max-width: 100%; margin: 0; padding: 0 1.25rem 1.5rem; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--rule-strong); }
@container viewer (max-width: 46rem) { .thread { position: absolute; inset: 0 0 0 auto; z-index: 20; width: min(22rem, 100%); box-shadow: -8px 0 24px rgb(0 0 0 / 14%); } }
.thread-title { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; margin: 0 -1.25rem 1rem; padding: .7rem 1.25rem; background: var(--surface); border-bottom: 1px solid var(--rule); font-weight: 600; }
.thread-close { display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; padding: 0; border: 1px solid var(--rule); background: none; color: var(--ink-soft); cursor: pointer; }
.thread-list { margin: 0 0 2rem; padding: 0; list-style: none; }
.comment { padding: 1rem 0; border-top: 1px solid var(--rule); cursor: pointer; }
.comment:hover { background: color-mix(in srgb, var(--patina) 5%, transparent); }
.comment-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .5rem; margin-bottom: .4rem; }
.comment-name { font-size: .9rem; font-weight: 600; }
.comment-author { color: var(--ink-soft); font: .74rem var(--mono); overflow-wrap: anywhere; }
.comment-badge { padding: .05rem .4rem; border: 1px solid var(--patina); color: var(--patina-ink); font: .62rem var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.comment-badge.is-soft { border-color: var(--rule-strong); color: var(--ink-soft); }
.comment-badge.is-warn { border-color: var(--oxide); color: var(--oxide); }
.comment-badge.is-ok { background: color-mix(in srgb, var(--patina) 10%, transparent); }
.comment-time { margin-left: auto; color: var(--ink-soft); font: .68rem var(--mono); white-space: nowrap; }
.comment-body { margin: 0; font: .94rem/1.55 var(--serif); overflow-wrap: anywhere; }
.comment-quote { margin: 0 0 .35rem; color: var(--ink-soft); font: .72rem var(--mono); overflow-wrap: anywhere; }
.comment-sub { margin: .35rem 0 0; color: var(--ink-soft); font-size: .78rem; }
.comment-replies { margin: .6rem 0 0 .5rem; padding: 0 0 0 .7rem; border-left: 2px solid var(--rule); list-style: none; }
.comment-replies .comment-body { font-size: .88rem; }
.comment-replies li + li { margin-top: .5rem; }

/* ====================================================================================
   New for this plan. Everything below extends the viewer vocabulary above; nothing
   above is restyled. Real-viewer pieces copied from packages/relic-viewer/src/styles.css
   first (toggle-row, card, load-card, comment-region, mark states), then the views.
   ==================================================================================== */
.toggle-row { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: .5rem; }
.toggle-row .action { border: 1px solid var(--rule); padding: .35rem .7rem; font-size: .8rem; }
.notice .icon { color: var(--oxide); }
.card { max-width: 34rem; margin: 3rem auto; padding: 1.75rem; background: var(--surface); border: 1px solid var(--rule); border-top: 3px solid var(--rule-strong); }
.card.is-dead { border-top-color: var(--oxide); }
.card.is-loading { border-top-color: var(--patina); }
.card-title { font: 600 1.15rem/1.35 var(--sans); margin: 0 0 .35rem; word-break: break-word; }
.card-meta { font: .76rem var(--mono); color: var(--ink-soft); margin-bottom: 1.25rem; word-break: break-word; }
.card-note { margin: 1.25rem 0 0; font-size: .86rem; color: var(--ink-soft); }
.card-body { margin: 0; font-size: .92rem; line-height: 1.5; }
.card-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.25rem; }
.card-actions .action { padding: .55rem 1rem; border: 1px solid var(--rule-strong); }
.card-actions .action.primary { border-color: var(--patina); }
.load-card { --load-line: 1.25rem; display: grid; grid-template-columns: minmax(0, 1fr); }
.load-card > * { margin: 0; }
.load-phase { font: 600 1.15rem var(--sans); }
.load-meter { position: relative; height: .375rem; margin: 1rem 0 .85rem; overflow: hidden; background: var(--ground); border: 1px solid var(--rule-strong); }
.load-meter::before { content: ''; position: absolute; inset: 0; background: var(--patina); transform: scaleX(var(--load-fraction, 0)); transform-origin: left center; }
.load-line { min-width: 0; overflow: hidden; font: .78rem/var(--load-line) var(--mono); letter-spacing: .02em; white-space: nowrap; text-overflow: ellipsis; }
.load-card > .card-note { margin-top: 1rem; padding-top: .85rem; border-top: 1px solid var(--rule); }
.relic-text-mark { cursor: pointer; }
.relic-text-mark.is-active { background: color-mix(in srgb, var(--patina) 42%, transparent); outline: 2px solid var(--patina); }
.relic-text-mark.is-pending { background: color-mix(in srgb, var(--patina) 30%, transparent); border-bottom: 2px dashed var(--patina); outline: 2px dashed var(--patina); }
.comment-region { position: absolute; box-sizing: border-box; border: 2px solid var(--patina); box-shadow: 0 0 0 1px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.9); background: color-mix(in srgb, var(--patina) 14%, transparent); cursor: pointer; z-index: 2; }
.comment-region.is-active { background: color-mix(in srgb, var(--patina) 28%, transparent); outline: 2px solid var(--patina); outline-offset: 2px; }
.comment-region-badge { position: absolute; top: 4px; left: 4px; display: inline-flex; align-items: center; justify-content: center; min-width: 1.35rem; height: 1.35rem; padding: 0 .25rem; border: 2px solid #fff; border-radius: 999px; background: var(--patina); color: var(--surface); font: 600 .7rem var(--sans); }
.comment.is-active { background: color-mix(in srgb, var(--patina) 10%, transparent); }
.comment.is-resolved { opacity: .62; }
.comment-badge.is-resolved { border-color: var(--patina); color: var(--patina); }
.popover-card { width: min(23rem, calc(100cqw - 1rem)); }
.popover-target { margin: 0 0 .4rem; color: var(--ink-soft); font-size: .78rem; }
.popover-thread { margin: 0 -.75rem; padding: 0; list-style: none; }
.popover-thread .comment { padding: .55rem .75rem; border-top: 0; cursor: default; }
.popover-thread .comment + .comment { border-top: 1px solid var(--rule); }
.popover-note { margin: .4rem 0 0; color: var(--oxide); font-size: .76rem; }
.popover-disclosure { margin: .4rem 0 0; color: var(--ink-soft); font-size: .72rem; }
.popover-reason { flex-basis: 100%; }

/* ---------- One comment vocabulary across cells, nodes, cues and notebook cells ----------
   The corner of the thing commented on carries the mark. One remark: a patina corner.
   Several: a square count in the same corner. Settled: the corner goes grey. Nothing
   commented: nothing drawn. The quiet affordance (.cm-add) only appears on hover, on
   keyboard focus and on the selected item, at the item's trailing edge. */
.cm { position: absolute; top: 0; right: 0; z-index: 1; width: 0; height: 0; border-style: solid; border-width: 0 10px 10px 0; border-color: transparent var(--patina) transparent transparent; pointer-events: none; }
.cm.is-resolved { border-right-color: var(--rule-strong); }
.cm-n { position: absolute; top: 0; right: 0; z-index: 1; min-width: 1rem; height: 1rem; padding: 0 .22rem; background: var(--patina); color: var(--surface); font: 600 .6rem/1rem var(--mono); text-align: center; pointer-events: none; }
.cm-add { position: absolute; top: 50%; right: .2rem; z-index: 2; display: inline-grid; place-items: center; width: 1.25rem; height: 1.25rem; padding: 0; transform: translateY(-50%); border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink-soft); cursor: pointer; }
.cm-add .icon { width: 11px; height: 11px; }
.cm-add:hover, .cm-add:focus-visible { border-color: var(--patina); color: var(--patina-ink); outline: none; }
.cm-tip { position: absolute; z-index: 9; padding: .15rem .45rem; background: var(--ink); color: var(--surface); font: .7rem/1.4 var(--sans); white-space: nowrap; pointer-events: none; }

/* Comment rows: the shared sidebar row plus the address and the value as written. */
.comment-anchor { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .45rem; margin: 0 0 .35rem; font: .72rem/1.45 var(--mono); color: var(--ink-soft); }
.comment-addr { padding: 0 .3rem; border: 1px solid var(--rule-strong); color: var(--patina-ink); font-weight: 600; white-space: nowrap; }
.comment-colname { color: var(--ink-soft); }
.comment-was { margin: 0 0 .35rem; padding: .3rem .45rem; border-left: 2px solid var(--rule-strong); background: var(--ground); font: .78rem/1.45 var(--mono); color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.comment-was b { display: block; font: 600 .6rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.comment-changed { display: flex; gap: .4rem; align-items: flex-start; margin: 0 0 .4rem; padding: .35rem .5rem; border-left: 3px solid var(--oxide); background: var(--ground); font-size: .76rem; line-height: 1.4; color: var(--ink); }
.comment-changed .icon { color: var(--oxide); margin-top: .15rem; }
.comment-changed code { font: .74rem var(--mono); }
.comment-offscreen { margin-left: auto; color: var(--ink-soft); font: .64rem var(--mono); letter-spacing: .04em; white-space: nowrap; }
.comment-tools { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .45rem; }
.comment-tools .popover-action { padding: .15rem .5rem; border: 1px solid var(--rule-strong); font-size: .76rem; background: none; color: var(--ink); cursor: pointer; }
.thread-group { display: flex; align-items: baseline; justify-content: space-between; margin: 1rem 0 0; padding: 0 0 .3rem; border-bottom: 1px solid var(--rule-strong); color: var(--ink-soft); font: 600 .66rem var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.thread-group + .thread-list .comment:first-child { border-top: 0; }
.thread-filter { display: flex; gap: .3rem; margin: .6rem 0 0; font-size: .74rem; color: var(--ink-soft); }

/* ---------- Shared shell for every structured view ---------- */
.stage.is-fill { display: flex; flex-direction: column; height: 100%; padding: .85rem 1.25rem 1rem; }
.stage-wrap.is-fill { overflow: hidden; }
.sv-bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .8rem; margin-bottom: .6rem; font-size: .8rem; }
.sv-summary { color: var(--ink-soft); font: .74rem/1.4 var(--mono); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sv-spacer { flex: 1 1 auto; }
.sv-find { display: inline-flex; align-items: center; height: 1.95rem; border: 1px solid var(--rule-strong); background: var(--surface); }
.sv-find:focus-within { outline: 2px solid var(--patina); outline-offset: 1px; }
.sv-find .icon { margin-left: .5rem; color: var(--ink-soft); }
.sv-find input { width: 10rem; min-width: 0; height: 100%; padding: 0 .45rem; border: 0; background: transparent; color: var(--ink); font: .8rem var(--sans); outline: none; }
.sv-find-count { padding: 0 .5rem; border-left: 1px solid var(--rule); color: var(--ink-soft); font: .7rem var(--mono); white-space: nowrap; }
.sv-find button { display: inline-grid; place-items: center; width: 1.7rem; height: 100%; padding: 0; border: 0; border-left: 1px solid var(--rule); background: none; color: var(--ink); cursor: pointer; }
.sv-find .flip { transform: rotate(180deg); }
.sv-ctl { display: inline-flex; align-items: center; gap: .35rem; height: 1.95rem; padding: 0 .65rem; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font: .8rem var(--sans); cursor: pointer; white-space: nowrap; }
.sv-ctl:hover { border-color: var(--patina); color: var(--patina-ink); }
.sv-ctl:disabled { color: var(--ink-soft); border-color: var(--rule); cursor: not-allowed; }
.sv-ctl[aria-pressed="true"] { border-color: var(--patina); background: var(--diff-added); color: var(--patina-ink); }
.sv-bar .sg-switch { font-size: .78rem; }
.stage.is-fill > .notice { margin: 0 0 .7rem; max-width: none; flex: none; }
.raw-src { flex: 1 1 auto; min-height: 0; overflow: auto; margin: 0; }
.raw-src .code-doc { max-width: none; margin: 0; }
.esc { display: inline-block; margin: 0 .1rem; padding: 0 .2rem; border: 1px solid var(--oxide); color: var(--oxide); font: 600 .62rem/1.35 var(--mono); vertical-align: .08em; }
.err-line { background: var(--diff-removed); box-shadow: inset 3px 0 0 var(--oxide); display: inline-block; min-width: 100%; }

/* ---------- Table ---------- */
.dt-wrap { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.dt-cellbar { flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: stretch; border: 1px solid var(--rule-strong); border-bottom: 0; background: var(--surface); min-height: 2.35rem; }
.dt-addr { display: flex; flex-direction: column; justify-content: center; min-width: 5.2rem; padding: .25rem .65rem; border-right: 1px solid var(--rule); font: 600 .82rem/1.3 var(--mono); color: var(--patina-ink); white-space: nowrap; }
.dt-addr small { font: .6rem/1.3 var(--mono); color: var(--ink-soft); letter-spacing: .06em; text-transform: uppercase; font-weight: 400; max-width: 9rem; overflow: hidden; text-overflow: ellipsis; }
.dt-value { min-width: 0; padding: .45rem .75rem; font: .82rem/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 8.5rem; overflow: auto; }
.dt-value.is-empty { color: var(--ink-soft); font-family: var(--sans); font-size: .78rem; }
.dt-value .dt-kind { display: block; margin-top: .2rem; color: var(--ink-soft); font: .7rem var(--mono); white-space: normal; }
.dt-formula { display: block; margin-bottom: .2rem; color: var(--patina-ink); }
.dt-formula b { margin-right: .4rem; font: 600 .6rem var(--mono); letter-spacing: .08em; color: var(--ink-soft); }
.dt-tools { display: flex; align-items: center; gap: .35rem; padding: .3rem .5rem; border-left: 1px solid var(--rule); }
.dt-tools .popover-action { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .55rem; border: 1px solid var(--rule-strong); background: none; color: var(--ink); font: .78rem var(--sans); cursor: pointer; white-space: nowrap; }
.dt-tools .popover-action:hover { background: color-mix(in srgb, var(--patina) 12%, transparent); }
.dt-tools .popover-action:disabled { color: var(--ink-soft); cursor: not-allowed; }
.dt-tools .popover-action .icon { width: 12px; height: 12px; }
.dt { --rh: 30px; --hh: 42px; position: relative; flex: 1 1 auto; min-height: 0; overflow: auto; border: 1px solid var(--rule-strong); background: var(--surface); font: .8rem/1.2 var(--sans); outline: none; }
.dt:focus-visible { outline: 2px solid var(--patina); outline-offset: 1px; }
.dt-sizer { position: relative; }
.dt-headrow { position: sticky; top: 0; z-index: 4; height: var(--hh); }
.dt-cell:has(> .cm), .dt-cell:has(> .cm-n) { padding-right: 1.15rem; }
.dt-cell:has(> .cm-add) { padding-right: 2.1rem; }
.dt-cell > .cm-add { right: .6rem; }
.mk-device[data-frame="320"] { height: min(568px, 100%); }
.dt-rnlayer { position: sticky; left: 0; z-index: 3; height: 0; }
.dt-cell, .dt-hcell, .dt-rn { position: absolute; display: flex; align-items: center; overflow: hidden; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: var(--surface); }
.dt-cell { height: var(--rh); padding: 0 .55rem; cursor: cell; }
.dt-cell > .dt-text { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dt-cell.is-num { justify-content: flex-end; font: .76rem var(--mono); font-variant-numeric: tabular-nums; }
.dt-cell.is-date { font: .76rem var(--mono); }
.dt-cell.is-err { justify-content: flex-end; color: var(--oxide); font: 600 .74rem var(--mono); }
.dt-cell.is-formula::before { content: "fx"; position: absolute; left: .25rem; top: .15rem; color: var(--ink-soft); font: .52rem var(--mono); opacity: .8; }
.dt-more { flex: none; margin-left: .4rem; padding: 0 .25rem; border: 1px solid var(--rule); color: var(--ink-soft); font: .6rem/1.35 var(--mono); white-space: nowrap; }
.dt-hcell { top: 0; flex-direction: column; align-items: flex-start; justify-content: center; gap: .1rem; height: var(--hh); padding: 0 1.4rem 0 .55rem; background: var(--ground); border-bottom-color: var(--rule-strong); font-weight: 600; cursor: pointer; user-select: none; }
.dt-hcell:hover { color: var(--patina-ink); }
.dt-hcell > .dt-text { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dt-letter { font: 400 .6rem var(--mono); color: var(--ink-soft); letter-spacing: .08em; }
.dt-sort { position: absolute; right: .35rem; bottom: .55rem; color: var(--patina); }
.dt-sort .icon { width: 11px; height: 11px; }
.dt-sort.is-asc .icon { transform: rotate(180deg); }
.dt-corner { position: sticky; left: 0; z-index: 5; display: flex; align-items: flex-end; justify-content: flex-end; height: var(--hh); padding: 0 .45rem .35rem; border-right: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong); background: var(--ground); color: var(--ink-soft); font: .58rem var(--mono); letter-spacing: .06em; }
.dt-rn { left: 0; height: var(--rh); justify-content: flex-end; padding: 0 .45rem; border-right-color: var(--rule-strong); background: var(--ground); color: var(--ink-soft); font: .7rem var(--mono); font-variant-numeric: tabular-nums; }
.dt-rn.is-sel { color: var(--patina-ink); font-weight: 600; box-shadow: inset -2px 0 0 var(--patina); }
.dt-hcell.is-sel { box-shadow: inset 0 -2px 0 var(--patina); color: var(--patina-ink); }
.dt-cell.is-selected { z-index: 2; outline: 2px solid var(--patina); outline-offset: -2px; }
.dt-cell.is-active, .dt-hcell.is-active { z-index: 2; background: color-mix(in srgb, var(--patina) 22%, var(--surface)); outline: 2px solid var(--patina); outline-offset: -2px; }
.dt-cell.is-pending { z-index: 2; background: color-mix(in srgb, var(--patina) 30%, var(--surface)); outline: 2px dashed var(--patina); outline-offset: -2px; }
.dt-cell.is-member { background: color-mix(in srgb, var(--patina) 8%, var(--surface)); }
.dt-cell.is-find { background: var(--diff-removed); }
.dt-cell.is-find-cur { background: var(--diff-removed-strong); }
.dt-range { position: absolute; z-index: 2; border: 1px solid var(--patina); pointer-events: none; }
.dt-range.is-pending { border: 2px dashed var(--patina); background: color-mix(in srgb, var(--patina) 14%, transparent); }
.dt-range.is-active { border: 2px solid var(--patina); background: color-mix(in srgb, var(--patina) 12%, transparent); }
.dt-range-tag { position: absolute; left: -1px; top: -1.25rem; padding: 0 .3rem; background: var(--patina); color: var(--surface); font: 600 .62rem/1.25rem var(--mono); white-space: nowrap; }
.dt-hint { position: absolute; z-index: 7; padding: .22rem .55rem; background: var(--patina); color: var(--surface); font: .72rem/1.45 var(--mono); white-space: nowrap; pointer-events: none; }
.dt-hint.is-warn { background: var(--oxide); }
.dt-wide-note { flex: none; margin: .5rem 0 0; color: var(--ink-soft); font-size: .76rem; }
.dt-cell .sg-del, .dt-cell .sg-ins { white-space: pre; }
.dt-cell.is-editing { z-index: 3; overflow: visible; background: var(--surface); outline: 2px solid var(--patina); outline-offset: -2px; cursor: text; }
.dt-cell.is-editing .dt-text { overflow: visible; }
.dt-cell .sg-chip { margin-left: .3rem; }
.caret { display: inline-block; width: 1.5px; height: 1.05em; margin: 0 -1px; background: var(--patina); vertical-align: -.15em; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }

/* Spreadsheet: sheet tabs sit under the grid, the way the reader already knows them. */
.xl-tabs { flex: none; display: flex; align-items: stretch; min-height: 2.1rem; border: 1px solid var(--rule-strong); border-top: 0; background: var(--ground); font-size: .78rem; overflow-x: auto; }
.xl-tab { display: inline-flex; align-items: center; gap: .45rem; padding: 0 .9rem; border: 0; border-right: 1px solid var(--rule); background: transparent; color: var(--ink-soft); font: inherit; cursor: pointer; white-space: nowrap; }
.xl-tab:hover { color: var(--patina-ink); }
.xl-tab[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 0 2px 0 var(--patina); }
.xl-tab .action-count { font-weight: 400; }
.xl-tab .action-count.is-lit { border-color: var(--patina); color: var(--patina-ink); }
.xl-hiddenbtn { margin-left: auto; border-left: 1px solid var(--rule); border-right: 0; }
.xl-menu { position: absolute; z-index: 9; bottom: 2.3rem; right: 0; min-width: 16rem; }
.xl-menu ul { margin: 0; padding: .3rem 0; list-style: none; }
.xl-menu li button { display: flex; width: 100%; gap: .5rem; align-items: baseline; padding: .4rem .75rem; border: 0; background: none; color: var(--ink); font: .82rem var(--sans); text-align: left; cursor: pointer; }
.xl-menu li button:hover { background: color-mix(in srgb, var(--patina) 12%, transparent); }
.xl-menu li small { margin-left: auto; color: var(--ink-soft); font: .66rem var(--mono); }
.xl-menu p { margin: 0; padding: .45rem .75rem; border-top: 1px solid var(--rule); color: var(--ink-soft); font-size: .72rem; line-height: 1.4; }
.xl-note { display: flex; gap: .4rem; align-items: center; color: var(--ink-soft); font-size: .74rem; }

/* The bottom sheet: the inspector on a phone. */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 25; max-height: 64%; overflow-y: auto; padding: .35rem .9rem 1rem; background: var(--surface); border-top: 1px solid var(--rule-strong); box-shadow: 0 -10px 24px rgb(0 0 0 / 16%); }
.sheet-grab { width: 2.3rem; height: 4px; margin: .15rem auto .6rem; background: var(--rule-strong); }
.sheet-head { display: flex; align-items: baseline; gap: .5rem; margin-bottom: .35rem; }
.sheet-head .comment-addr { font: 600 .8rem var(--mono); }
.sheet-head span { color: var(--ink-soft); font: .7rem var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.sheet-value { margin: 0 0 .5rem; padding: .45rem .55rem; background: var(--ground); border: 1px solid var(--rule); font: .82rem/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.sheet .popover-tools { margin-top: .3rem; }
.sheet .popover-action { display: inline-flex; align-items: center; gap: .3rem; padding: .35rem .7rem; border: 1px solid var(--rule-strong); background: none; color: var(--ink); font: .84rem var(--sans); }
.sheet .popover-action.is-primary { background: var(--patina); border-color: var(--patina); color: var(--surface); }
.sheet .thread-list { margin: .4rem -.9rem 0; }
.sheet .comment { padding: .7rem .9rem; }
.sheet .popover-field { margin-top: .45rem; }

/* ---------- Tree ---------- */
.jt { --jr: 27px; position: relative; flex: 1 1 auto; min-height: 0; overflow: auto; border: 1px solid var(--rule-strong); background: var(--surface); font: .8rem/1 var(--mono); outline: none; }
.jt-sizer { position: relative; }
.jt-row { position: absolute; left: 0; right: 0; height: var(--jr); display: flex; align-items: center; gap: .3rem; padding: 0 1rem 0 calc(.45rem + var(--d) * 1.2rem); white-space: nowrap; cursor: default; }
.jt-row::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: calc(.45rem + var(--d) * 1.2rem); background: repeating-linear-gradient(90deg, transparent 0 calc(1.2rem - 1px), var(--rule) calc(1.2rem - 1px) 1.2rem) .45rem 0 / calc(var(--d) * 1.2rem) 100% no-repeat; pointer-events: none; }
.jt-row:hover { background: color-mix(in srgb, var(--patina) 5%, transparent); }
.jt-row.is-selected { background: var(--diff-added); box-shadow: inset 2px 0 0 var(--patina); }
.jt-tw { display: inline-grid; place-items: center; width: 1rem; height: 1rem; padding: 0; border: 0; background: none; color: var(--ink-soft); cursor: pointer; flex: none; }
.jt-tw .icon { width: 11px; height: 11px; transform: rotate(-90deg); transition: transform .12s; }
.jt-tw[aria-expanded="true"] .icon { transform: none; }
.jt-tw.is-leaf { visibility: hidden; }
.jt-node { position: relative; display: inline-flex; align-items: center; gap: .3rem; padding: .2rem 1.1rem .2rem .3rem; min-width: 0; }
.jt-node.has-add { padding-right: 1.8rem; }
.jt-key { color: var(--ink); font-weight: 600; }
.jt-idx { color: var(--ink-soft); }
.jt-colon { color: var(--ink-soft); }
.jt-str { color: var(--oxide); max-width: 44ch; overflow: hidden; text-overflow: ellipsis; }
.jt-num { color: var(--patina-ink); }
.jt-bool { color: var(--peer-3); font-weight: 600; }
.jt-null { color: var(--ink-soft); font-style: italic; }
.jt-count { color: var(--ink-soft); font-size: .7rem; }
.jt-dup { margin-left: .35rem; }
.jt-crumb { flex: none; display: flex; align-items: center; gap: .5rem; min-height: 2.35rem; padding: 0 .5rem 0 .75rem; border: 1px solid var(--rule-strong); border-bottom: 0; background: var(--surface); }
.jt-path { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: .78rem var(--mono); }
.jt-path b { color: var(--patina-ink); }
.jt-path i { font-style: normal; color: var(--ink-soft); margin: 0 .3rem; }
.jt-pointer { flex: none; color: var(--ink-soft); font: .7rem var(--mono); }
.jt-crumb .popover-action { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .55rem; border: 1px solid var(--rule-strong); background: none; color: var(--ink); font: .78rem var(--sans); cursor: pointer; white-space: nowrap; }

/* ---------- Cues ---------- */
.cues-wrap { flex: 1 1 auto; min-height: 0; overflow: auto; }
.cue-density { position: relative; flex: none; height: 1.6rem; margin: 0 0 .6rem; border: 1px solid var(--rule); background: var(--ground); }
.cue-density span { position: absolute; top: 4px; bottom: 4px; background: var(--rule-strong); }
.cue-density span.is-commented { background: var(--patina); }
.cue-density span.is-cur { outline: 2px solid var(--patina); outline-offset: 1px; }
.cue-density small { position: absolute; bottom: -1.05rem; color: var(--ink-soft); font: .6rem var(--mono); }
.cues { margin: 0; padding: 0; list-style: none; border: 1px solid var(--rule); background: var(--surface); }
.cue { position: relative; display: grid; grid-template-columns: 2.6rem 15.5rem 3.6rem minmax(0, 1fr); gap: 0 .9rem; align-items: baseline; padding: .6rem 1rem; border-bottom: 1px solid var(--rule); }
.cue:last-child { border-bottom: 0; }
.cue:hover { background: color-mix(in srgb, var(--patina) 4%, transparent); }
.cue-i { color: var(--ink-soft); font: .7rem var(--mono); text-align: right; }
.cue-time { font: .76rem var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cue-time i { font-style: normal; color: var(--ink-soft); margin: 0 .35rem; }
.cue-dur { color: var(--ink-soft); font: .7rem var(--mono); }
.cue-text { position: relative; padding: .05rem 1.6rem .05rem 0; font: 1rem/1.5 var(--serif); white-space: pre-wrap; }
.cue-speaker { display: inline-block; margin-right: .45rem; padding: 0 .3rem; border: 1px solid var(--rule-strong); color: var(--patina-ink); font: 600 .6rem/1.55 var(--mono); letter-spacing: .06em; text-transform: uppercase; vertical-align: .18em; }
.cue.is-block { background: var(--ground); color: var(--ink-soft); }
.cue.is-block .cue-text { font: .78rem/1.5 var(--mono); }
.cue-kind { color: var(--ink-soft); font: 600 .62rem var(--mono); letter-spacing: .08em; }
.cue.is-selected { background: var(--diff-added); box-shadow: inset 2px 0 0 var(--patina); }
.cue .cue-text.is-pending { background: color-mix(in srgb, var(--patina) 22%, transparent); outline: 2px dashed var(--patina); outline-offset: 2px; }
.cue .cue-text.is-active { outline: 2px solid var(--patina); outline-offset: 2px; }

/* ---------- Notebook ---------- */
.nb { max-width: 60rem; margin: 0 auto; }
.nb-meta { display: flex; flex-wrap: wrap; gap: .3rem .9rem; margin: 0 0 1rem 5.3rem; color: var(--ink-soft); font: .72rem var(--mono); }
.nb-cell { position: relative; display: grid; grid-template-columns: 4.7rem minmax(0, 1fr); gap: 0 .6rem; margin: 0 0 1rem; }
.nb-gutter { padding-top: .6rem; color: var(--ink-soft); font: .72rem/1.5 var(--mono); text-align: right; white-space: nowrap; }
.nb-gutter.is-out { color: var(--oxide); }
.nb-box { position: relative; min-width: 0; border: 1px solid var(--rule); background: var(--surface); }
.nb-cell.is-md .nb-box { border-color: transparent; background: transparent; }
.nb-cell.is-md .nb-box .prose { padding: .2rem .9rem; font-size: 1rem; }
.nb-cell.is-md .prose h1 { font-size: 1.45rem; margin-top: .3rem; }
.nb-cell.is-md .prose p { margin-bottom: .6rem; }
.nb-cell:hover .nb-box, .nb-cell.is-hover .nb-box { border-color: var(--rule-strong); }
.nb-cell.is-selected .nb-box { border-color: var(--patina); box-shadow: inset 3px 0 0 var(--patina); }
.nb-cell.is-active .nb-box { outline: 2px solid var(--patina); outline-offset: 1px; }
.nb-cell.is-pending .nb-box { outline: 2px dashed var(--patina); outline-offset: 1px; background: color-mix(in srgb, var(--patina) 6%, var(--surface)); }
.nb-src { margin: 0; padding: .6rem .9rem; overflow-x: auto; font: .8rem/1.6 var(--mono); white-space: pre; tab-size: 4; }
.nb-out-wrap { display: grid; grid-template-columns: 4.7rem minmax(0, 1fr); gap: 0 .6rem; margin-top: -.6rem; margin-bottom: 1rem; }
.nb-out { position: relative; min-width: 0; padding: .5rem .9rem; border-left: 1px solid var(--rule); font: .78rem/1.5 var(--mono); white-space: pre; overflow-x: auto; }
.nb-out.is-stream { color: var(--ink); }
.nb-out.is-stderr { background: color-mix(in srgb, var(--oxide) 6%, transparent); }
.nb-out.is-error { border-left: 3px solid var(--oxide); background: var(--diff-removed); color: var(--ink); }
.nb-out.is-error .err-name { color: var(--oxide); font-weight: 700; }
.nb-out.is-image img { display: block; max-width: 100%; height: auto; border: 1px solid var(--rule); background: #fff; }
.nb-out .nb-out-kind { position: absolute; top: .35rem; right: .5rem; color: var(--ink-soft); font: .58rem var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.nb-out.is-placeholder { display: flex; gap: .6rem; align-items: flex-start; white-space: normal; font: .84rem/1.45 var(--sans); background: var(--surface); border-left: 3px solid var(--oxide); }
.nb-out.is-placeholder .icon { color: var(--oxide); margin-top: .2rem; }
.nb-out.is-placeholder p { margin: 0 0 .4rem; }
.nb-tools { position: absolute; top: -.95rem; right: .5rem; z-index: 4; display: none; }
.nb-cell:hover .nb-tools, .nb-cell.is-hover .nb-tools, .nb-cell:focus-within .nb-tools { display: flex; }
.nb-tools .popover-action { display: inline-flex; align-items: center; gap: .35rem; font-size: .76rem; padding: .25rem .6rem; }
.nb-tools .popover-action .icon { width: 12px; height: 12px; }
.cue .cm-add { display: none; }
.cue:hover .cm-add, .cue.is-hover .cm-add, .cue.is-selected .cm-add, .cue:focus-within .cm-add { display: inline-grid; }
.nb-out.is-locked { outline: 2px dashed var(--oxide); outline-offset: -2px; }

/* ---------- Documents in the frame ---------- */
.ufr { position: relative; flex: 1 1 auto; min-height: 0; overflow: auto; border: 1px solid var(--rule-strong); background: #8d918f; }
.ufr-label { position: absolute; top: .4rem; right: .6rem; z-index: 3; padding: .05rem .4rem; border: 1px dashed rgba(255,255,255,.6); color: #fff; font: .6rem var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.docx-page { position: relative; width: 680px; min-height: 880px; margin: 1.5rem auto; padding: 72px 78px 64px; background: #fff; color: #111; box-shadow: 0 0 10px rgb(0 0 0 / 50%); font: 11pt/1.45 Calibri, Carlito, "Segoe UI", system-ui, sans-serif; }
.docx-page h1 { margin: 0 0 4pt; color: #17365d; font: 600 22pt/1.2 Cambria, Georgia, serif; }
.docx-page h2 { margin: 16pt 0 6pt; color: #1f4e79; font: 600 13pt/1.3 Calibri, Carlito, "Segoe UI", sans-serif; }
.docx-page p { margin: 0 0 8pt; }
.docx-page .sub { color: #555; font-size: 10pt; margin-bottom: 16pt; }
.docx-page table { width: 100%; border-collapse: collapse; margin: 6pt 0 10pt; font-size: 9.5pt; }
.docx-page th, .docx-page td { border: 1px solid #9aa5b1; padding: 3pt 6pt; text-align: left; }
.docx-page th { background: #dce6f1; }
.docx-page figure { position: relative; margin: 8pt 0 10pt; }
.docx-page figure img { display: block; width: 100%; border: 1px solid #c8cdd2; }
.docx-page figcaption { color: #555; font-size: 9pt; font-style: italic; margin-top: 3pt; }
.docx-head, .docx-foot { position: absolute; left: 78px; right: 78px; color: #777; font-size: 8.5pt; display: flex; justify-content: space-between; }
.docx-head { top: 32px; } .docx-foot { bottom: 28px; }
.docx-page .relic-text-mark { background: rgba(31, 107, 100, .22); border-bottom-color: #1f6b64; }
.docx-page .relic-text-mark.is-active { background: rgba(31, 107, 100, .4); outline-color: #1f6b64; }
.docx-page ins.tc { color: #1a5a9a; text-decoration: underline; }
.docx-page del.tc { color: #a33; }

.ep { display: grid; grid-template-columns: 17rem minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); flex: 1 1 auto; min-height: 0; border: 1px solid var(--rule-strong); background: var(--surface); }
.ep.is-closed { grid-template-columns: 0 minmax(0, 1fr); }
.ep-bar { grid-column: 1 / -1; display: flex; align-items: center; gap: .6rem; min-height: 2.6rem; padding: 0 .6rem; border-bottom: 1px solid var(--rule); font-size: .8rem; }
.ep-bar .ep-title { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600; }
.ep-bar .ep-title span { color: var(--ink-soft); font-weight: 400; margin-left: .45rem; }
.ep-pos { color: var(--ink-soft); font: .7rem var(--mono); white-space: nowrap; }
.ep-size { display: inline-flex; border: 1px solid var(--rule-strong); }
.ep-size button { width: 1.9rem; height: 1.7rem; padding: 0; border: 0; background: none; color: var(--ink); font: 600 .72rem var(--serif); cursor: pointer; }
.ep-size button + button { border-left: 1px solid var(--rule-strong); font-size: .95rem; }
.ep-toc { overflow-y: auto; padding: .8rem 0 1.5rem; border-right: 1px solid var(--rule); background: var(--ground); }
.ep.is-closed .ep-toc { visibility: hidden; }
.ep-toc h4 { margin: 0 1rem .5rem; color: var(--ink-soft); font: 600 .62rem var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.ep-toc ol { margin: 0; padding: 0; list-style: none; }
.ep-toc a { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: .3rem; padding: .32rem 1rem; color: var(--ink); font-size: .84rem; line-height: 1.35; text-decoration: none; }
.ep-toc a:hover { background: color-mix(in srgb, var(--patina) 8%, transparent); color: var(--patina-ink); }
.ep-toc a b { color: var(--ink-soft); font: .66rem/1.9 var(--mono); font-weight: 400; }
.ep-toc a small { color: var(--ink-soft); font: .62rem/1.9 var(--mono); }
.ep-toc a.is-sub { padding-left: 2.6rem; color: var(--ink-soft); font-size: .8rem; grid-template-columns: minmax(0, 1fr) auto; }
.ep-toc a[aria-current="true"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--patina); color: var(--patina-ink); font-weight: 600; }
.ep-read { position: relative; overflow-y: auto; }
.ep-prog { position: sticky; top: 0; z-index: 2; height: 2px; background: var(--rule); }
.ep-prog i { display: block; height: 100%; background: var(--patina); }
.ep-col { max-width: 35rem; margin: 0 auto; padding: 2.4rem 1.5rem 4rem; font: 1.1rem/1.72 var(--serif); hyphens: auto; }
.ep-col h2 { margin: 0 0 .2rem; font: 600 .7rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.ep-col h3 { margin: 0 0 1.6rem; font: 600 1.7rem/1.2 var(--serif); }
.ep-col p { margin: 0 0 1rem; text-align: justify; }
.ep-col p.first::first-letter { float: left; margin: .12rem .4rem 0 0; font: 600 3.3rem/.85 var(--serif); color: var(--patina-ink); }
.ep-col figure { margin: 1.4rem 0; }
.ep-col figure img { display: block; width: 100%; }
.ep-col figcaption { color: var(--ink-soft); font: italic .85rem/1.4 var(--serif); margin-top: .35rem; }
.ep-col sup a { color: var(--patina-ink); font: 600 .7rem var(--mono); text-decoration: none; }
.ep-col .ep-break { text-align: center; color: var(--ink-soft); letter-spacing: .6em; margin: 1.5rem 0; }

/* Never covers its target: right of it, else left, else below, else above. */
function place(el, r, prefer) {
  const host = V.main;
  const hr = host.getBoundingClientRect();
  const wr = V.wrap.getBoundingClientRect();
  el.style.visibility = 'hidden';
  el.style.left = '0px';
  el.style.top = '0px';
  host.append(el);
  const w = el.offsetWidth,
    hh = el.offsetHeight;
  const pad = 8;
  const L = wr.left - hr.left + pad,
    Rr = wr.right - hr.left - pad,
    T = wr.top - hr.top + pad,
    Bb = wr.bottom - hr.top - pad;
  const tr = {
    left: r.left - hr.left,
    right: r.right - hr.left,
    top: r.top - hr.top,
    bottom: r.bottom - hr.top,
  };
  const clampY = (y) => Math.max(T, Math.min(y, Bb - hh));
  const clampX = (x) => Math.max(L, Math.min(x, Rr - w));
  let x, y;
  const order =
    prefer === 'below'
      ? ['below', 'above', 'right', 'left']
      : ['right', 'left', 'below', 'above'];
  for (const side of order) {
    if (side === 'right' && tr.right + 10 + w <= Rr) {
      x = tr.right + 10;
      y = clampY(tr.top - 6);
      break;
    }
    if (side === 'left' && tr.left - 10 - w >= L) {
      x = tr.left - 10 - w;
      y = clampY(tr.top - 6);
      break;
    }
    if (side === 'below' && tr.bottom + 8 + hh <= Bb) {
      x = clampX(tr.left);
      y = tr.bottom + 8;
      break;
    }
    if (side === 'above' && tr.top - 8 - hh >= T) {
      x = clampX(tr.left);
      y = tr.top - 8 - hh;
      break;
    }
  }
  if (x == null) {
    x = clampX(tr.right + 10);
    y = clampY(tr.bottom + 8);
  }
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.visibility = '';
  return el;
}

    const sh = a.sheet || '';

function jtFlatten(jt) {
  const rows = [];
  let nodes = 0;
  const walk = (key, val, path, depth, idx, dup) => {
    const t =
      val === null
        ? 'null'
        : Array.isArray(val)
          ? 'x'
          : typeof val === 'object'
            ? val.t
            : typeof val;
    const kids =
      t === 'object'
        ? val.entries.length
        : t === 'array'
          ? val.items
            ? val.items.length
            : val.length
          : 0;
    rows.push({ key, val, path, depth, t, kids, idx, dup });
    if ((t === 'object' || t === 'array') && jt.open.has(path)) {
      if (t === 'object') {
        const seen = {};
        val.entries.forEach(([k]) => {
          seen[k] = (seen[k] || 0) + 1;
        });
        const at = {};
        val.entries.forEach(([k, v]) => {
          at[k] = (at[k] || 0) + 1;
          const dup =
            seen[k] > 1 ? (at[k] === seen[k] ? 'wins' : 'ignored') : null;
          /* An earlier duplicate gets its own row id; comments only ever point at the last one. */
          walk(
            k,
            v,
            path + '/' + k + (dup === 'ignored' ? '@' + at[k] : ''),
            depth + 1,
            null,
            dup
          );
        });
      } else if (val.items)
        val.items.forEach((v, i) =>
          walk(null, v, path + '/' + i, depth + 1, i)
        );
      else
        for (let i = 0; i < val.length; i++)
          rows.push({
            key: null,
            val: val.item(i),
            path: path + '/' + i,
            depth: depth + 1,
            t: 'number',
            kids: 0,
            idx: i,
          });
    }
  };
  walk(null, JSON_ROOT, '', 0, null);
  jt.rows = rows;
  return nodes;
}

function highlightPy(src) {
  const out = [];
  const re =
    /("[^"\n]*"|'[^'\n]*'|#[^\n]*|\b\d+(?:\.\d+)?\b|\b(?:import|from|as|def|return|for|in|if|else|print|with|lambda|None|True|False)\b)/g;
  let last = 0,
    m;
  while ((m = re.exec(src))) {
    if (m.index > last) out.push(src.slice(last, m.index));
    const t = m[0];
    out.push(
      h(
        'span',
        {
          class:
            t[0] === '"' || t[0] === "'"
              ? 'tok-str'
              : t[0] === '#'
                ? 'tok-com'
                : /\d/.test(t[0])
                  ? 'tok-num'
                  : 'tok-kw',
        },
        t
      )
    );
    last = m.index + t.length;
  }
  if (last < src.length) out.push(src.slice(last));
  return out;
}
function mdNodes(md, cellNo) {
  return md.map(([tag, ...parts]) =>
    h(
      tag,
      null,
      ...parts.map((p) => {
        if (typeof p === 'string') return p;
        if (p[0] === 'code') return h('code', null, p[1]);
        if (p[0] === 'q') {
          const marked = V.nb.quoteMarked;
          return marked
            ? h(
                'mark',
                {
                  class:
                    'relic-text-mark' + (V.nb.activeQuote ? ' is-active' : ''),
                  'data-quote': '1',
                },
                p[1]
              )
            : p[1];
        }
        return p[1];
      })
    )
  );
}

function tbl(V, ds, extra) {
  V.view = 'table';

    ...(extra && extra.doc),
  };

  V.source = {

  };

  V.stripMeta =
    extra && extra.meta != null
      ? extra.meta
      : 'Select a cell to comment on it or suggest an edit.';
}
function csvSource(ds) {
  const sep = ds.delim === 'semicolon-separated' ? ';' : ',';
  const q = (v) => (/[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v);
  const lines = [
    ds.cols
      .slice(0, 14)
      .map((c) => c.name)
      .join(sep),
  ];
  for (let r = 0; r < 40 && r < ds.n; r++)
    lines.push(
      ds.cols
        .slice(0, 14)
        .map((_, c) => q(String(ds.cell(r, c).v)))
        .join(sep)
    );
  return lines.join('\n');
}
function focusCellComment(cm) {

    return raf2(() => raf2(() => focusCellComment(cm)));

  if (a.k === 'col') {
