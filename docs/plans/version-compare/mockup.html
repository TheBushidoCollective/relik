<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">

<title>Relik · version comparison for documents, books and spreadsheets · mock</title>
<!--
  A local, clickable mock for docs/plans/version-compare/plan.md, section 8 (B5).
  It is not the viewer. The band, the comparison toolbar, the pickers, the layout
  control, the slider, the change navigation, the Changes sidebar and its tab are
  drawn from packages/relic-viewer/src/styles.css (.diff-*, .compare-*, .thread*).
  Everything new is the outline cues on document blocks, the Chapters preface, the
  sheet strip and the paired grids.

  Non-colour cues (plan 3.6): documents use a solid outline for added, dashed with
  line-through for removed and double for changed. Grids use a solid stripe for
  added, line-through for removed, a dotted ring for changed and an "fx" corner for
  a formula-only change. Every cue also carries visually hidden text.

  Untrusted text: every fixture string is inserted with createTextNode. Bidi
  controls are drawn as a visible escape.

  Mock chrome (the state bar, the state list) is drawn with dashed rules so it
  never passes for the product.
-->
<style>
:root {
  color-scheme: light;
  --ground: #f1f2f0; --surface: #fbfbfa; --ink: #16191a; --ink-soft: #5a6163;
  --rule: #d2d5d2; --rule-strong: #b3b8b4; --patina: #1f6b64; --patina-ink: #0f3b37;
  --oxide: #8c4a2f; --diff-added: #dfeeea; --diff-added-strong: #a7d6ca;
  --diff-removed: #f3e5df; --diff-removed-strong: #ddb6a6;
  --page: #ffffff; --page-ink: #1b1b1b;
  --serif: Charter, "Iowan Old Style", "Source Serif Pro", Palatino, "Palatino Linotype", Georgia, serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bar-height: 3.25rem;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #101314; --surface: #171b1c; --ink: #e6e9e7; --ink-soft: #969e9d;
  --rule: #2a3032; --rule-strong: #3b4345; --patina: #4fb3a6; --patina-ink: #a7ded5;
  --oxide: #c98058; --diff-added: #15332f; --diff-added-strong: #24564e;
  --diff-removed: #34231d; --diff-removed-strong: #684331;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  background: var(--ground); color: var(--ink); font: 16px/1.55 var(--sans); -webkit-text-size-adjust: 100%; }
.icon { width: 14px; height: 14px; flex: none; }
button { font: inherit; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- mock chrome: not the viewer, drawn with dashed rules ---------- */
.mk-bar { flex: none; position: relative; z-index: 60; display: flex; align-items: center; gap: .4rem;
  height: 36px; padding: 0 .5rem; min-width: 0; background: var(--surface);
  border-bottom: 1px dashed var(--rule-strong); font: 11px/1.3 var(--mono); }
.mk-tag { flex: none; padding: .1rem .35rem; border: 1px dashed var(--rule-strong); color: var(--ink-soft);
  font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.mk-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: .3rem;
  height: 24px; min-width: 24px; padding: 0 .5rem; border: 1px solid var(--rule-strong);
  background: var(--surface); color: var(--ink); font: 11px var(--mono); cursor: pointer; white-space: nowrap; }
.mk-btn:hover { border-color: var(--patina); color: var(--patina-ink); }
.mk-btn:focus-visible { outline: 2px solid var(--patina); outline-offset: 1px; }
.mk-btn[aria-pressed="true"] { border-color: var(--patina); background: var(--diff-added); color: var(--patina-ink); }
.mk-title { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 12px/1.3 var(--sans); }
.mk-title b { margin-right: .45rem; font: 600 11px var(--mono); color: var(--patina-ink); }
@media (max-width: 719px) { .mk-wide { display: none !important; } }
.mk-drawer { position: absolute; top: 36px; left: 0; right: 0; z-index: 70; max-height: calc(100dvh - 36px);
  overflow-y: auto; padding: .7rem .75rem 1.2rem; background: var(--surface);
  border-bottom: 1px dashed var(--rule-strong); box-shadow: 0 12px 24px rgb(0 0 0 / 18%); font: 12px/1.45 var(--sans); }
.mk-drawer h3 { margin: .9rem 0 .35rem; color: var(--ink-soft); font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.mk-drawer ol { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); gap: .25rem; margin: 0; padding: 0; list-style: none; }
.mk-state { display: flex; gap: .5rem; width: 100%; padding: .35rem .5rem; border: 1px solid var(--rule);
  background: var(--surface); color: var(--ink); font: 12px/1.35 var(--sans); text-align: left; cursor: pointer; }
.mk-state b { flex: none; min-width: 3.4rem; font: 600 11px/1.5 var(--mono); color: var(--patina-ink); }
.mk-state:hover { border-color: var(--patina); }
.mk-state[aria-current="true"] { border-color: var(--patina); background: var(--diff-added); }
.mk-floor { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; align-items: flex-start; overflow: hidden; }
.mk-device { container: viewer / inline-size; position: relative; width: 100%; height: 100%;
  display: flex; flex-direction: column; overflow: hidden; background: var(--ground); }
.mk-device[data-frame="390"] { width: min(390px, 100%); height: min(808px, 100%); box-shadow: 0 0 0 1px var(--rule-strong); }

/* ---------- the viewer, from packages/relic-viewer/src/styles.css ---------- */
.viewer { position: relative; display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; background: var(--ground); color: var(--ink); }
.bar { position: relative; z-index: 10; display: flex; align-items: stretch; flex: none; min-height: var(--bar-height);
  background: var(--surface); border-bottom: 1px solid var(--rule-strong); }
.mark { display: flex; align-items: center; padding: 0 1rem; font: 600 .78rem var(--mono); letter-spacing: .01em; color: var(--ink); border-right: 1px solid var(--rule); white-space: nowrap; }
.identity { display: flex; flex-direction: column; justify-content: center; gap: .1rem; padding: .4rem 1rem; min-width: 0; flex: 1; }
.filename { font-size: .9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.identity-meta { display: flex; align-items: center; gap: .6rem; min-width: 0; }
.accession { min-width: 0; flex: 0 1 auto; font: .66rem var(--mono); letter-spacing: .14em; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.version-label { flex: none; display: inline-flex; align-items: center; padding: .05rem .35rem; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink-soft); font: .66rem var(--mono); letter-spacing: .06em; white-space: nowrap; }
.actions { display: flex; align-items: stretch; border-left: 1px solid var(--rule); }
.action { position: relative; display: inline-flex; align-items: center; gap: .45rem; padding: 0 .9rem; border: 0; border-right: 1px solid var(--rule);
  background: transparent; color: var(--ink); font-size: .82rem; cursor: pointer; white-space: nowrap; }
.actions .action:last-child { border-right: 0; }
.action:hover { background: var(--ground); color: var(--patina-ink); }
.action:focus-visible { outline: 2px solid var(--patina); outline-offset: -2px; }
.action[aria-pressed="true"] { color: var(--patina-ink); background: var(--diff-added); }
@container viewer (max-width: 34rem) {
  .action .lbl { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .action { padding: 0 .75rem; }
  .mark { display: none; }
  .identity { padding: .4rem .7rem; }
  .identity-meta .accession { display: none; }
}
.viewer-main { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
.stage-wrap { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; overflow: auto; }
.stage { position: relative; padding: 2rem 1.25rem 4rem; }
.notice { display: flex; gap: .6rem; align-items: flex-start; max-width: 46rem; margin: 0 auto 1.5rem; padding: .7rem .9rem;
  border-left: 3px solid var(--oxide); background: var(--surface); color: var(--ink); font-size: .86rem; }
.notice.is-info { border-left-color: var(--patina); }
.notice p { margin: 0; }
.notice .icon { margin-top: .2rem; color: var(--oxide); }
.notice.is-info .icon { color: var(--patina); }
.notice .action-inline { margin-top: .5rem; display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .7rem;
  border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink); font-size: .8rem; cursor: pointer; }

/* the comparison shell */
.diff-shell { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; min-height: 0; }
.diff-toolbar { flex: none; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 1rem 2rem;
  padding: 1rem 1.25rem .75rem; background: var(--ground); border-bottom: 1px solid var(--rule-strong); }
.diff-heading { flex: 1 1 16rem; min-width: 14rem; }
.diff-eyebrow { margin-bottom: .25rem; color: var(--patina-ink); font: 700 .68rem var(--mono); letter-spacing: .14em; text-transform: uppercase; }
.diff-heading h1 { margin: 0; font-size: clamp(1.3rem, 2.5vw, 1.9rem); line-height: 1.2; letter-spacing: -.02em; font-family: var(--serif); font-weight: 600; }
.diff-heading h1:focus { outline: none; }
.diff-heading h1:focus-visible { outline: 2px solid var(--patina); outline-offset: 4px; }
.diff-history-note { max-width: 52rem; margin: .45rem 0 0; color: var(--ink-soft); font-size: .88rem; }
.diff-kind { display: inline-flex; align-items: center; gap: .35rem; margin-left: .1rem; color: var(--ink-soft); font: .7rem var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.compare-picker { display: flex; align-items: center; gap: .6rem; flex: none; }
.compare-picker-side { display: flex; align-items: center; gap: .4rem; position: relative; }
.compare-picker-caption { font: .68rem var(--mono); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .08em; }
.compare-picker-separator { font: .68rem var(--mono); color: var(--ink-soft); }
.compare-picker-trigger { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .5rem; font: .72rem var(--mono);
  border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink); cursor: pointer; }
.compare-controls { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1.25rem; margin-top: .75rem; width: 100%; }
.compare-layout { display: flex; flex: none; border: 1px solid var(--rule-strong); }
.compare-layout .action { padding: .35rem .7rem; border-right: 1px solid var(--rule-strong); font-size: .8rem; }
.compare-layout .action:last-child { border-right: 0; }
.compare-layout .action[aria-pressed='true'] { background: var(--patina); color: var(--surface); }
.compare-nav { display: flex; flex: none; align-items: center; gap: .25rem; border: 1px solid var(--rule-strong); }
.compare-nav .action { padding: .35rem .5rem; font-size: .8rem; border-right: 0; }
.compare-nav .action:disabled { color: var(--ink-soft); cursor: default; background: transparent; }
.compare-nav-previous svg { transform: rotate(180deg); }
.compare-nav-position { padding: 0 .35rem; color: var(--ink-soft); font: .72rem var(--mono); white-space: nowrap; }
.compare-swipe { display: flex; align-items: center; gap: .75rem; flex: 1; min-width: 0; }
.compare-swipe span { flex: none; color: var(--ink-soft); font-size: .78rem; }
.compare-swipe input { flex: 1; min-width: 4rem; accent-color: var(--patina); }
.compare-swipe input:focus-visible { outline: 2px solid var(--patina); outline-offset: 2px; }

.diff-row { position: relative; display: flex; flex: 1 1 auto; min-height: 0; width: 100%; }
.diff-body { position: relative; display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; min-height: 0; padding: .75rem 1.25rem 1rem; gap: .6rem; }
.compare-stage { --split: 50%; position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; border: 1px solid var(--rule-strong); background: var(--surface); }
.compare-stage[data-layout='swipe'] { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.compare-stage[data-layout='swipe'] .compare-pane { grid-area: 1 / 1; min-width: 0; min-height: 0; height: 100%; }
.compare-stage[data-layout='swipe'] .compare-pane-current { clip-path: inset(0 calc(100% - var(--split)) 0 0); }
.compare-stage[data-layout='split'] { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); }
.compare-stage[data-layout='split'] .compare-pane { min-width: 0; min-height: 0; height: 100%; }
.compare-stage[data-layout='split'] .compare-pane-before { border-right: 1px solid var(--rule-strong); }
.compare-stage[data-layout='split'] .compare-divider { display: none; }
.compare-pane { overflow: auto; flex: 1 1 0; min-width: 0; min-height: 0; height: 100%; background: var(--ground); position: relative; }
.compare-divider { position: absolute; top: 0; bottom: 0; left: var(--split); width: 1px; background: #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / 35%); pointer-events: none; z-index: 3; }
.compare-label { position: absolute; top: .6rem; z-index: 2; padding: .2rem .45rem; background: rgb(16 19 20 / 82%); color: #fff; font: .66rem var(--mono); pointer-events: none; letter-spacing: .04em; }
.compare-label-before { right: .6rem; }
.compare-label-current { left: .6rem; }
.compare-stage[data-layout='split'] .compare-label-before { left: .6rem; right: auto; }
.compare-stage[data-layout='split'] .compare-label-current { left: calc(50% + .6rem); right: auto; }
.diff-loading { margin: 2rem 0; color: var(--ink-soft); font: .82rem var(--mono); }
.diff-scope { margin: 0; color: var(--ink-soft); font-size: .8rem; }

/* the Changes sidebar */
.thread { flex: 0 1 auto; width: clamp(18rem, 22rem, calc(100% - 28rem)); min-width: 18rem; margin: 0; padding: 0 1.25rem 1.5rem; overflow-y: auto;
  background: var(--surface); border-left: 1px solid var(--rule-strong); }
.thread-title { position: sticky; top: 0; z-index: 1; margin: 0 -1.25rem .25rem; background: var(--surface); border-bottom: 1px solid var(--rule); }
.thread-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 2.75rem; padding: .65rem 1.25rem;
  color: var(--ink); font: 600 .95rem var(--sans); text-align: left; background: transparent; border: 0; cursor: pointer; }
.thread-toggle:focus-visible { outline: 2px solid var(--patina); outline-offset: -2px; }
.count { display: inline-grid; place-items: center; min-width: 1.6rem; padding: 0 .35rem; margin-left: .5rem; border: 1px solid var(--rule-strong); font: .72rem var(--mono); color: var(--ink-soft); }
.thread-tab { position: relative; flex: 0 0 auto; align-self: center; z-index: 5; padding: .85rem .4rem; color: var(--ink); font: 600 .76rem var(--sans);
  letter-spacing: .06em; text-transform: uppercase; writing-mode: vertical-rl; background: var(--surface); border: 1px solid var(--rule-strong); border-right: 0; cursor: pointer; }
.thread-tab:focus-visible { outline: 2px solid var(--patina); outline-offset: 2px; }
.diff-summary { margin: .75rem 0 .3rem; font-size: .92rem; font-weight: 600; }
.diff-title-line { margin: .3rem 0; font-size: .85rem; }
.diff-change-list { margin: .75rem 0 0; padding: 0; list-style: none; border: 1px solid var(--rule); background: var(--surface); font-size: .84rem; }
.diff-change { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: .15rem .75rem; padding: .5rem .75rem; width: 100%; border: 0; background: transparent;
  color: var(--ink); font: inherit; text-align: left; }
.diff-change + .diff-change, li + li > .diff-change { border-top: 1px solid var(--rule); }
.diff-change.is-linked { cursor: pointer; }
.diff-change.is-linked:hover, .diff-change.is-linked:focus-visible { background: color-mix(in srgb, var(--patina) 10%, transparent); outline: none; }
.diff-change.is-linked:focus-visible { box-shadow: inset 0 0 0 2px var(--patina); }
.diff-change[aria-current="true"] { box-shadow: inset 3px 0 0 var(--patina); background: color-mix(in srgb, var(--patina) 7%, transparent); }
.diff-change-kind { font: .68rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); padding-top: .12rem; }
.diff-change-added .diff-change-kind { color: var(--patina-ink); }
.diff-change-removed .diff-change-kind { color: var(--oxide); }
.diff-change-what { color: var(--ink-soft); min-width: 0; overflow-wrap: anywhere; }
.diff-change-detail { grid-column: 1 / -1; min-width: 0; overflow-wrap: anywhere; }
.diff-change-detail del { background: var(--diff-removed); text-decoration-thickness: 1px; }
.diff-change-detail ins { background: var(--diff-added); text-decoration: none; border-bottom: 1px solid var(--patina); }
.diff-change-detail del + ins { margin-left: .18em; }
.diff-change-more { padding: .55rem .75rem; color: var(--ink-soft); font-size: .8rem; border-top: 1px solid var(--rule); }
.esc { display: inline-block; padding: 0 .2rem; margin: 0 .1rem; border: 1px solid var(--oxide); color: var(--oxide); font: .7rem/1.3 var(--mono); vertical-align: .05em; }

/* Chapters preface (new) */
.chapters { margin: .75rem 0 0; border: 1px solid var(--rule); }
.chapters h2 { margin: 0; padding: .45rem .75rem; font: 700 .68rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--patina-ink); border-bottom: 1px solid var(--rule); }
.chapters ul { margin: 0; padding: 0; list-style: none; }
.chapter-row { display: flex; justify-content: space-between; gap: .75rem; width: 100%; padding: .45rem .75rem; border: 0; border-top: 1px solid var(--rule);
  background: transparent; color: var(--ink); font: .84rem var(--sans); text-align: left; cursor: pointer; }
li:first-child > .chapter-row { border-top: 0; }
.chapter-row:hover, .chapter-row:focus-visible { background: color-mix(in srgb, var(--patina) 10%, transparent); outline: none; }
.chapter-row:focus-visible { box-shadow: inset 0 0 0 2px var(--patina); }
.chapter-row .state { flex: none; font: .7rem var(--mono); color: var(--ink-soft); letter-spacing: .04em; }
.chapter-row .state.is-removed { color: var(--oxide); }
.chapter-row .state.is-added { color: var(--patina-ink); }
.chapter-row.is-unchanged { color: var(--ink-soft); cursor: default; }

/* Document panes: docx-preview pages inside each frame */
.frame-doc { padding: 1.25rem 1rem 3rem; }
.docx-page { position: relative; max-width: 40rem; margin: 0 auto; padding: 3.25rem 3.25rem 3.5rem; background: var(--page); color: var(--page-ink);
  box-shadow: 0 0 0 1px rgb(0 0 0 / 8%), 0 2px 10px rgb(0 0 0 / 12%); font: 15px/1.5 Calibri, Carlito, "Segoe UI", var(--sans); }
.docx-header, .docx-footer { position: absolute; left: 3.25rem; right: 3.25rem; color: #6b6b6b; font-size: 11px; }
.docx-header { top: 1.3rem; } .docx-footer { bottom: 1.2rem; }
.docx-page h1 { margin: 0 0 .8rem; font-size: 26px; font-weight: 400; color: #1f3763; }
.docx-page p { margin: 0 0 .7rem; }
.docx-page table { border-collapse: collapse; margin: .4rem 0 1rem; min-width: 14rem; }
.docx-page td { border: 1px solid #8a8a8a; padding: .25rem .6rem; }
.docx-page .docx-img { display: block; width: 72px; height: 48px; margin: .5rem 0 1rem; background: repeating-linear-gradient(45deg, #c8d3d1 0 6px, #e4eae9 6px 12px); }
.frame-book { max-width: 36rem; margin: 0 auto; padding: 2rem 1.5rem 4rem; font: 17px/1.7 var(--serif); color: var(--ink); }
.frame-book article { padding-bottom: 1.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--rule); }
.frame-book h2 { font: 600 1.25rem/1.3 var(--serif); margin: 0 0 .6rem; }
.frame-book p { margin: 0 0 .8rem; }
.frame-book .book-title { font: .72rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 1.5rem; }
/* outline cues, drawn by the frame from mark paths */
[data-relic-diff] { outline-offset: 3px; }
[data-relic-diff="added"] { outline: 2px solid #1f6b64; }
[data-relic-diff="removed"] { outline: 2px dashed #8c4a2f; text-decoration: line-through; text-decoration-color: #8c4a2f; }
[data-relic-diff="changed"] { outline: 4px double #1f6b64; }
.frame-book [data-relic-diff="added"], .frame-book [data-relic-diff="changed"] { outline-color: var(--patina); }
.frame-book [data-relic-diff="removed"] { outline-color: var(--oxide); text-decoration-color: var(--oxide); }
td[data-relic-diff] { outline-offset: -4px; }
.is-current-change { box-shadow: 0 0 0 7px color-mix(in srgb, #1f6b64 22%, transparent); }
.frame-card { max-width: 30rem; margin: 3rem auto; padding: 1.1rem 1.2rem; border: 1px solid var(--rule-strong); background: var(--surface); font-size: .9rem; }
.frame-card h2 { margin: 0 0 .35rem; font-size: 1rem; }
.frame-card p { margin: 0; color: var(--ink-soft); }
.plate { display: grid; place-items: center; height: 100%; min-height: 10rem; color: var(--ink-soft); font: .82rem var(--mono); }
.plate span { padding: .5rem .8rem; border: 1px solid var(--rule); background: var(--surface); }

/* Sheet strip and paired grids (new) */
.sheet-strip { flex: none; display: flex; gap: 0; overflow-x: auto; border: 1px solid var(--rule-strong); background: var(--surface); scrollbar-width: thin; }
.sheet-tab { flex: none; display: inline-flex; align-items: center; gap: .45rem; padding: .45rem .8rem; border: 0; border-right: 1px solid var(--rule);
  background: transparent; color: var(--ink); font: .82rem var(--sans); cursor: pointer; white-space: nowrap; }
.sheet-tab[aria-selected="true"] { background: var(--ground); box-shadow: inset 0 -3px 0 var(--patina); font-weight: 600; }

/* --- navigation --- */
function goChange(i) {
  if (i < 0 || i >= V.changes.length) return;
  V.current = i;
  if (V.fmt === 'xlsx') { const ch = V.changes[i]; if (ch.ref) { V.select = ch.ref; } }

function revealCurrent() {
  for (const el of $$('.is-current-change')) el.classList.remove('is-current-change');
  if (V.current < 0) return;
  for (const pane of $$('.compare-pane')) {
    let el;
    if (V.fmt === 'xlsx') { const ref = V.changes[V.current] && V.changes[V.current].ref; el = ref && pane.querySelector(`td[data-ref="${ref}"]`); }
    else el = pane.querySelector(`[data-relic-change-id="c${V.current}"]`);
    if (!el) continue;
    el.classList.add('is-current-change');
    const box = pane.getBoundingClientRect(), r = el.getBoundingClientRect();

/* --- scroll sync: proportional for documents, exact for grids --- */
function wireSync() {
  const panes = V.fmt === 'xlsx' ? $$('.dt-scroll') : $$('.compare-pane');
  if (panes.length !== 2) return;
  let lock = false;
  panes.forEach((p, i) => p.addEventListener('scroll', () => {
    if (lock) return; lock = true;
    const o = panes[1 - i];
    if (V.fmt === 'xlsx') { o.scrollTop = p.scrollTop; o.scrollLeft = p.scrollLeft; }
    else { const f = p.scrollTop / Math.max(1, p.scrollHeight - p.clientHeight); o.scrollTop = f * (o.scrollHeight - o.clientHeight); }
    requestAnimationFrame(() => { lock = false; });
  }));

function buildXlsx() {
  const s = V.st, variant = s.variant;
  const parts = [band({ file: SHEET_FILE, version: 3, accession: 'RLK-2X6P · 3 versions', comparing: true })];
  if (variant === 'toolarge' || variant === 'unreadable') {
    const text = variant === 'toolarge' ? COPY.tooLarge(R) : COPY.unreadable(R);
    const sheet = SHEETS[0];
    V.sheetObj = { ...sheet, states: {}, rc: sheet.lc };
    const grid = h('div', { class: 'sheet-pane' }, cellbar(q3(false), 'A1'), h('div', { class: 'dt-scroll', 'data-side': 'single' }, drawGrid(q3(false), 'before', V.sheetObj, 20)));
    parts.push(h('div', { class: 'diff-shell' }, toolbar(COPY.sheetLabel, { note: 'Version 2 is shown on its own.', controls: false }),
      singleView(text, `Version ${L}: ${SHEET_FILE}`, grid)));
    return parts;
  }
  const loading = s.phase === 'loading';
  let sheets = SHEETS.slice();
  if (s.withChart) sheets = sheets.concat(CHART_SHEET);
  if (variant === 'hostile') sheets = [SHEETS[0], HOSTILE_SHEET];
  if (variant === 'same') sheets = [{ id: 'q3', name: 'Q3', badges: [], lc: () => q3(false), rc: () => q3(false), states: {}, changes: [] }];
  const sheet = sheets.find((x) => x.id === V.sheet) || sheets[0];
  V.sheet = sheet.id; V.sheetObj = sheet;
  V.changes = sheet.changes || [];
  const body = h('div', { class: 'diff-body' });
  const strip = h('div', { class: 'sheet-strip', role: 'tablist', 'aria-label': `Sheets in version ${L} and version ${R}` });
  sheets.forEach((sh, i) => {
    const sel = sh.id === sheet.id;
    strip.append(h('button', { class: 'sheet-tab' + (s.kbd && sel ? ' kbd-focus' : ''), type: 'button', role: 'tab', id: 'tab-' + sh.id, 'data-sheet': sh.id,
      'aria-selected': String(sel), 'aria-controls': 'sheet-panel', tabindex: sel ? '0' : '-1',
      onclick: () => pickSheet(sh.id, false), onkeydown: (e) => tabKeys(e, i, sheets) },
      sh.hidden ? icon('eyeoff') : sh.chart ? icon('chart') : null,
      h('span', null, sh.name), sh.badges.map(([t, c]) => h('span', { class: 'badge ' + c }, t))));
  });
  if (loading) {
    body.append(stage(h('div', { class: 'plate' }, h('span', null, COPY.reading)), h('div', { class: 'plate' }, h('span', null, COPY.reading)), SHEET_FILE));
  } else {
    body.append(strip);
    const st = stage(sheetPane(sheet, 'before'), sheetPane(sheet, 'after'), SHEET_FILE);
    st.id = 'sheet-panel'; st.classList.add('is-grid'); st.setAttribute('role', 'tabpanel'); st.setAttribute('aria-labelledby', 'tab-' + sheet.id);
    body.append(st);
  }
  const side = h('div', null);
  let count = 0;
  if (loading) side.append(h('p', { class: 'diff-loading' }, COPY.reading));
  else if (variant === 'same') side.append(h('p', { class: 'diff-summary' }, COPY.noValue));
  else if (variant === 'hostile') { count = 7; side.append(h('p', { class: 'diff-summary' }, '4 cells changed, 1 added, 1 removed. 1 sheet renamed.')); }
  else { count = 9; side.append(h('p', { class: 'diff-summary' }, '4 cells changed, 1 added, 1 removed. 1 sheet added, 1 removed, 1 renamed.')); }
  if (!loading) {
    side.append(h('p', { class: 'diff-scope' }, COPY.sheetScope));
    if (V.changes.length) side.append(changeRows(V.changes, 200, goChange));
  }
  const sheetName = sheet.name;
  parts.push(h('div', { class: 'diff-shell' }, toolbar(COPY.sheetLabel, { note: loading ? COPY.loading : `The left grid is version ${L}, the right grid is version ${R}, the current version.`, navTotal: loading ? 0 : V.changes.length }),
    h('div', { class: 'diff-row' }, body, sidebar(count, side))));
  void sheetName;
  return parts;
}

function buildViewer() {
  const dev = $('#device');
  dev.dataset.frame = V.frame;
  const parts = V.fmt === 'taskbar' ? buildTaskbar() : V.fmt === 'docx' ? buildDocx() : V.fmt === 'epub' ? buildEpub() : buildXlsx();
  dev.replaceChildren(h('div', { class: 'viewer' }, parts));
  if (V.fmt === 'xlsx' && V.select) selectCell(V.select, !!V.st.kbd);
  wireSync();
  requestAnimationFrame(revealCurrent);
}

function go(key) {
  const [k] = String(key).split('~');
  const st = STATES.find((s) => s.key === k) || STATES[0];
  delete document.body.dataset.ready;
  document.documentElement.dataset.theme = themeOverride || st.theme || 'light';
  V = { st, fmt: st.fmt, frame: frameOverride || st.frame || 'full', layout: st.layout || 'split', split: st.split || 50,
    current: st.phase === 'loading' || st.variant ? -1 : 0, drawer: !!st.drawer, select: st.select || null, sheet: st.sheet || 'q3', changes: [] };
  if (st.variant === 'stores' || st.variant === 'hostile') V.current = 0;
  if (st.sheet && st.sheet !== 'q3' && st.variant !== 'hostile') V.current = -1;
  history.replaceState(null, '', '#' + st.key);
  renderChrome();
  buildViewer();
  raf2(() => raf2(() => { document.body.dataset.ready = st.key; }));
}
// '#KEY' picks a state; '#KEY~dark' and '#KEY~390' set the toggles for shots.
(function boot() {
  const raw = location.hash.slice(1);
  const bits = raw.split('~');
  if (bits.includes('dark')) themeOverride = 'dark';
  if (bits.includes('390')) frameOverride = '390';
  go(bits[0] || 'DC2');
})();
</script>
