<title>Relik · suggested edits on markdown and code · mock</title>
<!--
  A local, clickable interaction mock for docs/plans/suggested-edits/plan.md.
  It is not the viewer. The band, the comments sidebar, the selection offer and the
  attached popover reuse the viewer's class names and tokens
  (packages/relic-viewer/src/styles.css) and the placement rules copied from
  docs/plans/anchored-popover/mockup.html (placePopover, placeLeft, revealScrollTop,
  chooseTargetBox). Mock chrome, outside the viewer, is marked with dashed rules.

  Fixtures, all from this repository:
  - Markdown: a short publishing guide built from README.md (Connecting the MCP
    server, What is honest about the claim). One bold run, one link, one inline code
    span, so a selection that crosses markup stores its source slice.
  - Code: lines 51 to 79 of packages/relic-format/src/comments.ts, with their real
    line numbers.
  - The near limit replacement is README.md, What is honest about the claim,
    trimmed to 2026 bytes.
  - People: Priya, Marcus and Jason are readers. Dana is the publisher.

  Art direction: none new. The accession band, the patina primary, square ruled panels,
  Charter for comment text, monospace for coordinates and source, --diff-added and
  --diff-removed for inserted and removed text are the viewer's own. Rejected: a
  highlighter fill for pending marks (a quiet patina underline instead), an Accept
  button anywhere in the browser (accepting is a publisher machine action), and any
  colour or icon the viewer lacks.

  The preview is computed, not drawn: every state below renders from the source text
  and the suggestion list through one function, so the same inputs give the same
  page for every reader. Everything stays in this page and its localStorage.
-->

/* The mode strip is the band's second row: one segmented control, and in Reading the
   local preview switch. It holds nothing else, so it survives the narrowest frame. */
.sg-strip { position: relative; z-index: 9; flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: .45rem 1rem; min-height: 2.6rem; padding: .35rem 1rem; background: var(--surface); border-bottom: 1px solid var(--rule); font-size: .8rem; }

    const ops = this.preview ? previewOps(units, this.choices).map((o) => trimOp(o, this.src)) : [];
    const marks = [], carets = [];
    if (!this.preview) {
      for (const u of units) {
        const reps = this.legacy ? u.entries : u.entries.filter((en) => en.mode === 'replace');
        if (reps.length) marks.push({ s: Math.min(...reps.map((en) => en.s)), e: Math.max(...reps.map((en) => en.e)), uid: u.id });
        if (!this.legacy) for (const en of u.entries) if (en.mode !== 'replace') carets.push({ at: en.at, uid: u.id, created: en.created, author: en.sugs[0].author });
      }
    }
    const markClass = this.legacy ? 'relic-text-mark' : this.mode === 'suggesting' ? 'sg-anchor' : 'sg-mark';
    const ctx = { ops, marks, carets, markClass, caretMode: this.mode === 'suggesting' ? 'anchor' : 'button' };
    this.doc.replaceChildren();
    if (this.cls === 'code') {
      const box = h('pre', { class: 'sg-code', 'aria-label': `${SPECS.code.filename}, lines ${CODE_FIRST} to ${CODE_FIRST + this.model.length - 1}` });
      const inner = h('div', { class: 'sg-code-inner' });
      box.append(inner);
      if (this.preview) this.renderCodePreview(inner, ops);
      else for (const b of this.model) {
        const lc = h('span', { class: 'lc' });
        this.renderInline(lc, b, ctx);
        inner.append(h('span', { class: 'cl' }, h('span', { class: 'ln' }, String(b.ln)), lc));
      }
      this.doc.append(box);
    } else {
      for (const b of this.model) {
        const el = h(b.tag);
        this.renderInline(el, b, ctx);
        this.doc.append(el);
      }
    }
    this.decorate();
    this.renderStrip();
    this.updateCount();
  }

  renderInline(container, block, ctx) {
    const src = this.src;
    const pieces = block.pieces;
    if (!pieces.length) { container.append(h('span', { 'data-s': block.s }, '')); return; }
    const items = [];
    for (const o of ctx.ops) if (o.text) items.push({ at: o.at, kind: 'ins', o, replace: o.replace, created: o.created });
    for (const c of ctx.carets) items.push({ at: c.at, kind: 'caret', c, replace: false, created: c.created });
    const placed = [];
    for (const it of items) {
      if (it.at < block.s || it.at > block.e) continue;
      let pi = pieces.findIndex((p) => p.s <= it.at && it.at < p.e);
      if (pi >= 0) { placed.push({ ...it, pi, pos: it.at, end: false }); continue; }
      for (let k = pieces.length - 1; k >= 0; k -= 1) if (pieces[k].e <= it.at) { pi = k; break; }
      if (pi >= 0) placed.push({ ...it, pi, pos: pieces[pi].e, end: true });
      else placed.push({ ...it, pi: 0, pos: pieces[0].s, end: false });
    }
    placed.sort(insertOrder);
    const emit = (pi, pos, end) => {
      for (const it of placed) {
        if (it.pi !== pi || it.pos !== pos || it.end !== end) continue;
        if (it.kind === 'ins') container.append(h('ins', { class: 'sg-ins', 'data-unit': it.o.uid }, it.o.text));
        else if (ctx.caretMode === 'button') container.append(h('button', { type: 'button', class: 'sg-caret', 'data-unit': it.c.uid, 'aria-label': `Suggested insertion by ${it.c.author}` }));
        else container.append(h('span', { class: 'sg-anchor', 'data-unit': it.c.uid }));
      }
    };
    pieces.forEach((p, pi) => {
      const cuts = new Set([p.s, p.e]);
      for (const o of ctx.ops) for (const v of [o.s, o.e]) if (v > p.s && v < p.e) cuts.add(v);
      for (const m of ctx.marks) for (const v of [m.s, m.e]) if (v > p.s && v < p.e) cuts.add(v);
      for (const it of placed) if (it.pi === pi && it.pos > p.s && it.pos < p.e) cuts.add(it.pos);
      const pts = [...cuts].sort((a, b) => a - b);
      for (let k = 0; k < pts.length - 1; k += 1) {
        const a = pts[k], b = pts[k + 1];
        emit(pi, a, false);
        let node = h('span', { 'data-s': a }, src.slice(a, b));
        const mk = ctx.marks.find((m) => m.s <= a && b <= m.e);
        if (mk) node = h('span', { class: ctx.markClass, 'data-unit': mk.uid }, node);
        const del = ctx.ops.find((o) => o.e > o.s && o.s <= a && b <= o.e);
        if (del) node = h('del', { class: 'sg-del', 'data-unit': del.uid }, node);
        if (p.wrap) {
          if (p.wrap.tag === 'a') node = h('a', { href: p.wrap.href }, node);
          else if (p.wrap.tag) node = h(p.wrap.tag, null, node);
          else node = h('span', { class: p.wrap.cls }, node);
        }
        container.append(node);
      }
      emit(pi, p.e, true);
    });
  }

  /* Code preview: a suggestion replaces whole lines, shown as removed rows then added rows. */
  renderCodePreview(inner, ops) {
    const lines = this.model;
    const lineOf = (pos) => lines.findIndex((b) => pos >= b.s && pos <= b.e);
    const spans = [];
    for (const o of ops) {
      const l1 = lineOf(o.s), l2 = lineOf(o.e > o.s ? o.e - 1 : o.e);
      const hit = spans.find((g) => !(l2 < g.l1 || l1 > g.l2));
      if (hit) { hit.l1 = Math.min(hit.l1, l1); hit.l2 = Math.max(hit.l2, l2); hit.ops.push(o); } else spans.push({ l1, l2, ops: [o] });
    }
    for (let k = 0; k < lines.length; k += 1) {
      const g = spans.find((x) => x.l1 === k);
      if (!g) {
        const lc = h('span', { class: 'lc' }, h('span', { class: 'sg-sign', 'aria-hidden': 'true' }, ' '));
        this.renderInline(lc, lines[k], { ops: [], marks: [], carets: [] });
        inner.append(h('span', { class: 'cl' }, h('span', { class: 'ln' }, String(lines[k].ln)), lc));
        continue;
      }
      const uid = g.ops[0].uid;
      for (let j = g.l1; j <= g.l2; j += 1) {
        inner.append(h('span', { class: 'cl is-del' }, h('span', { class: 'ln' }, String(lines[j].ln)),
          h('span', { class: 'lc sg-row', 'data-unit': uid }, h('span', { class: 'sg-sign', 'aria-hidden': 'true' }, '-'), h('del', { class: 'sg-del-line' }, this.src.slice(lines[j].s, lines[j].e)))));
      }
      const next = applyOps(this.src, lines[g.l1].s, lines[g.l2].e, g.ops).split('\n');
      next.forEach((t, j) => {
        inner.append(h('span', { class: 'cl is-add' }, h('span', { class: 'ln', 'aria-hidden': 'true' }, ''),
          h('span', { class: 'lc sg-row', 'data-unit': uid }, h('span', { class: 'sg-sign', 'aria-hidden': 'true' }, '+'), h('ins', { class: 'sg-ins-line' }, t))));
      });
      k = g.l2;
    }
  }

  /* Marks get one keyboard stop per suggestion, a label, and the active ring. */
  decorate() {
    const seen = new Set();
    for (const el of this.doc.querySelectorAll('[data-unit]')) {
      const uid = el.dataset.unit;
      const u = this.unitById[uid];
      if (!u) continue;
      if (el.classList.contains('sg-anchor')) continue;
      if (el.tagName !== 'BUTTON' && !seen.has(uid)) {
        seen.add(uid);
        el.setAttribute('tabindex', '0');
        el.setAttribute('role', 'button');
        el.setAttribute('aria-label', this.unitLabel(u));
      } else if (el.tagName === 'BUTTON') seen.add(uid);
    }
    this.doc.querySelectorAll('.sg-margin').forEach((m) => m.remove());
    if (this.mode === 'suggesting' && !this.legacy) {
      for (const u of this.units) {
        this.doc.append(h('button', { type: 'button', class: 'sg-margin', 'data-unit': u.id, 'aria-label': this.unitLabel(u), title: this.unitLabel(u) }));
      }
      this.positionMargins();
    }
    this.paintActive();
  }
  positionMargins() {
    if (!this.doc) return;
    const dr = this.doc.getBoundingClientRect();
    for (const m of this.doc.querySelectorAll('.sg-margin')) {
      const el = [...this.doc.querySelectorAll(`[data-unit="${m.dataset.unit}"]:not(.sg-margin)`)][0];
      const rect = el ? [...el.getClientRects()].find((r) => r.height > 0) || el.getBoundingClientRect() : null;
      if (!rect) continue;
      const lh = parseFloat(getComputedStyle(this.doc).lineHeight) || 24;
      m.style.top = `${rect.top - dr.top + Math.max(0, (rect.height - lh) / 2)}px`;
      m.style.height = `${Math.min(lh, 28)}px`;
    }
  }
  unitLabel(u) {
    if (u.group) return `${this.groupLabel(u)}. Open to compare.`;
    const en = u.entries[0];
    return `${KIND_LABEL[kindOf(en)]} suggested by ${listNames(en.sugs.map((s) => s.author))}`;
  }
  groupLabel(u) {
    if (this.cls === 'code') {
      const ls = new Set();
      for (const en of u.entries) {
        const a = this.model.findIndex((b) => en.s >= b.s && en.s <= b.e), z = this.model.findIndex((b) => en.e >= b.s && en.e <= b.e);
        for (let k = a; k <= z; k += 1) ls.add(this.model[k].ln);
      }
      const nums = [...ls].sort((a, b) => a - b);
      const where = nums.length === 1 ? `line ${nums[0]}` : `lines ${nums[0]} to ${nums[nums.length - 1]}`;
      return `${u.entries.length} suggestions on ${where}`;
    }
    return `${u.entries.length} suggestions on this sentence`;
  }
  paintActive() {
    for (const el of this.doc.querySelectorAll('.is-active')) el.classList.remove('is-active');
    if (!this.active) return;
    for (const el of this.doc.querySelectorAll(`[data-unit="${this.active}"]`)) el.classList.add('is-active');
    for (const li of this.thread.querySelectorAll('[data-card]')) li.classList.toggle('is-active', li.dataset.card === this.active);
  }
  updateCount() { if (this.countBadge) this.countBadge.textContent = String(this.sugs.length + Object.values(this.replies).reduce((n, r) => n + r.length, 0)); }

  /* ---------- cards ---------- */
  diffFor(en, { muted = false } = {}) {
    const quote = this.cls === 'code' ? en.quote : stripMd(en.quote);
    const kind = kindOf(en);
    const text = en.text;
    if (this.cls === 'code') return this.blockFor(en, { muted });
    const p = h('p', { class: 'sg-diff' });
    if (muted) { p.append(h('span', { class: 'sg-muted' }, quote)); if (text) p.append(' ', h('ins', { class: 'sg-ins' }, text.trim())); return p; }
    if (kind === 'replace') {
      /* Word level, as the preview marks it: the shared words stay plain context. */
      const t = trimOp({ s: 0, e: quote.length, at: quote.length, text, replace: true }, quote);
      if (t.s > 0) p.append(quote.slice(0, t.s));
      if (t.e > t.s) p.append(h('del', { class: 'sg-del' }, quote.slice(t.s, t.e)));
      if (t.text) p.append(h('ins', { class: 'sg-ins' }, t.text));
      if (t.e < quote.length) p.append(quote.slice(t.e));
    }
    else if (kind === 'delete') p.append(h('del', { class: 'sg-del' }, quote));
    else if (kind === 'after') p.append(quote, h('ins', { class: 'sg-ins' }, text));
    else p.append(h('ins', { class: 'sg-ins' }, text), quote);
    return p;
  }
  /* A GitHub style suggestion block: the touched lines out, the new lines in. */
  blockFor(en, { muted = false } = {}) {
    const src = CODE_SRC;
    const lines = parseCode(src, CODE_FIRST);
    const r = resolve(en, src) || { s: 0, e: 0 };
    const o = opFor({ s: r.s, e: r.e, mode: en.mode, text: en.text, created: 0 });
    const l1 = lines.findIndex((b) => o.s >= b.s && o.s <= b.e);
    const l2 = lines.findIndex((b) => (o.e > o.s ? o.e - 1 : o.e) >= b.s && (o.e > o.s ? o.e - 1 : o.e) <= b.e);
    const next = applyOps(src, lines[l1].s, lines[l2].e, [o]).split('\n');
    const block = h('div', { class: 'sg-block', role: 'table', 'aria-label': 'Suggested change' }, h('div', { class: 'sg-block-head' }, 'Suggested change'));
    for (let k = l1; k <= l2; k += 1) block.append(h('div', { class: `sg-block-row ${muted ? 'is-muted' : 'is-del'}`, role: 'row' }, h('span', { class: 'n' }, String(lines[k].ln)), h('span', { class: 'g', 'aria-hidden': 'true' }, '-'), h('span', { class: 't' }, src.slice(lines[k].s, lines[k].e))));
    next.forEach((t, j) => block.append(h('div', { class: 'sg-block-row is-add', role: 'row' }, h('span', { class: 'n' }, String(lines[l1].ln + j)), h('span', { class: 'g', 'aria-hidden': 'true' }, '+'), h('span', { class: 't' }, t))));
    return block;
  }
  statusFor(sg) {
    const map = {
      pending: ['Pending', 'clock'],
      seen: ['Seen by the publisher, not applied yet', 'eye'],
      accepted: ['Accepted in v4', 'check'],
      superseded: [`Superseded by ${sg.by}'s suggestion`, 'minus'],
      outdated: ['Outdated', 'flag'],
      nottaken: ['Not taken', 'reject'],
    };
    const [text, ic] = map[sg.status];
    const out = [h('p', { class: 'sg-status', 'data-status': sg.status }, icon(ic), text)];
    if (sg.status === 'outdated') out.push(h('p', { class: 'sg-status-detail' }, 'The quoted text is not in v4.'));
    if (sg.status === 'nottaken') out.push(h('p', { class: 'sg-status-detail' }, `${PUBLISHER}: ${sg.reason}`));
    return out;
  }
  head(sg) {
    return h('div', { class: 'comment-head' }, h('span', { class: 'comment-author' }, sg.author), sg.author === PUBLISHER ? h('span', { class: 'comment-badge' }, 'Publisher') : null, h('span', { class: 'comment-time' }, ago(sg.mins)));
  }
  entryBody(en, opts = {}) {
    const lead = en.sugs[0];
    const kind = kindOf(en);
    const out = [];
    if (!opts.noHead) out.push(this.head(lead));
    out.push(h('span', { class: 'sg-kind', 'data-kind': kind }, KIND_LABEL[kind]));
    out.push(this.diffFor(en, { muted: lead.status === 'outdated' }));
    if (lead.note) out.push(h('p', { class: 'sg-note' }, lead.note));
    if (en.sugs.length > 1) out.push(h('p', { class: 'sg-also' }, `Also suggested by ${listNames(en.sugs.slice(1).map((s) => s.author))}`));
    if (en.together > 1) out.push(h('span', { class: 'sg-flag' }, `${en.together} insertions at this point`));
    return out;
  }
  unitBody(u, where = 'card') {
    if (!u.group) return [...this.entryBody(u.entries[0]), ...this.statusFor(u.entries[0].sugs[0])];
    const chosen = chosenOf(u, this.choices);
    const fs = h('fieldset', { class: 'sg-choices' }, h('legend', null, this.groupLabel(u)));
    for (const en of u.entries) {
      const input = h('input', { type: 'radio', name: `choice-${where}-${u.id}`, value: en.id, 'aria-label': `${en.sugs[0].author}, ${KIND_LABEL[kindOf(en)]}` });
      input.checked = en.id === chosen.id;
      input.addEventListener('change', () => this.choose(u.id, en.id));
      fs.append(h('label', { class: 'sg-choice' }, input, h('div', null, ...this.entryBody(en), ...(en.sugs[0].status === 'pending' ? [] : this.statusFor(en.sugs[0])))));
    }
    fs.append(h('p', { class: 'sg-fine' }, `${this.preview ? 'Your preview shows the one you choose' : 'Your choice drives only your preview'}. The publisher's choice is what gets applied.`));
    return [fs, ...this.statusFor({ status: 'pending' })];
  }
  repliesFor(uid) {
    const list = this.replies[uid] || [];
    const out = [];
    if (list.length) out.push(h('ul', { class: 'comment-replies' }, list.map((r) => h('li', { class: 'comment comment-reply' }, this.head(r), h('div', { class: 'comment-body' }, h('p', null, r.text))))));
    if (this.replyOpen === uid) {
      const field = h('textarea', { class: 'popover-field', 'aria-label': 'Reply', placeholder: 'Reply to this suggestion' });
      out.push(h('div', { class: 'sg-reply' }, field));
      setTimeout(() => field.focus({ preventScroll: true }), 0);
      this.replyField = field;
    }
    return out;
  }
  cardTools(uid) {
    if (this.replyOpen === uid) {
      return h('div', { class: 'popover-tools' },
        h('button', { type: 'button', class: 'popover-action is-quiet', onclick: () => { this.replyOpen = null; this.refreshCard(); } }, 'Cancel'),
        h('button', { type: 'button', class: 'popover-action is-primary', onclick: () => this.postReply(uid) }, 'Post reply'));
    }
    return h('div', { class: 'popover-tools' },
      h('button', { type: 'button', class: 'popover-action', onclick: () => { this.replyOpen = uid; this.refreshCard(); } }, 'Reply'),
      h('button', { type: 'button', class: 'popover-action is-quiet', onclick: () => this.closePanel({ restore: true }) }, 'Close'));
  }
  postReply(uid) {
    const text = (this.replyField?.value || '').trim();
    if (!text) return;
    (this.replies[uid] ||= []).push({ author: READER, mins: 0, text });
    this.replyOpen = null;
    this.updateCount();
    this.renderThread();
    this.refreshCard();
  }
  legacyItems(u) {
    const out = [];
    for (const en of u.entries) for (const sg of en.sugs) {
      const q = this.cls === 'code' ? sg.quote : stripMd(sg.quote);
      const t = sg.text.trim();
      const body = sg.mode === 'replace' ? (t ? `Suggested: replace '${q}' with '${t}'` : `Suggested: delete '${q}'`)
        : `Suggested: insert '${t}' ${sg.mode === 'after' ? 'after' : 'before'} '${q}'`;
      out.push(h('li', { class: 'comment' }, this.head(sg), h('div', { class: 'comment-body' }, h('p', null, body)), h('p', { class: 'sg-legacy-note' }, 'This page cannot show this suggestion as an edit.')));
    }
    return out;
  }

  openCard(uid, { reveal = true, focus = false } = {}) {
    const u = this.unitById[uid];
    if (!u) return;
    this.closePanel();
    this.active = uid;
    this.paintActive();
    let panel;
    if (this.legacy) {
      panel = h('div', { class: 'popover popover-card sg-card', role: 'dialog', 'aria-label': 'Comments on this text', tabindex: '-1' },
        h('div', { class: 'sg-card-body' }, h('ul', { class: 'popover-thread' }, this.legacyItems(u))),
        h('div', { class: 'popover-tools' }, h('button', { type: 'button', class: 'popover-action is-quiet', onclick: () => this.closePanel({ restore: true }) }, 'Close')));
    } else {
      panel = h('div', { class: `popover popover-card sg-card${this.cls === 'code' ? ' is-code' : ''}`, role: 'dialog', 'aria-label': this.unitLabel(u), tabindex: '-1' },
        h('div', { class: 'sg-card-body' }, this.unitBody(u), this.repliesFor(uid)), this.cardTools(uid));
    }
    this.returnFocus = document.activeElement && this.root.contains(document.activeElement) ? document.activeElement : null;
    this.openPanel(panel, 'card', () => this.unitBox(uid), reveal);
    if (focus) panel.focus({ preventScroll: true });
  }
  refreshCard() {
    if (this.panelKind !== 'card' || !this.active) return;
    const uid = this.active;
    const st = this.host.scrollTop;
    this.openCard(uid, { reveal: false });
    this.host.scrollTop = st;
    this.place();
  }
  unitBox(uid) {
    const els = [...this.doc.querySelectorAll(`[data-unit="${uid}"]`)].filter((el) => !el.classList.contains('sg-margin'));
    const rects = [];
    for (const el of els) for (const r of el.getClientRects()) if (nonEmpty(r)) rects.push(rectOf(r));
    if (!rects.length) {
      const m = this.doc.querySelector(`.sg-margin[data-unit="${uid}"]`);
      if (!m) return null;
      rects.push(rectOf(m.getBoundingClientRect()));
    }
    const full = union(rects);
    return toContent(chooseTargetBox(full, rects[0], this.host.clientHeight), this.host);
  }

  /* ---------- the panel layer ---------- */
  openPanel(panel, kind, anchor, reveal) {
    this.host.append(panel);
    this.panel = panel;
    this.panelKind = kind;
    this.anchor = anchor;
    if (reveal) {
      /* Documents take the panel above the target, so scroll to make that room when the
         page can give it, and fall back to the shared reveal rule when it cannot. */
      const box = anchor();
      if (box) {
        const ph = panel.offsetHeight, H = this.host.clientHeight, maxS = Math.max(0, this.host.scrollHeight - H);
        const fits = (st) => box.top - GAP - ph >= st + MARGIN - 0.5 && box.top + box.height <= st + H - MARGIN;
        const aboveTop = clamp(box.top - GAP - ph - MARGIN, 0, maxS);
        if (!fits(this.host.scrollTop)) this.host.scrollTop = fits(aboveTop) ? aboveTop : revealScrollTop(box, Math.min(ph, H * 0.7), this.host);
      }
    }
    this.place();
  }
  place() {
    const p = this.panel;
    if (!p) return;
    p.style.maxHeight = '';
    p.style.left = '0px';
    p.style.top = '0px';
    const box = this.anchor();
    if (!box) return;
    const placed = placePopover(box, { width: p.offsetWidth, height: p.offsetHeight }, this.host);
    p.style.left = `${placed.left}px`;
    p.style.top = `${placed.top}px`;
    if (placed.maxHeight !== undefined) p.style.maxHeight = `${placed.maxHeight}px`;
    p.dataset.side = placed.side;
  }
  closePanel({ restore = false } = {}) {
    if (this.panel) this.panel.remove();
    const wasCard = this.panelKind === 'card';
    this.panel = null;
    this.panelKind = null;
    this.composer = null;
    if (wasCard) { this.active = null; this.replyOpen = null; this.paintActive(); }
    if (window.CSS && CSS.highlights) CSS.highlights.delete('sg-pending');
    if (restore && this.returnFocus && this.returnFocus.isConnected) this.returnFocus.focus({ preventScroll: true });
  }

  /* ---------- the thread sidebar ---------- */
  renderThread() {
    this.thread.classList.toggle('is-open', this.sidebar);
    this.commentsButton?.setAttribute('aria-pressed', String(this.sidebar));
    if (!this.sidebar) { this.thread.replaceChildren(); return; }
    const list = h('ul', { class: 'thread-list' });
    if (this.legacy) {
      for (const u of this.units || []) for (const li of this.legacyItems(u)) { li.dataset.card = u.id; li.addEventListener('click', () => this.openCard(u.id)); list.append(li); }
    } else if (this.version === 4) {
      const order = { pending: 0, seen: 1, nottaken: 2, outdated: 3, superseded: 4, accepted: 5 };
      const groups = new Map();
      for (const sg of this.sugs) {
        const k = `${sg.quote}|${sg.mode}|${sg.text}|${sg.status}`;
        if (!groups.has(k)) groups.set(k, { quote: sg.quote, prefix: sg.prefix, suffix: sg.suffix, mode: sg.mode, text: sg.text, sugs: [] });

  document.getElementById('mk-next').append(icon('chevron'));
  const step = (d) => { const i = STATES.findIndex((s) => s.id === store.state); go(STATES[(i + d + STATES.length) % STATES.length].id); };
  document.getElementById('mk-prev').addEventListener('click', () => step(-1));
  document.getElementById('mk-next').addEventListener('click', () => step(1));
  const drawer = document.getElementById('mk-drawer');
  const opener = document.getElementById('mk-open');
  const openDrawer = () => { drawer.style.setProperty('--mk-drawer-top', `${document.getElementById('mk-bar').getBoundingClientRect().bottom}px`); drawer.hidden = false; opener.setAttribute('aria-expanded', 'true'); };
  function closeDrawer() { drawer.hidden = true; opener.setAttribute('aria-expanded', 'false'); }
  opener.addEventListener('click', () => (drawer.hidden ? openDrawer() : closeDrawer()));
  document.getElementById('mk-close').addEventListener('click', closeDrawer);
  document.getElementById('mk-reset').addEventListener('click', () => { try { localStorage.removeItem(STORE); } catch { /* storage refused */ } Object.assign(store, { state: 'r-1', frame: 'fit', theme: 'system' }); applyTheme(); applyFrame(); closeDrawer(); go('r-1'); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !drawer.hidden) closeDrawer(); });
  window.addEventListener('resize', () => applyFrame());
}

/* ================================================================ the proof probe */
window.mockGo = go;
window.mockStates = () => STATES.map((s) => ({ id: s.id, label: s.label, group: s.group, title: s.title, frame: s.frame || null }));
window.mockProbe = () => {
  const v = viewer;
  const out = { state: store.state, ready: document.documentElement.dataset.mockReady === '1', error: document.documentElement.dataset.mockError || null, overflowX: document.documentElement.scrollWidth - document.documentElement.clientWidth };
  if (!v) return out;
  const dev = device.getBoundingClientRect();
  out.panel = v.panel ? (() => { const r = v.panel.getBoundingClientRect(); return { kind: v.panelKind, left: r.left - dev.left, top: r.top - dev.top, right: r.right - dev.left, bottom: r.bottom - dev.top, width: r.width, height: r.height }; })() : null;
  out.device = { width: dev.width, height: dev.height };
  out.docText = v.doc.textContent;
  out.hostOverflowX = v.host.scrollWidth - v.host.clientWidth;
  out.rootOverflowX = v.root.scrollWidth - v.root.clientWidth;
  out.stripOverflowX = v.strip ? v.strip.scrollWidth - v.strip.clientWidth : 0;
  out.barOverflowX = v.root.querySelector('.bar').scrollWidth - v.root.querySelector('.bar').clientWidth;
  return out;
};

buildChrome();
applyTheme();
applyFrame();
go(store.state);
})();
</script>
