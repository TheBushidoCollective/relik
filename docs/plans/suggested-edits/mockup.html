<title>Relik · inline suggested edits · mock</title>
<!--
  A local, clickable mock for docs/plans/suggested-edits/plan.md, section 3.6. It is not the
  viewer: the band, the mode strip, the reading surface, the attached card, the selection
  offer and the comments sidebar reuse the viewer's tokens and class vocabulary from
  packages/relic-viewer/src/styles.css. Mock chrome (the state bar, the state list, the
  simulated keyboard, mock-only notes) is drawn with dashed rules so it never passes for
  the product.

  Interaction model, from plan.md 2.1 and 3.4:
  - Suggesting is an explicit toggle in Relic's chrome. While it is on, the document is
    contenteditable and every beforeinput is intercepted: typing, Backspace, Delete, paste
    and Enter update one draft per block, drawn as <del>/<ins> owned by the viewer.
  - The draft posts when the caret leaves its block (selectionchange), when focus leaves
    the document (focusout), when Suggesting turns off, or on Cmd/Ctrl+Enter. Esc cancels.
  - Every post shows a receipt in Relic's chrome with the exact text and Undo. It never
    takes focus.
  - Hovering a tracked change opens its card with replies and a reply box. The applied
    view is read-only and offers Reply and Copy on edited text.
  - Peers are scripted: "Replay peer activity" in the state bar runs Priya and Marcus.
    No keystrokes from a peer are ever drawn, only carets and the incoming indicator.

  Fixtures (fictional): a markdown spec for offline sync in a field-crew app and a
  TypeScript file from the same app. Scope is markdown and code (plan 2.1.8); HTML and JSX
  are deferred. Readers: Jason (you), Priya, Marcus, Lena, and one hostile reader, Sam.
  Publisher: Dana.

  Art direction: none new. Accession band, patina for interaction, oxide for refusals and
  limits, square ruled panels, Charter for document and comment text, monospace for
  coordinates, counters and source. Rejected: a margin gutter of suggestion markers (the
  change is drawn in the text now, per 2.1.2), a floating compose card (2.1.1 retired it),
  any Accept button in the browser (2.1.6: the publisher's agent applies), rounded corners
  and glow (the viewer has neither), colour per author on the tracked change itself (the
  peer colours are for live carets only, so a struck word never reads as a person).

  Not simulated: IME composition, the network, sealing, the presence relay. The browser's
  native title tooltip is drawn as a dashed mock note where a state depends on it (A1).
-->
<style>

/* ---------- mock chrome: not the viewer, drawn with dashed rules ---------- */
.mk-bar { flex: none; position: relative; z-index: 60; display: flex; align-items: center; gap: .35rem; height: 36px; padding: 0 .5rem; min-width: 0; background: var(--surface); border-bottom: 1px dashed var(--rule-strong); font: 11px/1.3 var(--mono); }

.mk-state b { flex: none; min-width: 3.4rem; font: 600 11px/1.5 var(--mono); color: var(--patina-ink); }

.mk-controls span { color: var(--ink-soft); font: 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.mk-floor { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; align-items: flex-start; overflow: hidden; }
.mk-device { container: viewer / inline-size; position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--ground); }
.mk-device[data-frame="390"] { width: min(390px, 100%); height: min(844px, 100%); box-shadow: 0 0 0 1px var(--rule-strong); }
.mk-device[data-frame="320"] { width: min(320px, 100%); height: min(480px, 100%); box-shadow: 0 0 0 1px var(--rule-strong); }
.mk-keyboard { flex: none; position: relative; height: 336px; border-top: 1px dashed var(--rule-strong); background: repeating-linear-gradient(90deg, transparent 0 4px, var(--rule) 4px 5px, transparent 5px 36px), var(--ground); background-size: 36px 52px; }
.mk-keyboard::before { content: ""; position: absolute; inset: 52px 0 0; background: repeating-linear-gradient(180deg, transparent 0 46px, var(--ground) 46px 52px); }
.mk-keyboard-label { position: absolute; z-index: 1; top: 14px; left: 50%; transform: translateX(-50%); padding: .1rem .45rem; border: 1px dashed var(--rule-strong); background: var(--surface); color: var(--ink-soft); font: 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.mk-note { margin: .5rem 0 0; padding: .35rem .5rem; border: 1px dashed var(--rule-strong); color: var(--ink-soft); font: .72rem/1.4 var(--mono); }

/* ---------- the viewer, from packages/relic-viewer/src/styles.css ---------- */
.viewer { position: relative; display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; background: var(--ground); color: var(--ink); }
.bar { position: relative; z-index: 10; display: flex; align-items: stretch; flex: none; min-height: var(--bar-height); background: var(--surface); border-bottom: 1px solid var(--rule-strong); }
.mark { display: flex; align-items: center; padding: 0 1rem; font: 600 .78rem var(--mono); letter-spacing: .01em; color: var(--ink); border-right: 1px solid var(--rule); white-space: nowrap; }
.identity { display: flex; flex-direction: column; justify-content: center; gap: .1rem; padding: .4rem 1rem; min-width: 0; flex: 1; }
.filename { flex: 0 0 auto; font-size: .9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.identity-meta { display: flex; align-items: center; gap: .6rem; min-width: 0; }
.accession { min-width: 0; flex: 0 1 auto; font: .66rem var(--mono); letter-spacing: .14em; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.version-label { flex: none; display: inline-flex; align-items: center; padding: .05rem .35rem; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink-soft); font: .66rem var(--mono); letter-spacing: .06em; white-space: nowrap; }
.actions { display: flex; align-items: stretch; border-left: 1px solid var(--rule); }
.action { position: relative; display: inline-flex; align-items: center; gap: .45rem; padding: 0 .9rem; border: 0; border-right: 1px solid var(--rule); background: transparent; color: var(--ink); font-size: .82rem; text-decoration: none; cursor: pointer; white-space: nowrap; }
.actions .action:last-child { border-right: 0; }
.action:hover { background: var(--ground); color: var(--patina-ink); }
.action:focus-visible { outline: 2px solid var(--patina); outline-offset: -2px; }
.action[aria-pressed="true"] { color: var(--patina-ink); background: var(--diff-added); }
.action.marker { cursor: default; color: var(--ink-soft); }

@container viewer (max-width: 34rem) {
  .action span:not(.action-count) { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .action { padding: 0 .75rem; }
  .mark { display: none; }
  .identity { padding: .4rem .7rem; }
  .identity-meta { gap: .4rem; }
}
@container viewer (max-width: 24rem) { .action-share, .action.marker { display: none; } }

/* The mode strip: one segmented control (the Suggesting toggle, in Relic's chrome per
   plan 4.2), the applied switch, the presence chip. */
.sg-strip { flex: none; position: relative; z-index: 9; display: flex; flex-wrap: wrap; align-items: center; gap: .45rem 1rem; min-height: 2.6rem; padding: .35rem 1rem; background: var(--surface); border-bottom: 1px solid var(--rule); font-size: .8rem; }
.sg-seg { display: inline-flex; flex: none; border: 1px solid var(--rule-strong); }
.sg-seg button { display: inline-flex; align-items: center; gap: .35rem; padding: .26rem .75rem; border: 0; background: transparent; color: var(--ink); font: 600 .78rem/1.3 var(--sans); cursor: pointer; white-space: nowrap; }
.sg-seg button + button { border-left: 1px solid var(--rule-strong); }
.sg-seg button:hover { color: var(--patina-ink); background: var(--ground); }
.sg-seg button[aria-pressed="true"] { background: var(--patina); color: var(--surface); }
.sg-seg button:disabled { color: var(--ink-soft); cursor: default; background: transparent; }

.sg-switch { display: inline-flex; flex: none; align-items: center; gap: .5rem; padding: .2rem .1rem; border: 0; background: transparent; color: var(--ink); font: .8rem/1.3 var(--sans); cursor: pointer; text-align: left; }
.sg-switch:focus-visible { outline: 2px solid var(--patina); outline-offset: 2px; }
.sg-switch-box { position: relative; flex: none; width: 1.9rem; height: 1rem; border: 1px solid var(--rule-strong); background: var(--ground); }
.sg-switch-box::after { content: ""; position: absolute; top: 2px; left: 2px; width: calc(.5rem + 2px); height: calc(1rem - 6px); background: var(--ink-soft); }
.sg-switch[aria-checked="true"] .sg-switch-box { border-color: var(--patina); background: var(--diff-added); }
.sg-switch[aria-checked="true"] .sg-switch-box::after { left: auto; right: 2px; background: var(--patina); }
.sg-presence { display: inline-flex; flex: none; align-items: center; gap: .35rem; padding: .1rem .45rem .1rem .2rem; border: 1px solid var(--rule); color: var(--ink-soft); font: .7rem/1.3 var(--mono); white-space: nowrap; }
.sg-presence.is-off { padding-left: .45rem; border-color: var(--oxide); color: var(--oxide); }
.sg-presence.is-off .icon { width: 12px; height: 12px; }
.peer-dot { display: inline-grid; place-items: center; width: 1.05rem; height: 1.05rem; background: var(--c); color: var(--surface); font: 600 .62rem/1 var(--mono); }
.sg-strip-meta { margin-left: auto; min-width: 0; color: var(--ink-soft); font: .7rem/1.4 var(--mono); letter-spacing: .02em; }
.sg-strip-meta.is-note { color: var(--patina-ink); }
@container viewer (max-width: 34rem) {
  .sg-strip { padding: .35rem .6rem; gap: .4rem .6rem; }
  .sg-strip-meta:not(.is-note) { display: none; }
  .sg-strip-meta.is-note { margin-left: 0; flex-basis: 100%; }
  .sg-seg button { padding: .26rem .55rem; }
}

.viewer-main { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
.relic-row { position: relative; display: flex; flex: 1 1 auto; min-height: 0; min-width: 0; }
.stage-wrap { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; overflow: auto; }
.stage { position: relative; padding: 2rem 1.25rem 7rem; }
@container viewer (max-width: 34rem) { .stage { padding: 1.25rem .9rem 8rem; } }
.notice { display: flex; gap: .6rem; align-items: flex-start; max-width: 46rem; margin: 0 auto 1.5rem; padding: .7rem .9rem; border-left: 3px solid var(--oxide); background: var(--surface); color: var(--ink); font-size: .86rem; }
.notice.is-info { border-left-color: var(--patina); }
.notice p { margin: 0; }
.notice .icon { margin-top: .2rem; color: var(--oxide); }
.notice.is-info .icon { color: var(--patina); }

.doc { position: relative; max-width: 46rem; margin: 0 auto; }
.prose { font-family: var(--serif); font-size: 1.06rem; line-height: 1.7; }
.prose h1, .prose h2, .prose h3 { font-family: var(--sans); line-height: 1.25; margin: 2rem 0 .6rem; letter-spacing: -.01em; }
.prose h1 { font-size: 1.7rem; padding-bottom: .4rem; border-bottom: 1px solid var(--rule); margin-top: 0; }
.prose h2 { font-size: 1.32rem; }
.prose p { margin: 0 0 1.1rem; }
.prose ul { margin: 0 0 1.1rem; padding-left: 1.4rem; }
.prose li { margin: .3rem 0; }
.prose a { color: var(--patina-ink); text-decoration-thickness: 1px; text-underline-offset: 2px; }
.prose a:not([href]) { cursor: help; }
.prose blockquote { margin: 1.2rem 0; padding-left: 1rem; border-left: 2px solid var(--rule-strong); color: var(--ink-soft); }
.md-scroll { overflow-x: auto; margin: 1.2rem 0; border: 1px solid var(--rule); }
.prose table { border-collapse: collapse; width: 100%; font-family: var(--sans); font-size: .88rem; }
.prose th, .prose td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.prose th { background: var(--surface); font-weight: 600; }
[data-root] { outline: none; }
.is-suggesting [data-root][contenteditable="true"] { cursor: text; caret-color: var(--patina); }
.is-suggesting [data-ro] { cursor: not-allowed; }
[data-block].is-drafting { outline: 1px dashed color-mix(in srgb, var(--patina) 70%, transparent); outline-offset: 5px; }
[data-block].is-mirror { outline: 1px dotted var(--rule-strong); outline-offset: 4px; }

/* Tracked changes. Pending is a quiet tint plus rule; the struck text keeps its colour so
   it stays readable. Yours is dashed. A draft is a stronger tint, because it is the thing
   you are working on. */
.sg-chg { cursor: pointer; }
.sg-chg:focus-visible { outline: 2px solid var(--patina); outline-offset: 2px; }
.sg-del { background: var(--diff-removed); color: inherit; text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--oxide); }
.sg-ins { background: var(--diff-added); color: inherit; text-decoration: none; border-bottom: 2px solid var(--patina); }
.sg-del + .sg-ins { margin-left: .18em; }
.sg-chg:hover .sg-del, .sg-chg.is-active .sg-del { background: var(--diff-removed-strong); }
.sg-chg:hover .sg-ins, .sg-chg.is-active .sg-ins { background: var(--diff-added-strong); }
.sg-chg.is-mine .sg-ins { border-bottom-style: dashed; }
.sg-chg.is-mine .sg-del { text-decoration-style: dashed; }
.sg-chg.is-new .sg-ins, .sg-chg.is-new .sg-del { animation: sg-arrive 2.4s ease-out; }
@keyframes sg-arrive { 0%, 30% { outline: 2px solid var(--patina); outline-offset: 2px; } 100% { outline: 2px solid transparent; outline-offset: 2px; } }
.sg-del.is-draft { background: color-mix(in srgb, var(--oxide) 18%, transparent); }
.sg-ins.is-draft { background: color-mix(in srgb, var(--patina) 18%, transparent); border-bottom: 2px solid var(--patina); white-space: pre-wrap; }
.sg-chip { display: inline-block; margin-left: .15rem; padding: .1rem .25rem; border: 1px solid var(--patina); background: var(--surface); color: var(--patina-ink); font: 600 .6rem/1 var(--mono); letter-spacing: .02em; vertical-align: .45em; user-select: none; cursor: pointer; }
.sg-chip.is-soft { border-color: var(--rule-strong); color: var(--ink-soft); }
.sg-chip.is-fold { border-color: var(--oxide); color: var(--oxide); }
.sg-applied { background: color-mix(in srgb, var(--patina) 7%, transparent); border-bottom: 1px dotted var(--patina); }
.sg-applied-gap { display: inline-block; width: 2px; height: .9em; margin: 0 .1em; vertical-align: -.1em; background: var(--patina); opacity: .55; }
.relic-text-mark { background: color-mix(in srgb, var(--patina) 22%, transparent); border-bottom: 2px solid var(--patina); color: inherit; cursor: pointer; }
/* Older-version pages: the outcome is drawn on the change, read-only (O1). Settled
   changes that did not ship fade; the outcome chip names the state. */
.sg-chg.is-out-quiet .sg-ins, .sg-chg.is-out-quiet .sg-del { background: none; border-bottom-color: var(--rule-strong); color: var(--ink-soft); }
.sg-chg.is-out-quiet .sg-del { text-decoration-color: var(--ink-soft); }
.sg-chg.is-out-ok .sg-ins { background: var(--diff-added-strong); }
.sg-chip.is-out { border-color: var(--rule-strong); color: var(--ink-soft); text-transform: none; }
.sg-chip.is-out.is-ok { border-color: var(--patina); color: var(--patina-ink); background: var(--diff-added); }
.sg-chip.is-unposted { border-color: var(--oxide); color: var(--oxide); }
.mk-pin { position: absolute; z-index: 7; max-width: 19rem; margin: 0; pointer-events: none; background: var(--surface); }

/* The draft hint, hung under the block it belongs to. */
.sg-hint { position: absolute; z-index: 6; display: flex; flex-wrap: wrap; gap: .1rem 0; padding: .22rem .55rem; background: var(--patina); color: var(--surface); font: .7rem/1.45 var(--mono); }
.sg-hint > span + span::before { content: "·"; margin: 0 .45rem; opacity: .8; }
.sg-hint b { font-weight: 700; }
.sg-hint .is-near { padding: 0 .3rem; background: var(--surface); color: var(--oxide); font-weight: 700; }
.sg-hint .is-warn, .sg-hint .is-fold { font-weight: 700; }
.sg-hint.is-flash { background: var(--ink-soft); }

/* Peers. Colour belongs to a live caret only. */
.presence-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.peer-caret { position: absolute; width: 2px; background: var(--c); transition: left .25s, top .25s; }
.peer-flag { position: absolute; left: 0; bottom: 100%; padding: .02rem .3rem; background: var(--c); color: var(--surface); font: 600 .6rem/1.35 var(--mono); white-space: nowrap; }
.peer-typing { position: absolute; border: 1px dashed var(--c); background: color-mix(in srgb, var(--c) 9%, transparent); }
.peer-typing-tag { position: absolute; padding: .02rem .35rem; background: var(--c); color: var(--surface); font: 600 .62rem/1.35 var(--mono); white-space: nowrap; }

/* The code relic. */
.code-doc { display: grid; grid-template-columns: auto minmax(0, 1fr); max-width: 62rem; margin: 0 auto; background: var(--surface); border: 1px solid var(--rule); font: .82rem/1.6 var(--mono); }
.code-gutter { padding: .75rem 0; background: var(--ground); border-right: 1px solid var(--rule); color: var(--ink-soft); text-align: right; user-select: none; }
.code-gutter span { display: block; padding: 0 .75rem; }
.code-gutter span.is-added { color: var(--patina-ink); font-weight: 700; }
.code-body { margin: 0; padding: .75rem 1rem; overflow-x: auto; white-space: pre; tab-size: 2; font: inherit; }
.code-body .sg-ins.is-draft { white-space: pre; }
.code-body [data-block].is-drafting { outline: none; }
.tok-kw { color: var(--patina-ink); font-weight: 600; }
.tok-str, .tok-num { color: var(--oxide); }
.tok-com { color: var(--ink-soft); font-style: italic; }


/* Popovers: the viewer's one panel object, used as the selection offer, the attached card,
   the refusal and the sign-in. */

      h('span', null, 'Theme'), h('button', { type: 'button', class: 'mk-btn', 'aria-pressed': String(themeOverride == null), onclick: () => { themeOverride = null; go(V.st.key); } }, 'As specified')),
    ...groups.map((g) => [h('h3', null, g), h('ol', null, ...STATES.filter((s) => s.group === g).map((s) => h('li', null,
      h('button', { type: 'button', class: 'mk-state', 'aria-current': String(s === V.st), onclick: () => { drawerOpen = false; go(s.key); } }, h('b', null, s.id + (s.theme === 'dark' ? ' dark' : '')), h('span', null, s.title)))))]));
}

/* Exposed for the headless proof run. */
window.mock = { go, replay, states: () => STATES.map((s) => ({ key: s.key, id: s.id, frame: s.frame || 'full', theme: s.theme || 'light' })), get V() { return V; } };
go(location.hash.slice(1) || 'R1');
</script>
