name: PROOF ONLY - fake operator guard mutations
run-name: 'PROOF ONLY - isolated fake operator guard mutations'
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: 'Independently reviewed full mutation-proof workflow commit'
        type: string
        required: true
permissions:
  contents: read
jobs:
  mutation-proof:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      REVIEWED_PROOF_SHA: ${{ inputs.reviewed_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      REPOSITORY_ID: ${{ github.repository_id }}
      EVENT_NAME: ${{ github.event_name }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      ACTOR: ${{ github.actor }}
      ACTOR_ID: ${{ github.actor_id }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    steps:
      - name: Validate proof dispatch identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_PROOF_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REVIEWED_PROOF_SHA" == "$GITHUB_SHA" && "$REVIEWED_PROOF_SHA" == "$WORKFLOW_SHA" ]]
          [[ "$REPOSITORY_ID" == 1316636189 && "$EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/archie/ephemeral-operator-mutations ]]
          [[ "$WORKFLOW_REF" == TheBushidoCollective/relik/.github/workflows/deploy.yml@refs/heads/archie/ephemeral-operator-mutations && "$RUN_ATTEMPT" == 1 ]]
          [[ "$ACTOR" == jwaldrip && "$ACTOR_ID" == 43164 && "$TRIGGERING_ACTOR" == jwaldrip ]]
      - name: Checkout reviewed proof harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: proof
          persist-credentials: false
      - name: Checkout exact maintenance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 95f2a3f9f060253985d0f1ee2b5c252bffc24800
          path: candidate
          persist-credentials: false
      - name: Check candidate revision
        working-directory: candidate
        run: test "$(git rev-parse HEAD)" = 95f2a3f9f060253985d0f1ee2b5c252bffc24800
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Install frozen dependencies without lifecycle scripts
        working-directory: candidate
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run fake baselines and isolated single-guard mutations
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mutation-evidence"
          node ../proof/scripts/proof-guard-mutations.mjs ../proof/scripts/proof-metadata-generation.test.ts "$RUNNER_TEMP/mutation-evidence/results.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: maintenance-mutations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-evidence/results.json
          if-no-files-found: ignore
          retention-days: 1
