name: PROOF ONLY - fake operator build (no production access)
run-name: 'PROOF ONLY - fake operator build'

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: 'Independently reviewed full proof-workflow commit'
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Fake-only candidate build and evidence
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      REVIEWED_PROOF_SHA: ${{ inputs.reviewed_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      REPOSITORY_ID: ${{ github.repository_id }}
      EVENT_NAME: ${{ github.event_name }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Validate proof dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_PROOF_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REVIEWED_PROOF_SHA" == "$GITHUB_SHA" && "$REVIEWED_PROOF_SHA" == "$WORKFLOW_SHA" ]]
          [[ "$REPOSITORY_ID" == 1316636189 && "$EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/archie/ephemeral-operator-proof-2 ]]
          [[ "$WORKFLOW_REF" == TheBushidoCollective/relik/.github/workflows/deploy.yml@refs/heads/archie/ephemeral-operator-proof-2 && "$RUN_ATTEMPT" == 1 ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 33860caf9dc1b3f240eb7c34fd1be559fc784e2a
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact candidate and immutable application sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 33860caf9dc1b3f240eb7c34fd1be559fc784e2a
          git cat-file -e af0d7e2410076afaa356276f28f48e685be36418^{commit}
          git diff --exit-code af0d7e2410076afaa356276f28f48e685be36418 HEAD -- packages/relic-server packages/relic-format package.json bun.lock
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Install without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run fake-only controls
        run: bun test scripts/ephemeral-operator.test.ts scripts/check-maintenance-metafile.test.ts
      - name: Compile candidate and verify import closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/proof-evidence"
          bun build --compile --target=bun-linux-x64 scripts/ephemeral-operator.ts --outfile "$RUNNER_TEMP/candidate/operator" --metafile="$RUNNER_TEMP/proof-evidence/metafile.json"
          node scripts/check-maintenance-metafile.mjs "$RUNNER_TEMP/proof-evidence/metafile.json" "$RUNNER_TEMP/proof-evidence/closure.txt"
          DIGEST="$(sha256sum "$RUNNER_TEMP/candidate/operator" | cut -d ' ' -f1)"
          [[ "$DIGEST" =~ ^[a-f0-9]{64}$ ]]
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/proof-evidence/binary-sha256.txt"
          printf '%s\n' 33860caf9dc1b3f240eb7c34fd1be559fc784e2a > "$RUNNER_TEMP/proof-evidence/source-sha.txt"
      - name: Check compiled candidate refuses a fake secret without output
        shell: bash
        run: |
          set -euo pipefail
          if env -i PATH="$PATH" \
            REVIEWED_SHA=33860caf9dc1b3f240eb7c34fd1be559fc784e2a \
            GITHUB_SHA=33860caf9dc1b3f240eb7c34fd1be559fc784e2a \
            WORKFLOW_SHA=33860caf9dc1b3f240eb7c34fd1be559fc784e2a \
            WORKFLOW_REF=TheBushidoCollective/relik/.github/workflows/deploy.yml@refs/heads/archie/ephemeral-operator-maintenance \
            REPOSITORY_ID=1316636189 EVENT_NAME=workflow_dispatch \
            GITHUB_REF=refs/heads/archie/ephemeral-operator-maintenance \
            RUN_ATTEMPT=1 ACTION=delete-five RUN_ID=123 \
            MANIFEST_SECRET_NAME=RELIC_MAINTENANCE_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA \
            MAINTENANCE_MANIFEST=FAKE_PRIVATE_CANARY_DO_NOT_PRINT \
            "$RUNNER_TEMP/candidate/operator" validate >"$RUNNER_TEMP/canary-output" 2>&1; then exit 1; fi
          if grep -Fq 'FAKE_PRIVATE_CANARY_DO_NOT_PRINT' "$RUNNER_TEMP/canary-output"; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: maintenance-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-evidence/
          if-no-files-found: ignore
          retention-days: 1
