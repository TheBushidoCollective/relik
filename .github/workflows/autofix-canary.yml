name: autofix sandbox canary

on:
  workflow_dispatch:

permissions: {}

jobs:
  canary:
    if: github.ref == 'refs/heads/main' && github.repository == 'TheBushidoCollective/relik'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/autofix-sandbox.yml
    with:
      issue: 0
      fingerprint: '0000000000000000'
      fixture: regression
