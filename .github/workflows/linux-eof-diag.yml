name: linux-eof-diag

# Diagnostic only, never merged. Measures where the build-stamp test's EOF
# probe stalls on Linux under the pinned Bun, outside bun test's 5 s limit.
on:
  push:
    branches: [agent/otio-linux-eof-diag]

jobs:
  diag:
    if: github.repository == 'TheBushidoCollective/relik'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Require Linux native build prerequisites
        run: |
          set -euo pipefail
          command -v docker
          if ! command -v readelf >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends binutils
          fi
          echo "RELIC_READELF=$(command -v readelf)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build relic-mcp
        run: |
          bun --version
          bun run --cwd packages/relic-mcp build

      - name: fs.watch shared-path repro
        shell: bash
        run: |
          set -u +e
          mkdir -p diag
          for v in 1.3.14 1.4.3; do
            for i in 1 2 3; do
              mise exec bun@$v -- bun diag/fs-watch-shared-path.mjs | tee -a diag/fs-watch.jsonl
            done
          done
          for i in 1 2 3; do node diag/fs-watch-shared-path.mjs | tee -a diag/fs-watch.jsonl; done
          for v in 1.3.14 1.4.3; do
            for i in 1 2 3; do
              mise exec bun@$v -- bun diag/fs-watch-rewatch.mjs | tee -a diag/fs-rewatch.jsonl
            done
          done
          for i in 1 2 3; do node diag/fs-watch-rewatch.mjs | tee -a diag/fs-rewatch.jsonl; done

      - name: EOF probe direct runs
        shell: bash
        run: |
          set -u +e
          mkdir -p diag
          bunver=$(bun --version)
          echo "bun=$bunver" | tee -a diag/summary.txt
          run=0
          for mode in 0 0 0 1 1 1; do
            run=$((run + 1))
            start=$(date +%s%N)
            RELIC_STDIO_EOF_SUPPRESS_RESPONSE=$mode timeout 60 bun packages/relic-mcp/test/stdio-eof-path.ts \
              > "diag/eof-run$run-mode$mode.stdout.txt" 2> "diag/eof-run$run-mode$mode.stderr.txt"
            rc=$?
            end=$(date +%s%N)
            echo "eof bun=$bunver run=$run mode=$mode rc=$rc ms=$(( (end - start) / 1000000 ))" | tee -a diag/summary.txt
          done

      - name: EOF probe direct runs under Bun 1.3.14
        shell: bash
        run: |
          set -u +e
          mkdir -p diag
          bunver=$(mise exec bun@1.3.14 -- bun --version)
          echo "bun=$bunver" | tee -a diag/summary.txt
          for run in 1 2 3; do
            start=$(date +%s%N)
            RELIC_STDIO_EOF_SUPPRESS_RESPONSE=0 mise exec bun@1.3.14 -- timeout 60 bun packages/relic-mcp/test/stdio-eof-path.ts \
              > "diag/bun-1.3.14-eof-run$run.stdout.txt" 2> "diag/bun-1.3.14-eof-run$run.stderr.txt"
            rc=$?
            end=$(date +%s%N)
            echo "eof bun=$bunver run=$run mode=0 rc=$rc ms=$(( (end - start) / 1000000 ))" | tee -a diag/summary.txt
          done

      - name: Show summary
        if: always()
        run: cat diag/summary.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-eof-diag-${{ github.run_id }}
          path: diag/
