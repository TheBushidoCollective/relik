name: linux-eof-diag

# Diagnostic only, never merged. Measures where the build-stamp test's EOF
# probe stalls on Linux under the pinned Bun, outside bun test's 5 s limit.
on:
  push:
    branches: [agent/otio-linux-eof-diag]

jobs:
  diag:
    if: github.repository == 'TheBushidoCollective/relik'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Require Linux native build prerequisites
        run: |
          set -euo pipefail
          command -v docker
          if ! command -v readelf >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends binutils
          fi
          echo "RELIC_READELF=$(command -v readelf)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build relic-mcp
        run: |
          bun --version
          bun run --cwd packages/relic-mcp build

      - name: fs.watch shared-path repro
        shell: bash
        run: |
          set -u +e
          mkdir -p diag
          for v in 1.3.14 1.4.3; do
            for i in 1 2 3; do
              mise exec bun@$v -- bun diag/fs-watch-shared-path.mjs | tee -a diag/fs-watch.jsonl
            done
          done
          for i in 1 2 3; do node diag/fs-watch-shared-path.mjs | tee -a diag/fs-watch.jsonl; done
          for v in 1.3.14 1.4.3; do
            for i in 1 2 3; do
              mise exec bun@$v -- bun diag/fs-watch-rewatch.mjs | tee -a diag/fs-rewatch.jsonl
            done
          done
          for i in 1 2 3; do node diag/fs-watch-rewatch.mjs | tee -a diag/fs-rewatch.jsonl; done

      - name: EOF probe direct runs
        shell: bash
        run: |
          set -u +e
          mkdir -p diag
          bunver=$(bun --version)
          echo "bun=$bunver" | tee -a diag/summary.txt
          run=0
          for mode in 0 0 0 1 1 1; do
            run=$((run + 1))
            start=$(date +%s%N)
            RELIC_STDIO_EOF_SUPPRESS_RESPONSE=$mode timeout 60 bun packages/relic-mcp/test/stdio-eof-path.ts \
              > "diag/eof-run$run-mode$mode.stdout.txt" 2> "diag/eof-run$run-mode$mode.stderr.txt"
            rc=$?
            end=$(date +%s%N)
            echo "eof bun=$bunver run=$run mode=$mode rc=$rc ms=$(( (end - start) / 1000000 ))" | tee -a diag/summary.txt
          done

      - name: EOF probe direct runs under Bun 1.3.14
        shell: bash
        run: |
          set -u +e
          mkdir -p diag
          bunver=$(mise exec bun@1.3.14 -- bun --version)
          echo "bun=$bunver" | tee -a diag/summary.txt
          for run in 1 2 3; do
            start=$(date +%s%N)
            RELIC_STDIO_EOF_SUPPRESS_RESPONSE=0 mise exec bun@1.3.14 -- timeout 60 bun packages/relic-mcp/test/stdio-eof-path.ts \
              > "diag/bun-1.3.14-eof-run$run.stdout.txt" 2> "diag/bun-1.3.14-eof-run$run.stderr.txt"
            rc=$?
            end=$(date +%s%N)
            echo "eof bun=$bunver run=$run mode=0 rc=$rc ms=$(( (end - start) / 1000000 ))" | tee -a diag/summary.txt
          done

      - name: Baseline vs polling interleaved proof
        shell: bash
        run: |
          set -u +e
          mkdir -p diag
          for i in 1 2 3 4 5; do
            for arm in baseline polling; do
              start=$(date +%s%N)
              RELIC_STDIO_EOF_SUPPRESS_RESPONSE=0 timeout 60 bun packages/relic-mcp/test/stdio-eof-path.$arm.ts \
                > "diag/proof-$arm-mode0-$i.stdout.txt" 2> "diag/proof-$arm-mode0-$i.stderr.txt"
              rc=$?
              end=$(date +%s%N)
              ok=$(grep -c STDIO_EOF_PATH_OK "diag/proof-$arm-mode0-$i.stdout.txt")
              echo "proof arm=$arm mode=0 i=$i rc=$rc ok=$ok ms=$(( (end - start) / 1000000 ))" | tee -a diag/summary.txt
            done
          done
          for i in 1 2 3; do
            start=$(date +%s%N)
            RELIC_STDIO_EOF_SUPPRESS_RESPONSE=1 timeout 60 bun packages/relic-mcp/test/stdio-eof-path.polling.ts \
              > "diag/proof-polling-mode1-$i.stdout.txt" 2> "diag/proof-polling-mode1-$i.stderr.txt"
            rc=$?
            end=$(date +%s%N)
            e="diag/proof-polling-mode1-$i.stderr.txt"
            echo "proof arm=polling mode=1 i=$i rc=$rc accepted=$(grep -c comments_get_accepted $e) armed=$(grep -c response_suppression_armed $e) nomatch=$(grep -c 'matching JSON-RPC response' $e) ms=$(( (end - start) / 1000000 ))" | tee -a diag/summary.txt
          done

      - name: Capture ffprobe timing oracle on runner
        shell: bash
        run: |
          set -u +e
          mkdir -p diag
          sudo apt-get update >/dev/null && sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null
          ffprobe -version | head -3 | tee diag/ffprobe-version.txt
          python3 - <<'EOP'
          import pathlib
          p = pathlib.Path("scripts/generate-otio-media.sh")
          s = p.read_text()
          needle = 'raise SystemExit(f"timing oracle differs {target}; regenerate with scripts/generate-otio-media.sh")'
          assert s.count(needle) == 1
          s = s.replace(needle, 'pathlib.Path("diag/timing-oracle.computed.json").write_text(text); ' + needle)
          s = s.replace("import json", "import json, pathlib", 1)
          pathlib.Path("diag/generate-otio-media.patched.sh").write_text(s)
          EOP
          bash diag/generate-otio-media.patched.sh --check > diag/media-check.txt 2>&1; echo "media check rc=$?" | tee -a diag/summary.txt
          cp packages/relic-format/test/fixtures/otio/decoder-boundary.otiod/media/timing-oracle.json diag/timing-oracle.committed.json
          diff <(python3 -m json.tool diag/timing-oracle.committed.json) <(python3 -m json.tool diag/timing-oracle.computed.json) > diag/timing-oracle.diff; echo "oracle diff lines=$(wc -l < diag/timing-oracle.diff)" | tee -a diag/summary.txt

      - name: Show summary
        if: always()
        run: cat diag/summary.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-eof-diag-${{ github.run_id }}
          path: diag/
