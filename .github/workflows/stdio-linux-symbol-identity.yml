name: stdio Linux symbol identity

on:
  push:
    branches:
      - agent/stdio-linux-symbol-identity

# This workflow is deliberately branch-scoped and read-only. It captures an
# executable identity and symbolizes saved offsets offline; it never runs the
# full suite, strace, a downloaded Bun profile, or a release/deploy action.
permissions:
  actions: read
  contents: read

jobs:
  collect:
    if: github.repository == 'TheBushidoCollective/relik' && github.ref == 'refs/heads/agent/stdio-linux-symbol-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: jdx/mise-action@v2
        with:
          # Keep the fresh-main setup convention, then invoke the saved-run
          # Bun version explicitly below without changing mise.toml.
          install: true
          cache: true

      - name: Require offline symbolization tools and exact Bun runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v readelf >/dev/null 2>&1 || ! command -v addr2line >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends binutils
          fi
          if ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends unzip
          fi
          mise install bun@1.3.14
          mise exec bun@1.3.14 -- bun --version

      # The saved trace artifact may retain a receipt, but the original Bun
      # executable was not retained. This read-only recovery attempt lets the
      # helper prove that boundary rather than treating a fresh cache as old.
      - name: Prepare historical provenance directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/stdio-linux-historical-provenance"

      - name: Recover saved run provenance when retained
        id: historical-artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: stdio-linux-full-test-trace-39723814228
          path: ${{ runner.temp }}/stdio-linux-historical-provenance
          repository: ${{ github.repository }}
          run-id: '39723814228'
          github-token: ${{ github.token }}

      - name: Record historical provenance availability
        if: always()
        shell: bash
        run: |
          printf '{\"artifact\":\"stdio-linux-full-test-trace-39723814228\",\"download_step_outcome\":\"%s\"}\\n' \
            '${{ steps.historical-artifact.outcome }}' \
            > \"$RUNNER_TEMP/stdio-linux-historical-provenance/download-status.json\"

      - name: Collect runtime identity and symbolize saved native frames
        env:
          STDIO_LINUX_SYMBOL_IDENTITY_OUT: .artifacts/stdio-linux-symbol-identity
          STDIO_LINUX_HISTORICAL_PROVENANCE_DIR: ${{ runner.temp }}/stdio-linux-historical-provenance
        run: mise exec bun@1.3.14 -- bun .github/scripts/stdio-linux-symbol-identity.ts

      - name: Retain identity and offline symbolization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stdio-linux-symbol-identity-${{ github.run_id }}
          path: .artifacts/stdio-linux-symbol-identity
          if-no-files-found: warn
          retention-days: 30
