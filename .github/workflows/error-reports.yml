name: error reports

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Filing mode'
        type: choice
        options: [dry-run, live]
        default: dry-run

permissions: {}

jobs:
  file:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: error-report-filer
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      id-token: write
    outputs:
      autofix: ${{ steps.file.outputs.autofix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: bun install --frozen-lockfile
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.ERROR_REPORT_READER_SA }}
          token_format: access_token
          create_credentials_file: false
      - id: file
        name: Validate and file reports
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_MODE: ${{ inputs.mode || vars.ERROR_REPORTS_MODE || 'dry-run' }}
          LIVE_SINCE: ${{ vars.ERROR_REPORTS_LIVE_SINCE }}
          AUTOFIX_MODE: ${{ vars.AUTOFIX_MODE || 'off' }}
        run: |
          set -euo pipefail
          bun packages/relic-ops/bin/file-error-reports.ts \
            --entries cloud --mode "$REPORT_MODE" --live-since "$LIVE_SINCE" \
            --autofix "$AUTOFIX_MODE" --github-output "$GITHUB_OUTPUT"

  # AUTOFIX JOB: the parent will add the reusable workflow after it exists.
