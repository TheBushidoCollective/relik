name: verify

on:
  pull_request:
  workflow_call:

# Deliberately not `push: branches: [main]`.
#
# The deploy workflow calls this one as its gate, so a push to main used to
# start two runs on the same ref. They shared the concurrency group below and
# cancelled each other: every merge left a `verify` run marked cancelled, and
# the race could just as easily have killed the run that gates the deploy
# rather than the redundant standalone one. On main, deploy owns verification.
concurrency:
  group: verify-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.9.8

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          # The versions in mise.toml, not whatever the runner ships.
          install: true
          cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Validate Terraform
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      # The anchor resolution tests crop a known colour out of a known
      # coordinate to prove the region geometry is not transposed, and they
      # need a real encoder to build that fixture and to perform the crop.
      # ffmpeg is optional at runtime, and the code path that degrades
      # without it is covered by a test that deliberately does not use it, so
      # installing it here buys the pixel-exact coverage rather than hiding
      # the fallback.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Builds the viewer first, because the asset tests serve real files out
      # of its dist.
      - name: Test
        run: bun run test

      - name: Cover path
        run: |
          bun run --cwd packages/relic-mcp build
          RELIC_CHROME_PATH="$(command -v google-chrome)" bun packages/relic-mcp/test/cover-path.ts

      - name: Notify path
        run: RELIC_CHROME_PATH=none bun packages/relic-mcp/test/notify-path.ts

      # Official OpenTimelineIO 0.18.1 conformance. The generator derives
      # expected ranges from the pinned library, not from this repo's
      # evaluator. A mismatch here is a real disagreement with the standard.
      - name: Install pinned uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.22"

      - name: Install headless Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends wget ca-certificates
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --headless=new --disable-gpu --dump-dom about:blank >/dev/null

      - name: OTIO conformance
        run: |
          command -v ffmpeg >/dev/null
          command -v ffprobe >/dev/null
          command -v uv >/dev/null
          uv run --with opentimelineio==0.18.1 python3 scripts/generate-otio-fixtures.py --check
          bash scripts/generate-otio-media.sh --check

      # Loopback-only path. The script prints OTIO_PATH_OK only after the
      # browser, official reader, and fresh MCP readback all pass.
      - name: OTIO path
        env:
          RELIC_OTIO_CHROME_PATH: ${{ env.RELIC_OTIO_CHROME_PATH }}
        run: |
          bun run --cwd packages/relic-mcp build
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo "ffmpeg and ffprobe are required" >&2
            exit 1
          fi
          if ! command -v uv >/dev/null; then
            echo "pinned uv is required" >&2
            exit 1
          fi
          if [ -z "${RELIC_OTIO_CHROME_PATH:-}" ]; then
            if command -v google-chrome >/dev/null 2>&1; then
              export RELIC_OTIO_CHROME_PATH="$(command -v google-chrome)"
            elif command -v chromium >/dev/null 2>&1; then
              export RELIC_OTIO_CHROME_PATH="$(command -v chromium)"
            else
              echo "No headless Chrome found. Set RELIC_OTIO_CHROME_PATH." >&2
              exit 1
            fi
          fi
          bun packages/relic-mcp/test/otio-path.ts
