name: verify

on:
  pull_request:
  workflow_call:
  # A new workflow_dispatch is unavailable until its definition is on the
  # default branch. This short-lived, exact-branch push trigger launches the
  # bounded Linux experiment without widening normal branch coverage.
  push:
    branches:
      - agent/stdio-linux-ci-boundary

# Deliberately not `push: branches: [main]`.
#
# The deploy workflow calls this one as its gate, so a push to main used to
# start two runs on the same ref. They shared the concurrency group below and
# cancelled each other: every merge left a `verify` run marked cancelled, and
# the race could just as easily have killed the run that gates the deploy
# rather than the redundant standalone one. On main, deploy owns verification.
concurrency:
  group: verify-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.9.8

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          # The versions in mise.toml, not whatever the runner ships.
          install: true
          cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Validate Terraform
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      # The anchor resolution tests crop a known colour out of a known
      # coordinate to prove the region geometry is not transposed, and they
      # need a real encoder to build that fixture and to perform the crop.
      # ffmpeg is optional at runtime, and the code path that degrades
      # without it is covered by a test that deliberately does not use it, so
      # installing it here buys the pixel-exact coverage rather than hiding
      # the fallback.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Builds the viewer first, because the asset tests serve real files out
      # of its dist.
      - name: Test
        run: bun run test

      - name: Cover path
        run: |
          bun run --cwd packages/relic-mcp build
          RELIC_CHROME_PATH="$(command -v google-chrome)" bun packages/relic-mcp/test/cover-path.ts

      - name: Notify path
        run: RELIC_CHROME_PATH=none bun packages/relic-mcp/test/notify-path.ts

  stdio-linux-ci-boundary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/stdio-linux-ci-boundary'
    name: Stdio Linux CI boundary experiment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Assert pinned Bun runtime
        id: bun-version
        continue-on-error: true
        run: test "$(bun --version)" = '1.3.14'

      - name: Run bounded producer comparison
        id: experiment
        if: always()
        continue-on-error: true
        run: |
          bun packages/relic-mcp/test/stdio-linux-ci-boundary.ts \
            --mode experiment \
            --count 64 \
            --seed stdio-linux-ci-boundary-v1 \
            --output "$RUNNER_TEMP/stdio-linux-ci-boundary/experiment"

      - name: Falsify receipt validation
        id: falsifier
        if: always()
        continue-on-error: true
        run: |
          bun packages/relic-mcp/test/stdio-linux-ci-boundary.ts \
            --mode falsifier \
            --seed stdio-linux-ci-boundary-v1 \
            --output "$RUNNER_TEMP/stdio-linux-ci-boundary/falsifier"

      - name: Require expected diagnostic outcomes
        if: always()
        run: |
          test "${{ steps.bun-version.outcome }}" = success
          test "${{ steps.experiment.outcome }}" = success
          test "${{ steps.falsifier.outcome }}" = failure

      - name: Upload bounded diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stdio-linux-ci-boundary-${{ github.run_id }}
          path: ${{ runner.temp }}/stdio-linux-ci-boundary
          if-no-files-found: warn

  stdio-linux-full-test-trace:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/stdio-linux-ci-boundary'
    name: Stdio Linux full Test trace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install strace and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Record trace environment
        run: |
          TRACE_ROOT="$RUNNER_TEMP/stdio-linux-full-test-trace"
          mkdir -p "$TRACE_ROOT"
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_SHA="$SOURCE_SHA" bun -e 'const os = require("node:os"); console.log(JSON.stringify({ runner_os: process.env.RUNNER_OS ?? process.platform, platform: process.platform, architecture: process.arch, kernel_release: os.release(), kernel_version: os.version(), bun_version: Bun.version, bun_revision: Bun.revision ?? null, node_version: process.version, source_sha: process.env.SOURCE_SHA }))' \
            > "$TRACE_ROOT/environment.json"
          printf '%s\n' "$SOURCE_SHA" > "$TRACE_ROOT/source-sha.txt"
          BUN_BIN="$(command -v bun)"
          BUN_REAL="$(readlink -f "$BUN_BIN")"
          {
            printf 'path=%s\n' "$BUN_BIN"
            printf 'resolved_path=%s\n' "$BUN_REAL"
            sha256sum "$BUN_REAL"
            file "$BUN_REAL"
          } > "$TRACE_ROOT/bun-binary-identity.txt"
          if command -v readelf > /dev/null 2>&1; then
            readelf -n "$BUN_REAL" > "$TRACE_ROOT/bun-build-id.txt"
          else
            printf 'readelf unavailable\n' > "$TRACE_ROOT/bun-build-id.txt"
          fi
          strace --version > "$TRACE_ROOT/strace-version.txt"
          test "$(bun --version)" = '1.3.14'

      # This observes descriptor lifecycle only. A successful traced run does
      # not identify a cause, repair protocol.test.ts, or clear any gate.
      - name: Trace full Test command
        run: |
          TRACE_ROOT="$RUNNER_TEMP/stdio-linux-full-test-trace"
          set +e
          strace -f -ttt -yy -k -o "$TRACE_ROOT/bun-run-test.strace" \
            -e trace=close,close_range,dup,dup2,dup3,fcntl,epoll_create,epoll_create1,epoll_ctl,pidfd_open,pidfd_getfd,execve,execveat,wait4,waitid,clone,clone3,fork,vfork,pipe,pipe2,socket,socketpair,open,openat,openat2,eventfd,eventfd2,timerfd_create,signalfd,signalfd4,accept,accept4 \
            bun run test
          status=$?
          printf '%s\n' "$status" > "$TRACE_ROOT/test-exit-status.txt"
          exit "$status"

      - name: Upload full Test trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stdio-linux-full-test-trace-${{ github.run_id }}
          path: ${{ runner.temp }}/stdio-linux-full-test-trace
          if-no-files-found: warn
          compression-level: 6
