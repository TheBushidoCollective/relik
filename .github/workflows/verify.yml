name: verify

on:
  pull_request:
  workflow_call:

# Deliberately not `push: branches: [main]`.
#
# The deploy workflow calls this one as its gate, so a push to main used to
# start two runs on the same ref. They shared the concurrency group below and
# cancelled each other: every merge left a `verify` run marked cancelled, and
# the race could just as easily have killed the run that gates the deploy
# rather than the redundant standalone one. On main, deploy owns verification.
concurrency:
  group: verify-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.9.8

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          # The versions in mise.toml, not whatever the runner ships.
          install: true
          cache: true

      - name: Configure OTIO browser proof path
        run: echo "OTIO_BROWSER_PROOF_DIR=$RUNNER_TEMP/otio-browser-proof" >> "$GITHUB_ENV"


      - name: Require Linux native build prerequisites
        run: |
          set -euo pipefail
          command -v docker
          docker version --format '{{.Server.Version}}'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils xvfb xauth
          command -v readelf
          command -v xvfb-run
          command -v xauth
          echo "RELIC_READELF=$(command -v readelf)" >> "$GITHUB_ENV"
      - name: Linux confinement probe
        run: |
          set -euo pipefail; unset CC
          node packages/relic-mcp/native/build.mjs --probe --target linux-x64-gnu --output-dir "$RUNNER_TEMP/confinement-probe-linux-x64-gnu"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Validate Terraform
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      # The anchor resolution tests crop a known colour out of a known
      # coordinate to prove the region geometry is not transposed, and they
      # need a real encoder to build that fixture and to perform the crop.
      # ffmpeg is optional at runtime, and the code path that degrades
      # without it is covered by a test that deliberately does not use it, so
      # installing it here buys the pixel-exact coverage rather than hiding
      # the fallback.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Builds the viewer first, because the asset tests serve real files out
      # of its dist.
      - name: Test
        run: bun run test

      - name: Build MCP bundle
        run: bun run --cwd packages/relic-mcp build

      - name: Cover path
        run: RELIC_CHROME_PATH="$(command -v google-chrome)" bun packages/relic-mcp/test/cover-path.ts
      - name: Notify path
        run: RELIC_CHROME_PATH=none bun packages/relic-mcp/test/notify-path.ts
      - name: Comment popover path
        run: RELIC_POPOVER_CHROME_PATH="$(command -v google-chrome)" env -u DISPLAY -u WAYLAND_DISPLAY bun packages/relic-mcp/test/comment-popover-path.ts
      - name: Upload comment popover shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comment-popover-path-shots
          path: comment-popover-path-shots/
      - name: Decision path
        run: RELIC_CHROME_PATH="$(command -v google-chrome)" bun packages/relic-mcp/test/decision-path.ts

      # Official OpenTimelineIO 0.18.1 conformance. The generator derives
      # expected ranges from the pinned library, not from this repo's
      # evaluator. A mismatch here is a real disagreement with the standard.
      - name: Install pinned uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.22"

      - name: Install headless Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends wget ca-certificates
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --headless=new --disable-gpu --dump-dom about:blank >/dev/null

      - name: OTIO conformance
        run: |
          command -v ffmpeg >/dev/null
          command -v ffprobe >/dev/null
          command -v uv >/dev/null
          uv run --with opentimelineio==0.18.1 python3 scripts/generate-otio-fixtures.py --check
          bash scripts/generate-otio-media.sh --check

      # Loopback-only path. The script prints OTIO_PATH_OK only after the
      # browser, official reader, and fresh MCP readback all pass.
      - name: Prepare OTIO browser proof receipt
        run: mkdir -p "$OTIO_BROWSER_PROOF_DIR"

      - name: OTIO browser negative controls
        run: |
          set -euo pipefail
          RELIC_OTIO_PATH_CLIENT=source \
            RELIC_OTIO_CHROME_PATH="$(command -v google-chrome)" \
            xvfb-run -a bun packages/relic-mcp/test/otio-browser-controls.ts --negative-source \
            2>&1 | tee "$OTIO_BROWSER_PROOF_DIR/negative-source.log"

      - name: OTIO path
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null
          command -v ffprobe >/dev/null
          command -v uv >/dev/null
          command -v google-chrome >/dev/null
          RELIC_OTIO_PATH_CLIENT=source \
            RELIC_OTIO_CHROME_PATH="$(command -v google-chrome)" \
            env -u DISPLAY -u WAYLAND_DISPLAY \
              bun packages/relic-mcp/test/otio-path.ts \
              2>&1 | tee "$OTIO_BROWSER_PROOF_DIR/otio-path.log"

      - name: Upload OTIO browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otio-browser-proof-linux
          path: |
            ${{ env.OTIO_BROWSER_PROOF_DIR }}
            otio-path-shots
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

  otio-headless-smoke-macos:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Require Bun 1.4.3
        run: test "$(bun --version)" = "1.4.3"
      - name: Configure OTIO browser proof paths
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/relic-playwright-browsers" >> "$GITHUB_ENV"
          echo "OTIO_BROWSER_PROOF_DIR=$RUNNER_TEMP/otio-browser-proof" >> "$GITHUB_ENV"


      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build MCP bundle for browser controls
        run: bun run --cwd packages/relic-mcp build

      - name: Prepare OTIO browser proof receipt
        run: mkdir -p "$OTIO_BROWSER_PROOF_DIR"

      - name: Install Playwright 1.61.1 headless shell
        run: |
          set -euo pipefail
          mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          bunx playwright@1.61.1 install chromium-headless-shell \
            2>&1 | tee "$OTIO_BROWSER_PROOF_DIR/playwright-install.log"

      - name: Resolve Playwright headless shell
        run: |
          set -euo pipefail
          shells=()
          while IFS= read -r candidate; do
            shells+=("$candidate")
          done < <(find "$PLAYWRIGHT_BROWSERS_PATH" -type f \
            \( -name headless_shell -o -name chrome-headless-shell \) -print)
          if [ "${#shells[@]}" -ne 1 ]; then
            printf 'expected one Playwright headless shell, found %s\n' "${#shells[@]}" >&2
            if [ "${#shells[@]}" -gt 0 ]; then
              printf '%s\n' "${shells[@]}" >&2
            fi
            exit 1
          fi
          test -x "${shells[0]}"
          case "${shells[0]}" in
            "$PLAYWRIGHT_BROWSERS_PATH"/chromium_headless_shell-1228/*) ;;
            *)
              printf 'headless shell is not Playwright revision 1228\n' >&2
              exit 1
              ;;
          esac
          printf '%s\n' "${shells[0]}" > "$OTIO_BROWSER_PROOF_DIR/headless-shell-path.txt"
          printf 'RELIC_OTIO_CHROME_PATH=%s\n' "${shells[0]}" >> "$GITHUB_ENV"

      - name: OTIO headless shell smoke
        env:
          RELIC_OTIO_PATH_CLIENT: source
        run: |
          set -euo pipefail
          : "${RELIC_OTIO_CHROME_PATH:?Playwright headless shell was not resolved}"
          RELIC_OTIO_PATH_CLIENT=source \
            RELIC_OTIO_CHROME_PATH="$RELIC_OTIO_CHROME_PATH" \
            bun packages/relic-mcp/test/otio-browser-controls.ts --smoke \
            2>&1 | tee "$OTIO_BROWSER_PROOF_DIR/smoke.log"

      - name: Upload OTIO browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otio-browser-proof-macos
          path: ${{ env.OTIO_BROWSER_PROOF_DIR }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

  # Builds exactly what deploy builds, but never pushes the local image. The
  # smoke is the image boundary that unit tests and a runner-side viewer build
  # cannot see.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: relic-server:verify-${{ github.sha }}
      CONTAINER: relic-image-smoke

    steps:
      - uses: actions/checkout@v4

      - name: Prepare image smoke receipt
        run: |
          SMOKE_DIR="$RUNNER_TEMP/relic-image-smoke"
          echo "SMOKE_DIR=$SMOKE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SMOKE_DIR"

      - name: Build the deploy image without pushing it
        run: |
          set -euo pipefail
          docker build -f deploy/docker/server/Dockerfile -t "$IMAGE" .

      - name: Boot the image and smoke its served assets
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE_DIR"
          BASE='http://127.0.0.1:18080'
          docker rm -f "$CONTAINER" > "$SMOKE_DIR/preclean.log" 2>&1 || true
          docker run --detach --name "$CONTAINER" --env NODE_ENV=development \
            --publish 127.0.0.1:18080:8080 "$IMAGE" \
            > "$SMOKE_DIR/container-id.txt"

          healthy=0
          for attempt in $(seq 1 30); do
            if curl -fsS "$BASE/health" \
              > "$SMOKE_DIR/health-$attempt.json" \
              2> "$SMOKE_DIR/health-$attempt.stderr"; then
              if grep -q '"status":"ok"' "$SMOKE_DIR/health-$attempt.json"; then
                cp "$SMOKE_DIR/health-$attempt.json" "$SMOKE_DIR/health.json"
                healthy=1
                break
              fi
            fi
            sleep 1
          done
          test "$healthy" -eq 1

          for P in \
            /assets/viewer.js \
            /assets/home.js \
            /assets/styles.css \
            /assets/register-sw.js \
            /manifest.webmanifest \
            /sw.js \
            /assets/icon.svg \
            /assets/otio-video-timing-worker.js; do
            FILE="${P#/}"
            FILE="${FILE//\//_}"
            if ! curl -fsS "$BASE$P" -o "$SMOKE_DIR/$FILE"; then
              echo "MISSING $P" >&2
              exit 1
            fi
          done

      - name: Collect image logs and remove the container
        if: always()
        run: |
          set +e
          mkdir -p "$SMOKE_DIR"
          docker logs "$CONTAINER" > "$SMOKE_DIR/container.log" 2>&1 || true
          cat "$SMOKE_DIR/container.log"
          docker rm -f "$CONTAINER" > "$SMOKE_DIR/container-remove.log" 2>&1 || true

      # This happens after the Docker build on purpose. A runner-built dist in
      # the checkout would otherwise become Docker build context and conceal an
      # image that never ran the viewer build.
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Record image and runner viewer hashes
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run --filter '@relic/viewer' build
          IMAGE_SHA="$(sha256sum "$SMOKE_DIR/assets_viewer.js" | cut -d ' ' -f 1)"
          RUNNER_SHA="$(sha256sum packages/relic-viewer/dist/viewer.js | cut -d ' ' -f 1)"
          {
            echo '### Image viewer asset hashes'
            echo '| source | SHA-256 |'
            echo '| --- | --- |'
            # Markdown code spans are literal.
            # shellcheck disable=SC2016
            printf '| image `/assets/viewer.js` | `%s` |\n' "$IMAGE_SHA"
            # shellcheck disable=SC2016
            printf '| runner `packages/relic-viewer/dist/viewer.js` | `%s` |\n' "$RUNNER_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
