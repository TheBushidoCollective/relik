name: publish-mcp

# Publishing is manual and versioned. The package can read local files, so a
# release is an explicit decision rather than a merge side effect.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.1.0'
        required: true
        type: string
      dry_run:
        description: 'Pack and prove without publishing'
        type: boolean
        default: true

concurrency:
  group: publish-mcp
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  native-build:
    name: native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64-gnu
          - runner: ubuntu-24.04
            target: linux-x64-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and audit the target prebuild
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          NODE_INCLUDE="$(node -p "const p = require('node:path'); p.join(p.dirname(p.dirname(process.execPath)), 'include', 'node')")"
          test -f "$NODE_INCLUDE/node_api.h"
          node packages/relic-mcp/native/build.mjs \
            --target "$TARGET" \
            --node-include "$NODE_INCLUDE" \
            --cc "${CC:-cc}"
          node packages/relic-mcp/native/build.mjs --check --target "$TARGET"

          OUT="$RUNNER_TEMP/native-$TARGET"
          mkdir -p "$OUT"
          cp "packages/relic-mcp/prebuilds/$TARGET/secure_open.node" "$OUT/"
          cp "packages/relic-mcp/prebuilds/$TARGET/build-info.json" "$OUT/"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/native-${{ matrix.target }}
          if-no-files-found: error

  pack:
    needs: [verify, native-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Trusted publishing requires a current npm. No registry-url is set: it
      # would materialize a placeholder token and prevent OIDC from taking over.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: native-darwin-arm64
          path: ${{ runner.temp }}/native/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: native-darwin-x64
          path: ${{ runner.temp }}/native/darwin-x64
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64-gnu
          path: ${{ runner.temp }}/native/linux-arm64-gnu
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64-gnu
          path: ${{ runner.temp }}/native/linux-x64-gnu

      - name: Place audited prebuilds in the package
        run: |
          set -euo pipefail
          for TARGET in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
            DEST="packages/relic-mcp/prebuilds/$TARGET"
            mkdir -p "$DEST"
            cp "$RUNNER_TEMP/native/$TARGET/secure_open.node" "$DEST/"
            cp "$RUNNER_TEMP/native/$TARGET/build-info.json" "$DEST/"
          done
          # This portable check proves the tarball carries all audited files.
          # Per-target jobs above and packed-target probes below perform the
          # platform-specific otool/readelf checks.
          node packages/relic-mcp/native/build.mjs --check --metadata-only

      # npm cannot resolve bun workspace protocol dependencies from a package
      # directory. Write only this release copy, then publish its tarball.
      - name: Set release version
        working-directory: packages/relic-mcp
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.argv[1];
            delete pkg.devDependencies;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "${{ inputs.version }}"

      - name: Build the readable bundle and native loader
        run: bun run --filter 'relic-mcp' build

      - name: Check generated plugin manifests and launch config
        working-directory: packages/relic-mcp
        run: |
          set -euo pipefail
          for FILE in .claude-plugin/plugin.json .claude-plugin/marketplace.json mcp-servers.json; do
            test -f "$FILE" || { echo "$FILE was not generated"; exit 1; }
          done
          node -e '
            const fs = require("node:fs");
            const want = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const plugin = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json", "utf8"));
            const market = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
            const mcp = JSON.parse(fs.readFileSync("mcp-servers.json", "utf8"));
            const found = [plugin.version, market.plugins[0].version, market.metadata.version];
            if (pkg.version !== want || found.some((value) => value !== want)) {
              throw new Error(`plugin manifests disagree with ${want}: package=${pkg.version}, manifests=${found.join(", ")}`);
            }
            const server = mcp.relic;
            const args = server?.args;
            const expected = `${pkg.name}@${want}`;
            if (
              plugin.mcpServers !== "./mcp-servers.json" ||
              server?.type !== "stdio" ||
              server.command !== "npx" ||
              !Array.isArray(args) ||
              args.length !== 2 ||
              args[0] !== "-y" ||
              args[1] !== expected ||
              server.env?.RELIC_CLIENT_NAME !== `relic-plugin/${want}`
            ) {
              throw new Error(`generated MCP launch config does not pin ${expected}`);
            }
          ' "${{ inputs.version }}"

      - name: Pack the release tarball
        id: package
        working-directory: packages/relic-mcp
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --pack-destination "$RUNNER_TEMP" --silent --no-workspaces)"
          test -f "$RUNNER_TEMP/$TARBALL"
          echo "tarball=$RUNNER_TEMP/$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Check packed contents
        working-directory: packages/relic-mcp
        run: |
          set -euo pipefail
          TARBALL="${{ steps.package.outputs.tarball }}"
          PROBE="$RUNNER_TEMP/contents-probe"
          mkdir -p "$PROBE"
          cd "$PROBE"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --offline "$TARBALL" >/dev/null
          for FILE in \
            node_modules/relic-mcp/dist/relic-mcp.js \
            node_modules/relic-mcp/dist/native-secure-open.js \
            node_modules/relic-mcp/dist/native-secure-open.d.ts \
            node_modules/relic-mcp/native/secure-open.c \
            node_modules/relic-mcp/native/build.mjs \
            node_modules/relic-mcp/scripts/prove-packed-native.mjs \
            node_modules/relic-mcp/.claude-plugin/plugin.json \
            node_modules/relic-mcp/.claude-plugin/marketplace.json \
            node_modules/relic-mcp/mcp-servers.json \
            node_modules/relic-mcp/skills/relic/SKILL.md
          do
            test -f "$FILE" || { echo "$FILE is missing from the tarball"; exit 1; }
          done
          for TARGET in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
            test -f "node_modules/relic-mcp/prebuilds/$TARGET/secure_open.node"
            test -f "node_modules/relic-mcp/prebuilds/$TARGET/build-info.json"
          done
          node -e '
            const fs = require("node:fs");
            const root = "node_modules/relic-mcp";
            const want = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync(`${root}/package.json`, "utf8"));
            const plugin = JSON.parse(fs.readFileSync(`${root}/.claude-plugin/plugin.json`, "utf8"));
            const market = JSON.parse(fs.readFileSync(`${root}/.claude-plugin/marketplace.json`, "utf8"));
            const mcp = JSON.parse(fs.readFileSync(`${root}/mcp-servers.json`, "utf8"));
            const found = [plugin.version, market.plugins[0].version, market.metadata.version];
            if (pkg.version !== want || found.some((value) => value !== want)) {
              throw new Error(`packed plugin manifests disagree with ${want}: package=${pkg.version}, manifests=${found.join(", ")}`);
            }
            const server = mcp.relic;
            const args = server?.args;
            const expected = `${pkg.name}@${want}`;
            if (
              plugin.mcpServers !== "./mcp-servers.json" ||
              server?.type !== "stdio" ||
              server.command !== "npx" ||
              !Array.isArray(args) ||
              args.length !== 2 ||
              args[0] !== "-y" ||
              args[1] !== expected ||
              server.env?.RELIC_CLIENT_NAME !== `relic-plugin/${want}`
            ) {
              throw new Error(`packed MCP launch config does not pin ${expected}`);
            }
          ' "${{ inputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: relic-mcp-tarball
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error

      - name: Summarize packed artifact
        working-directory: packages/relic-mcp
        run: |
          {
            echo "### relic-mcp ${{ inputs.version }}"
            npm pack --dry-run --json --no-workspaces | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => (raw += chunk));
              process.stdin.on("end", () => {
                const parsed = JSON.parse(raw);
                const meta = Array.isArray(parsed) ? parsed[0] : parsed;
                console.log(`files: ${meta.entryCount}, unpacked: ${meta.unpackedSize} bytes`);
              });
            '
          } >> "$GITHUB_STEP_SUMMARY"

  packed-native-probe:
    needs: pack
    name: packed native ${{ matrix.target }} on Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            node: '18.20.8'
          - runner: macos-15
            target: darwin-arm64
            node: '24'
          - runner: macos-15-intel
            target: darwin-x64
            node: '18.20.8'
          - runner: macos-15-intel
            target: darwin-x64
            node: '24'
          - runner: ubuntu-24.04-arm
            target: linux-arm64-gnu
            node: '18.20.8'
          - runner: ubuntu-24.04-arm
            target: linux-arm64-gnu
            node: '24'
          - runner: ubuntu-24.04
            target: linux-x64-gnu
            node: '18.20.8'
          - runner: ubuntu-24.04
            target: linux-x64-gnu
            node: '24'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v4
        with:
          name: relic-mcp-tarball
          path: ${{ runner.temp }}/tarball

      - name: Prove the installed tarball without Bun or the checkout
        run: |
          set -euo pipefail
          set -- "$RUNNER_TEMP"/tarball/*.tgz
          test -f "$1"
          RELIC_MCP_PROVE_HIDE_SOURCE=1 \
          RELIC_MCP_PROVE_SOURCE_ROOT="$GITHUB_WORKSPACE" \
          node packages/relic-mcp/scripts/prove-packed-native.mjs "$1"

  publish:
    needs: [pack, packed-native-probe]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - uses: actions/download-artifact@v4
        with:
          name: relic-mcp-tarball
          path: ${{ runner.temp }}/tarball

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          set -- "$RUNNER_TEMP"/tarball/*.tgz
          test -f "$1"
          npm publish "$1" --access public
